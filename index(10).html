function pinLogic(){if(!p1.pin&&!p2.pin)return;countTimer++;if(countTimer%55===0){count++;message.textContent=count<3?count:'3 — PINFALL!';if(count>=3){gameOver=true;setTimeout(()=>{message.textContent=(p1.state==='pinning'?'CODY WINS!':'ROMAN WINS!');rematch.style.display='block'},250)}}}

function separate(a,b){if(['down','pinned'].includes(a.state)||['down','pinned'].includes(b.state)||a.grab===b||b.grab===a)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=64;if(d<min){const push=(min-d)/2;a.x-=dx/d*push;b.x+=dx/d*push;a.y-=dy/d*push*.25;b.y+=dy/d*push*.25}}

function drawCrowd(){const r=ring();ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let row=0;row<4;row++)for(let i=0;i<Math.ceil(W/34)+1;i++){let x=i*34+(row%2)*16,y=r.ry-44-row*38;ctx.fillStyle=`hsl(${(i*41+row*69)%360} 25% 32%)`;ctx.fillRect(x-10,y,20,30);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% 62%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill()}ctx.fillStyle='#353941';ctx.fillRect(0,r.ry-18,W,18)}
function drawRing(){const r=ring();ctx.fillStyle='#20242b';ctx.fillRect(r.rx-50,r.ry+35,r.rw+100,r.rh+75);ctx.fillStyle='#d7e1e8';ctx.fillRect(r.rx,r.ry,r.rw,r.rh);ctx.strokeStyle='#aeb4ba';ctx.lineWidth=4;[r.ry+28,r.ry+50,r.ry+72].forEach(y=>{ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});ctx.fillStyle='#111';ctx.fillRect(r.rx-9,r.ry-4,12,r.rh+28);ctx.fillRect(r.rx+r.rw-3,r.ry-4,12,r.rh+28);ctx.fillStyle='#181a20';ctx.fillRect(r.rx,r.ry+r.rh,r.rw,35)}

function centered(im,x,y,w,h,rot=0,flip=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function along(im,a,b,width,over=8,flip=false){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dx,dy);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(-ang);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-width/2,-over,width,len+over*2);ctx.restore()}

const PART_SCALE={
  cody:{head:.84,torso:.72,upper:.78,fore:.78,pelvis:.34,thigh:.78,boot:.76},
  roman:{head:.83,torso:.70,upper:.77,fore:.77,pelvis:.36,thigh:.78,boot:.68}
};
function trPoint(p,pivot,angle,scale,flip=false){
  let x=(p[0]-pivot[0])*(flip?-1:1)*scale;
  let y=(p[1]-pivot[1])*scale;
  const ca=Math.cos(angle),sa=Math.sin(angle);
  return {x:x*ca-y*sa,y:x*sa+y*ca};
}
function placeAnchored(im,world,pivot,angle,scale,flip=false){
  ctx.save();
  ctx.translate(world.x,world.y);
  ctx.rotate(angle);
  ctx.scale(flip?-scale:scale,scale);
  ctx.drawImage(im,-pivot[0],-pivot[1]);
  ctx.restore();
}
function childPoint(world,p,pivot,angle,scale,flip=false){
  const q=trPoint(p,pivot,angle,scale,flip);
  return {x:world.x+q.x,y:world.y+q.y};
}
function pose(w){
  let root=0,bob=0,pelvis=0,head=0;
  let L={ua:0,fa:0,th:0,lo:0},R={ua:0,fa:0,th:0,lo:0};
  const speed=Math.hypot(w.vx,w.vy);
  if(w.state==='idle'&&speed<.08){
    bob=Math.sin(T*.004+w.walkPhase)*1.25;
    L.ua=Math.sin(T*.003+w.walkPhase)*.025;
    R.ua=-L.ua;
  }
  if(w.state==='idle'&&speed>=.08){
    const runAmp=(running&&w.human)||speed>.65 ? .42 : .25;
    const sw=Math.sin(w.walkPhase);
    L.th=runAmp*sw; R.th=-runAmp*sw;
    L.lo=-.22*sw; R.lo=.22*sw;
    L.ua=-.28*sw; R.ua=.28*sw;
    bob=Math.abs(Math.cos(w.walkPhase))*1.7;
    pelvis=.025*Math.sin(w.walkPhase);
  }
  if(w.state==='strike'){
    const p=1-w.timer/18, snap=Math.sin(Math.min(1,p)*Math.PI);
    if(w.dir>=0){R.ua=-.78*snap;R.fa=-.88*snap;L.ua=.08*snap}
    else{L.ua=.78*snap;L.fa=.88*snap;R.ua=-.08*snap}
    root=-.04*w.dir*snap; head=.025*w.dir*snap;
  }
  if(w.state==='hurt'){
    L.ua=.35;L.fa=.18;R.ua=-.35;R.fa=-.18;
    root=.09*w.dir; head=.06*w.dir;
  }
  if(w.state==='grapple'){
    L.ua=.55;L.fa=.38;R.ua=-.55;R.fa=-.38;
    L.th=.05;R.th=-.05;
  }
  if(w.state==='grappled'){
    L.ua=.85;L.fa=.62;R.ua=-.85;R.fa=-.62;
    root=-.055*w.dir;
  }
  if(w.state==='pinning'){
    root=.18*w.dir;
    L.ua=.35;R.ua=-.35;L.fa=.15;R.fa=-.15;
    L.th=.18;R.th=-.18;L.lo=-.12;R.lo=.12;
  }
  if(w.state==='down'){
    root=-1.48*w.dir;
    L.ua=.55;L.fa=.25;R.ua=-.45;R.fa=-.2;
    L.th=.38;L.lo=-.32;R.th=-.25;R.lo=.3;
    head=-.05*w.dir;
  }
  if(w.state==='pinned'){
    root=-1.48*w.dir;
    L.ua=.38;L.fa=.15;R.ua=-.32;R.fa=-.12;
    L.th=.18;L.lo=-.14;R.th=-.14;R.lo=.12;
  }
  return {root,bob,pelvis,head,L,R};
}
function drawRigged(w){
  const isC=w.type==='cody', rr=isC?RIG.cody:RIG.roman, ps=isC?PART_SCALE.cody:PART_SCALE.roman;
  const r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),g=.72+depth*.08;
  const Q=pose(w);
  const torsoIm=isC?IMG.c_torso:IMG.r_torso;
  const headIm=isC?IMG.c_head:IMG.r_head;
  const pelvisIm=isC?IMG.c_trunks:IMG.r_pants;
  const thighIm=isC?IMG.c_thigh:IMG.r_thigh;
  const bootIm=isC?IMG.c_boot:IMG.r_boot;

  ctx.save();
  ctx.translate(w.x,w.y+Q.bob);
  ctx.rotate(Q.root);

  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath();ctx.ellipse(0,78,38,9,0,0,7);ctx.fill();

  // Torso root is the green waist marker.
  const root={x:0,y:0};
  const torsoS=g*ps.torso;
  placeAnchored(torsoIm,root,rr.torso.waist,0,torsoS,false);

  const neck=childPoint(root,rr.torso.neck,rr.torso.waist,0,torsoS,false);
  const shL=childPoint(root,rr.torso.shoulderL,rr.torso.waist,0,torsoS,false);
  const shR=childPoint(root,rr.torso.shoulderR,rr.torso.waist,0,torsoS,false);

  // Head uses the exact red neck marker.
  placeAnchored(headIm,neck,rr.head.neck,Q.head,g*ps.head,false);

  // Full pelvis uses user's completed pelvis sprite and exact green marker.
  const pelvisS=g*ps.pelvis;
  placeAnchored(pelvisIm,root,rr.pelvis.waist,Q.pelvis,pelvisS,false);
  const hipL=childPoint(root,rr.pelvis.hipL,rr.pelvis.waist,Q.pelvis,pelvisS,false);
  const hipR=childPoint(root,rr.pelvis.hipR,rr.pelvis.waist,Q.pelvis,pelvisS,false);

  // Legs — one source piece mirrored for opposite side.
  const thighS=g*ps.thigh, bootS=g*ps.boot;
  placeAnchored(thighIm,hipL,rr.thigh.hip,Q.L.th,thighS,false);
  const kneeL=childPoint(hipL,rr.thigh.knee,rr.thigh.hip,Q.L.th,thighS,false);
  placeAnchored(bootIm,kneeL,rr.boot.knee,Q.L.lo,bootS,false);

  placeAnchored(thighIm,hipR,rr.thigh.hip,Q.R.th,thighS,true);
  const kneeR=childPoint(hipR,rr.thigh.knee,rr.thigh.hip,Q.R.th,thighS,true);
  placeAnchored(bootIm,kneeR,rr.boot.knee,Q.R.lo,bootS,true);

  if(isC){
    const armS=g*ps.upper, foreS=g*ps.fore;
    placeAnchored(IMG.c_upper,shL,rr.upper.shoulder,Q.L.ua,armS,false);
    const elL=childPoint(shL,rr.upper.elbow,rr.upper.shoulder,Q.L.ua,armS,false);
    placeAnchored(IMG.c_fore,elL,rr.fore.elbow,Q.L.fa,foreS,false);

    placeAnchored(IMG.c_upper,shR,rr.upper.shoulder,Q.R.ua,armS,true);
    const elR=childPoint(shR,rr.upper.elbow,rr.upper.shoulder,Q.R.ua,armS,true);
    placeAnchored(IMG.c_fore,elR,rr.fore.elbow,Q.R.fa,foreS,true);
  }else{
    const armS=g*ps.upper, foreS=g*ps.fore;
    // Roman viewer-left: tattoo upper arm + red glove.
    placeAnchored(IMG.r_upper_tat,shL,rr.upperTat.shoulder,Q.L.ua,armS,false);
    const elL=childPoint(shL,rr.upperTat.elbow,rr.upperTat.shoulder,Q.L.ua,armS,false);
    placeAnchored(IMG.r_fore_red,elL,rr.foreRed.elbow,Q.L.fa,foreS,false);

    // Roman viewer-right: bare upper arm + black glove.
    placeAnchored(IMG.r_upper_bare,shR,rr.upperBare.shoulder,Q.R.ua,armS,true);
    const elR=childPoint(shR,rr.upperBare.elbow,rr.upperBare.shoulder,Q.R.ua,armS,true);
    placeAnchored(IMG.r_fore_black,elR,rr.foreBlack.elbow,Q.R.fa,foreS,true);
  }

  ctx.restore();
}
function drawCody(w){drawRigged(w)}
function drawRoman(w){drawRigged(w)}

function drawW(w){w.type==='cody'?drawCody(w):drawRoman(w)}
function draw(){drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(ts){T=ts;playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);separate(p1,p2);pinLogic();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
