<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wrestling SVG Animation Editor</title>
<style>
  :root{
    --bg:#111722;--panel:#1a2230;--panel2:#222c3b;--text:#f4f7fb;--muted:#aeb8c7;
    --player:#2f7df6;--cpu:#e34e4e;--accent:#ffd166;--border:#364458;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(#162033,#0f141d);color:var(--text);font-family:Arial,Helvetica,sans-serif}
  .app{max-width:1400px;margin:0 auto;padding:16px}
  h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px)}
  .sub{color:var(--muted);margin-bottom:14px;line-height:1.45}
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:14px}
  .card{background:rgba(26,34,48,.98);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.22)}
  .arena{position:relative;height:520px;border-radius:14px;overflow:hidden;background:linear-gradient(#31445d 0 40%,#252e3a 40% 100%)}
  .crowd{position:absolute;inset:0 0 auto 0;height:40%;opacity:.45;background:
    radial-gradient(circle at 10% 30%,#cfd6df 0 3px,transparent 4px),
    radial-gradient(circle at 25% 55%,#aab5c5 0 3px,transparent 4px),
    radial-gradient(circle at 45% 35%,#d9dee5 0 3px,transparent 4px),
    radial-gradient(circle at 65% 50%,#a7b3c3 0 3px,transparent 4px),
    radial-gradient(circle at 85% 30%,#d1d6dd 0 3px,transparent 4px);
    background-size:110px 70px}
  .ring{position:absolute;left:6%;right:6%;bottom:8%;height:58%}
  .mat{position:absolute;left:4%;right:4%;bottom:0;height:55%;background:#dbe8ef;border:5px solid #57697c;box-shadow:0 14px 0 #303b49}
  .rope{position:absolute;left:3%;right:3%;height:4px;background:#eef2f6;z-index:2}
  .r1{bottom:76%}.r2{bottom:58%}.r3{bottom:40%}
  .post{position:absolute;bottom:10%;width:14px;height:82%;background:#3a4658;border:3px solid #222a35;z-index:3}
  .pl{left:2%}.pr{right:2%}
  .fighter{position:absolute;bottom:17%;width:155px;height:220px;transform-origin:50% 86%;pointer-events:none}
  .fighter.player{left:20%}.fighter.cpu{left:67%}
  .fighter-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 1px rgba(0,0,0,.16))}
  .fighter.cpu .fighter-svg{transform:scaleX(-1);transform-origin:50% 50%}
  .bone{stroke:#202733;stroke-linecap:round;stroke-linejoin:round}
  .skin-bone{stroke:#e8b18e}.gear-bone{stroke:#161f2d}
  .joint{stroke:#202733;stroke-width:3}.skin-joint{fill:#e8b18e}.gear-joint{fill:#161f2d}
  .torso-shape{stroke:#202733;stroke-width:4;stroke-linejoin:round}
  .player .torso-shape{fill:var(--player)} .cpu .torso-shape{fill:var(--cpu)}
  .torso-highlight{fill:rgba(255,255,255,.14)}
  .head-shape{fill:#e8b18e;stroke:#202733;stroke-width:4}
  .hair-shape{fill:#372b27}.face-eye{fill:#202733}
  .face-nose{fill:none;stroke:#9a654c;stroke-width:2;stroke-linecap:round}
  .boot-shape{fill:#0d141f;stroke:#202733;stroke-width:3;stroke-linejoin:round}
  .far-limb{opacity:.78}
  .nameplate{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:11px;font-weight:800;background:#101722;padding:3px 8px;border-radius:999px;border:1px solid #39475a}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  button,.tab,input,select,textarea{font:inherit}
  button,.tab{border:1px solid #46556a;background:#2a3445;color:var(--text);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
  button:hover,.tab:hover{background:#39465b}.tab.active{outline:2px solid var(--accent)}
  .control-list{display:grid;grid-template-columns:1fr;gap:9px;max-height:485px;overflow:auto;padding-right:4px}
  .control-row{background:var(--panel2);border:1px solid #344257;border-radius:10px;padding:9px}
  .control-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:13px}
  .control-row input[type=range]{width:100%}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .timeline{margin-top:14px}
  .kf-list{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
  .kf{min-width:130px;background:var(--panel2);border:1px solid #3b495d;border-radius:10px;padding:9px}
  .kf.active{outline:2px solid var(--accent)}
  .kf small{color:var(--muted)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{font-size:13px;color:var(--muted)}
  input[type=number],input[type=text],textarea,select{
    width:100%;margin-top:4px;background:#111824;color:var(--text);border:1px solid #3b495d;border-radius:8px;padding:9px
  }
  textarea{min-height:160px;resize:vertical}
  .section-title{font-size:14px;font-weight:800;margin:14px 0 8px}
  .status{margin-top:8px;color:var(--accent);min-height:20px;font-size:13px}
  @media(max-width:980px){
    .grid{grid-template-columns:1fr}
    .arena{height:430px}
  }
</style>
</head>
<body>
<div class="app">
  <h1>Wrestling Animation Editor</h1>
  <div class="sub">Pose the current SVG wrestlers yourself, save keyframes, set timing, preview the move, then export the animation data.</div>

  <div class="grid">
    <div>
      <div class="card">
        <div class="arena">
          <div class="crowd"></div>
          <div class="ring">
            <div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div>
            <div class="post pl"></div><div class="post pr"></div><div class="mat"></div>

            <div id="playerFighter" class="fighter player">
              <svg class="fighter-svg" viewBox="0 0 160 220"></svg>
              <div class="nameplate">PLAYER</div>
            </div>
            <div id="cpuFighter" class="fighter cpu">
              <svg class="fighter-svg" viewBox="0 0 160 220"></svg>
              <div class="nameplate">CPU</div>
            </div>
          </div>
        </div>

        <div class="toolbar">
          <button id="resetPose">Reset Current Pose</button>
          <button id="saveKeyframe">Save Keyframe</button>
          <button id="updateKeyframe">Update Selected</button>
          <button id="preview">▶ Preview Animation</button>
          <button id="stopPreview">■ Stop</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="card timeline">
        <div class="row">
          <div>
            <label>Move name
              <input id="moveName" type="text" value="My Custom Move">
            </label>
          </div>
          <div>
            <label>Current keyframe duration (ms)
              <input id="duration" type="number" min="40" max="3000" step="10" value="250">
            </label>
          </div>
        </div>

        <div class="section-title">Keyframes</div>
        <div id="keyframes" class="kf-list"></div>

        <div class="toolbar">
          <button id="deleteKeyframe">Delete Selected</button>
          <button id="moveLeft">← Move Earlier</button>
          <button id="moveRight">Move Later →</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="tabs">
          <button class="tab active" data-side="player">Edit Player</button>
          <button class="tab" data-side="cpu">Edit CPU</button>
        </div>
        <div id="controls" class="control-list"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="section-title">Export / Import Move Data</div>
        <textarea id="jsonBox" placeholder="Animation JSON will appear here..."></textarea>
        <div class="toolbar">
          <button id="exportJson">Export JSON</button>
          <button id="copyJson">Copy JSON</button>
          <button id="importJson">Import JSON</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SVG_NS="http://www.w3.org/2000/svg";

const BASE_POSE={
  x:0,y:0,bodyRot:0,bodyLean:0,headTilt:-3,
  nearUpperArm:34,nearForearm:-38,
  farUpperArm:19,farForearm:-28,
  nearThigh:8,nearShin:-7,
  farThigh:-9,farShin:9
};

const CONTROL_DEFS=[
  ["x","Horizontal Position",0,100,1],
  ["y","Vertical Position",-90,90,1],
  ["bodyRot","Whole Body Rotation",-180,180,1],
  ["bodyLean","Torso Lean",-70,70,1],
  ["headTilt","Head Tilt",-70,70,1],
  ["nearUpperArm","Near Upper Arm",-180,180,1],
  ["nearForearm","Near Forearm",-180,180,1],
  ["farUpperArm","Far Upper Arm",-180,180,1],
  ["farForearm","Far Forearm",-180,180,1],
  ["nearThigh","Near Thigh",-180,180,1],
  ["nearShin","Near Shin",-180,180,1],
  ["farThigh","Far Thigh",-180,180,1],
  ["farShin","Far Shin",-180,180,1]
];

function createFighter(element,homeX){
  return {element,svg:element.querySelector(".fighter-svg"),homeX,pose:{...BASE_POSE,x:homeX}};
}
const fighters={
  player:createFighter(document.getElementById("playerFighter"),20),
  cpu:createFighter(document.getElementById("cpuFighter"),67)
};

function pointFrom(start,length,angleDeg){
  const r=angleDeg*Math.PI/180;
  return {x:start.x+Math.sin(r)*length,y:start.y+Math.cos(r)*length};
}
function rotatePoint(p,c,deg){
  const r=deg*Math.PI/180,dx=p.x-c.x,dy=p.y-c.y;
  return {x:c.x+dx*Math.cos(r)-dy*Math.sin(r),y:c.y+dx*Math.sin(r)+dy*Math.cos(r)};
}
function svgEl(name,attrs={}){
  const el=document.createElementNS(SVG_NS,name);
  for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);
  return el;
}
function line(svg,a,b,cls,width){
  svg.appendChild(svgEl("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:`bone ${cls}`,"stroke-width":width}));
}
function circle(svg,p,r,cls){
  svg.appendChild(svgEl("circle",{cx:p.x,cy:p.y,r,class:`joint ${cls}`}));
}
function polygon(svg,pts,cls){
  svg.appendChild(svgEl("polygon",{points:pts.map(p=>`${p.x},${p.y}`).join(" "),class:cls}));
}

function renderFighter(f){
  const p=f.pose,svg=f.svg; svg.innerHTML="";
  const center={x:82,y:108},sy=p.y||0;

  let farShoulder={x:67,y:58+sy},nearShoulder={x:111,y:65+sy};
  let farHip={x:73,y:116+sy},nearHip={x:101,y:121+sy};
  let neck={x:91,y:51+sy},headCenter={x:101,y:31+sy};

  const br=(p.bodyRot||0)+(p.bodyLean||0);
  [farShoulder,nearShoulder,farHip,nearHip,neck,headCenter]=
    [farShoulder,nearShoulder,farHip,nearHip,neck,headCenter].map(q=>rotatePoint(q,center,br));

  const farElbow=pointFrom(farShoulder,35,p.farUpperArm+br);
  const farWrist=pointFrom(farElbow,34,p.farForearm+br);
  const nearElbow=pointFrom(nearShoulder,39,p.nearUpperArm+br);
  const nearWrist=pointFrom(nearElbow,37,p.nearForearm+br);
  const farKnee=pointFrom(farHip,43,p.farThigh+br);
  const farAnkle=pointFrom(farKnee,44,p.farShin+br);
  const nearKnee=pointFrom(nearHip,46,p.nearThigh+br);
  const nearAnkle=pointFrom(nearKnee,46,p.nearShin+br);

  const fg=svgEl("g",{class:"far-limb"});
  line(fg,farHip,farKnee,"gear-bone",17); line(fg,farKnee,farAnkle,"gear-bone",16); circle(fg,farKnee,7,"gear-joint");
  line(fg,farShoulder,farElbow,"skin-bone",15); line(fg,farElbow,farWrist,"skin-bone",14); circle(fg,farElbow,6.5,"skin-joint"); circle(fg,farWrist,7.5,"skin-joint");
  svg.appendChild(fg);

  polygon(svg,[farShoulder,nearShoulder,nearHip,{x:84,y:125+sy},farHip],"torso-shape");

  const hi=[{x:102,y:69+sy},{x:109,y:71+sy},{x:102,y:111+sy},{x:94,y:113+sy}].map(q=>rotatePoint(q,center,br));
  polygon(svg,hi,"torso-highlight");
  line(svg,neck,headCenter,"skin-bone",12);

  svg.appendChild(svgEl("ellipse",{cx:headCenter.x,cy:headCenter.y,rx:19,ry:22,class:"head-shape",transform:`rotate(${p.headTilt+br} ${headCenter.x} ${headCenter.y})`}));
  svg.appendChild(svgEl("path",{d:`M ${headCenter.x-17} ${headCenter.y-8} Q ${headCenter.x} ${headCenter.y-23} ${headCenter.x+17} ${headCenter.y-8} L ${headCenter.x+15} ${headCenter.y-15} Q ${headCenter.x} ${headCenter.y-24} ${headCenter.x-15} ${headCenter.y-14} Z`,class:"hair-shape"}));
  svg.appendChild(svgEl("circle",{cx:headCenter.x+7,cy:headCenter.y-1,r:2.7,class:"face-eye"}));
  svg.appendChild(svgEl("circle",{cx:headCenter.x-3,cy:headCenter.y-2,r:1.8,class:"face-eye",opacity:.45}));
  svg.appendChild(svgEl("path",{d:`M ${headCenter.x+11} ${headCenter.y+1} l 5 3 l -4 2`,class:"face-nose"}));

  const ng=svgEl("g",{class:"near-limb"});
  line(ng,nearHip,nearKnee,"gear-bone",19); line(ng,nearKnee,nearAnkle,"gear-bone",18); circle(ng,nearKnee,7.5,"gear-joint");
  line(ng,nearShoulder,nearElbow,"skin-bone",17); line(ng,nearElbow,nearWrist,"skin-bone",16); circle(ng,nearElbow,7,"skin-joint"); circle(ng,nearWrist,8.5,"skin-joint");
  svg.appendChild(ng);

  function bootAt(ankle,front=true){
    const dir=front?1:.7;
    svg.appendChild(svgEl("path",{d:`M ${ankle.x-7} ${ankle.y-2} L ${ankle.x+7} ${ankle.y-2} L ${ankle.x+19*dir} ${ankle.y+6} L ${ankle.x+17*dir} ${ankle.y+12} L ${ankle.x-8} ${ankle.y+11} Z`,class:"boot-shape"}));
  }
  bootAt(farAnkle,false);bootAt(nearAnkle,true);
  f.element.style.left=`${p.x}%`;
}

function renderAll(){renderFighter(fighters.player);renderFighter(fighters.cpu)}

let activeSide="player";
let keyframes=[];
let selectedIndex=-1;
let previewToken=0;

const controlsEl=document.getElementById("controls");
function buildControls(){
  controlsEl.innerHTML="";
  const pose=fighters[activeSide].pose;
  CONTROL_DEFS.forEach(([key,label,min,max,step])=>{
    const wrap=document.createElement("div");wrap.className="control-row";
    wrap.innerHTML=`<div class="control-top"><span>${label}</span><strong id="v_${key}">${Math.round(pose[key])}</strong></div>
      <input id="r_${key}" type="range" min="${min}" max="${max}" step="${step}" value="${pose[key]}">`;
    controlsEl.appendChild(wrap);
    const r=wrap.querySelector("input");
    r.addEventListener("input",()=>{
      fighters[activeSide].pose[key]=Number(r.value);
      wrap.querySelector("strong").textContent=r.value;
      renderFighter(fighters[activeSide]);
    });
  });
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    activeSide=btn.dataset.side;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
    buildControls();
  });
});

function snapshot(){
  return {
    duration:Math.max(40,Number(document.getElementById("duration").value)||250),
    player:{...fighters.player.pose},
    cpu:{...fighters.cpu.pose}
  };
}
function applySnapshot(kf){
  fighters.player.pose={...kf.player};
  fighters.cpu.pose={...kf.cpu};
  document.getElementById("duration").value=kf.duration;
  renderAll();buildControls();
}
function drawKeyframes(){
  const box=document.getElementById("keyframes");box.innerHTML="";
  keyframes.forEach((kf,i)=>{
    const b=document.createElement("button");
    b.className="kf"+(i===selectedIndex?" active":"");
    b.innerHTML=`<strong>Keyframe ${i+1}</strong><br><small>${kf.duration} ms</small>`;
    b.onclick=()=>{selectedIndex=i;applySnapshot(kf);drawKeyframes()};
    box.appendChild(b);
  });
  if(!keyframes.length)box.innerHTML='<span style="color:#8d99aa">No keyframes yet.</span>';
}
function status(msg){document.getElementById("status").textContent=msg}

document.getElementById("resetPose").onclick=()=>{
  const f=fighters[activeSide];
  f.pose={...BASE_POSE,x:f.homeX};
  renderFighter(f);buildControls();status(`${activeSide.toUpperCase()} pose reset.`);
};
document.getElementById("saveKeyframe").onclick=()=>{
  keyframes.push(snapshot());selectedIndex=keyframes.length-1;drawKeyframes();status(`Saved keyframe ${keyframes.length}.`);
};
document.getElementById("updateKeyframe").onclick=()=>{
  if(selectedIndex<0)return status("Select a keyframe first.");
  keyframes[selectedIndex]=snapshot();drawKeyframes();status(`Updated keyframe ${selectedIndex+1}.`);
};
document.getElementById("deleteKeyframe").onclick=()=>{
  if(selectedIndex<0)return;
  keyframes.splice(selectedIndex,1);
  selectedIndex=Math.min(selectedIndex,keyframes.length-1);
  if(selectedIndex>=0)applySnapshot(keyframes[selectedIndex]);
  drawKeyframes();
};
document.getElementById("moveLeft").onclick=()=>{
  if(selectedIndex<=0)return;
  [keyframes[selectedIndex-1],keyframes[selectedIndex]]=[keyframes[selectedIndex],keyframes[selectedIndex-1]];
  selectedIndex--;drawKeyframes();
};
document.getElementById("moveRight").onclick=()=>{
  if(selectedIndex<0||selectedIndex>=keyframes.length-1)return;
  [keyframes[selectedIndex+1],keyframes[selectedIndex]]=[keyframes[selectedIndex],keyframes[selectedIndex+1]];
  selectedIndex++;drawKeyframes();
};

function lerp(a,b,t){return a+(b-a)*t}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
async function animateFighterTo(f,target,duration,token){
  const start={...f.pose},t0=performance.now();
  return new Promise(resolve=>{
    function frame(now){
      if(token!==previewToken)return resolve();
      const raw=Math.min(1,(now-t0)/Math.max(1,duration)),e=ease(raw);
      for(const k of Object.keys(target)){
        if(typeof target[k]==="number")f.pose[k]=lerp(start[k]??0,target[k],e);
      }
      renderFighter(f);
      if(raw<1)requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}
document.getElementById("preview").onclick=async()=>{
  if(!keyframes.length)return status("Save at least one keyframe first.");
  const token=++previewToken;
  status("Previewing...");
  // Start from first keyframe instantly.
  applySnapshot(keyframes[0]);
  for(let i=1;i<keyframes.length;i++){
    if(token!==previewToken)break;
    const kf=keyframes[i];
    await Promise.all([
      animateFighterTo(fighters.player,kf.player,kf.duration,token),
      animateFighterTo(fighters.cpu,kf.cpu,kf.duration,token)
    ]);
  }
  if(token===previewToken)status("Preview finished.");
};
document.getElementById("stopPreview").onclick=()=>{previewToken++;status("Preview stopped.")};

function exportData(){
  return {
    format:"wrestling-svg-animation-v1",
    moveName:document.getElementById("moveName").value||"Unnamed Move",
    keyframes:keyframes
  };
}
document.getElementById("exportJson").onclick=()=>{
  document.getElementById("jsonBox").value=JSON.stringify(exportData(),null,2);
  status("Move data exported below.");
};
document.getElementById("copyJson").onclick=async()=>{
  const box=document.getElementById("jsonBox");
  if(!box.value)box.value=JSON.stringify(exportData(),null,2);
  try{await navigator.clipboard.writeText(box.value);status("JSON copied.");}
  catch{box.select();document.execCommand("copy");status("JSON copied.");}
};
document.getElementById("importJson").onclick=()=>{
  try{
    const data=JSON.parse(document.getElementById("jsonBox").value);
    if(!Array.isArray(data.keyframes))throw new Error("Missing keyframes.");
    keyframes=data.keyframes;
    document.getElementById("moveName").value=data.moveName||"Imported Move";
    selectedIndex=keyframes.length?0:-1;
    if(selectedIndex>=0)applySnapshot(keyframes[0]);
    drawKeyframes();status(`Imported ${keyframes.length} keyframes.`);
  }catch(e){status("Import failed: "+e.message)}
};

renderAll();buildControls();drawKeyframes();
</script>
</body>
</html>
