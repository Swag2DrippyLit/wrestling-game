<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wrestling Game v0.2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d;font-family:Arial,Helvetica,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#0b0b0d}
.hud{position:fixed;inset:0 0 auto 0;color:#fff;pointer-events:none;font-weight:900;text-shadow:0 2px 4px #000}
.bars{display:flex;justify-content:space-between;gap:16px;padding:10px 12px}
.side{width:46%}.right{text-align:right}.name{font-size:16px;margin-bottom:4px}
.bar{height:12px;background:#252525;border:2px solid #eee;border-radius:4px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#eee,#aaa);width:100%}
.stam{height:7px;margin-top:4px;border-width:1px}.stam .fill{background:linear-gradient(90deg,#bbb,#777)}
#msg{position:fixed;top:18%;left:0;width:100%;text-align:center;font-size:30px;color:white;font-weight:900;text-shadow:0 3px 7px #000;pointer-events:none}
#controls{position:fixed;left:0;bottom:0;width:100%;height:43%;pointer-events:none}
.pad{position:absolute;left:18px;bottom:18px;width:156px;height:156px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.24);pointer-events:auto}
.nub{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.32);left:49px;top:49px}
.buttons{position:absolute;right:16px;bottom:15px;width:192px;height:170px;pointer-events:auto}
button{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(0,0,0,.48);color:#fff;font-size:12px;font-weight:900}
#strike{right:0;top:47px}#grapple{right:66px;top:0}#run{right:66px;bottom:0}#action{left:0;top:52px}
#help{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);color:#bbb;font-size:10px;pointer-events:none;white-space:nowrap}
@media (min-width:900px){#controls{display:none}#help{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
<div class="bars">
<div class="side"><div class="name">YOU</div><div class="bar"><div id="hp1" class="fill"></div></div><div class="bar stam"><div id="st1" class="fill"></div></div></div>
<div class="side right"><div class="name">CPU</div><div class="bar"><div id="hp2" class="fill"></div></div><div class="bar stam"><div id="st2" class="fill"></div></div></div>
</div>
</div>
<div id="msg"></div>
<div id="controls">
<div id="pad" class="pad"><div id="nub" class="nub"></div></div>
<div class="buttons">
<button id="strike">STRIKE</button><button id="grapple">GRAPPLE</button><button id="run">RUN</button><button id="action">PIN</button>
</div>
</div>
<div id="help">WASD move • J strike • K grapple/slam • L run • I pin/get up • R restart</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),msg=document.getElementById('msg');
let gameOver=false,count=0,countTimer=0,shake=0;

class Wrestler{
 constructor(x,y,o={}){Object.assign(this,{x,y,vx:0,vy:0,dir:1,hp:100,st:100,state:'idle',timer:0,down:0,attackCD:0,grab:null,pin:false,flash:0,human:false,skin:'#c98b5d',trunks:'#b51f25',boots:'#111',hair:'#281b16',accent:'#fff',body:1},o)}
 hit(dmg,kx=0,ky=0,dc=.18){if(this.state==='down'||this.state==='pinned')dmg*=.65;this.hp=clamp(this.hp-dmg,0,100);this.st=clamp(this.st-dmg*.35,0,100);this.vx+=kx;this.vy+=ky;this.flash=8;shake=Math.max(shake,4);if(Math.random()<dc||this.hp<18){this.state='down';this.down=80+Math.random()*70;this.grab=null}else{this.state='hurt';this.timer=15}}
}
let p1,p2;
function reset(){
 p1=new Wrestler(W*.43,H*.57,{human:true,skin:'#d59a67',trunks:'#19191c',boots:'#070707',hair:'#2a1c16',accent:'#eee',body:1.04});
 p2=new Wrestler(W*.57,H*.57,{skin:'#b86f49',trunks:'#b71822',boots:'#111',hair:'#101010',accent:'#fff',body:1});
 gameOver=false;count=0;countTimer=0;msg.textContent='';
}
reset();

const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='j')strike(p1,p2);if(e.key.toLowerCase()==='k')grapple(p1,p2);if(e.key.toLowerCase()==='i')action(p1,p2);if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,y:0},running=false;const pad=document.getElementById('pad'),nub=document.getElementById('nub');
function moveJoy(e){const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,lim=48,s=Math.min(lim,m)/m;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`;joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1)}
pad.addEventListener('touchstart',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='translate(0,0)'});
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn()});el.addEventListener('mousedown',fn)}
bind('strike',()=>strike(p1,p2));bind('grapple',()=>grapple(p1,p2));bind('action',()=>action(p1,p2));
document.getElementById('run').addEventListener('touchstart',e=>{e.preventDefault();running=true});document.getElementById('run').addEventListener('touchend',()=>running=false);document.getElementById('run').addEventListener('mousedown',()=>running=true);addEventListener('mouseup',()=>running=false);

function strike(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){a.attackCD=20;a.st-=6;a.state='knee';a.timer=12;b.hit(8,a.dir*2.2,0,.2);return}a.state='strike';a.timer=13;a.attackCD=19;a.st-=4;if(dist(a,b)<72){a.dir=b.x>a.x?1:-1;b.hit(8+Math.random()*3,a.dir*3.4,(b.y-a.y)*.04,.18)}}
function grapple(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){a.attackCD=48;a.st-=14;a.state='slam';a.timer=20;const g=a.grab;g.x=a.x+a.dir*22;g.y=a.y-2;g.hit(16,a.dir*5,-1,.92);g.state='down';g.down=115;a.grab=null;g.grab=null;shake=8;return}if(dist(a,b)<64&&b.state!=='down'&&b.state!=='pinned'){a.dir=b.x>a.x?1:-1;a.grab=b;b.grab=a;a.state='grapple';b.state='grappled';a.attackCD=20;b.timer=38}}
function action(a,b){if(gameOver)return;if(a.state==='down'){a.down=Math.min(a.down,12);return}if(b.state==='down'&&dist(a,b)<68){a.state='pinning';b.state='pinned';a.pin=b.pin=true;count=0;countTimer=0}}
function releasePin(){p1.pin=p2.pin=false;if(p1.state==='pinning')p1.state='idle';if(p2.state==='pinning')p2.state='idle';if(p1.state==='pinned'){p1.state='down';p1.down=45}if(p2.state==='pinned'){p2.state='down';p2.down=45}count=0;msg.textContent=''}

function ai(a,b){if(gameOver||['down','pinned','grappled'].includes(a.state))return;if(a.grab){if(Math.random()<.05)grapple(a,b);else if(Math.random()<.035)strike(a,b);return}const d=dist(a,b);if(b.state==='down'&&d<64&&b.hp<48&&Math.random()<.018){action(a,b);return}if(d>54){a.vx+=(b.x-a.x)/d*.19;a.vy+=(b.y-a.y)/d*.14}else{if(Math.random()<.038)strike(a,b);else if(Math.random()<.026)grapple(a,b);else{a.vx+=(Math.random()-.5)*.18;a.vy+=(Math.random()-.5)*.14}}}

function ring(){const rw=Math.min(W*.86,820),rh=Math.min(H*.47,390),rx=(W-rw)/2,ry=H*.33;return{rx,ry,rw,rh}}
function physics(w,other){if(w.flash>0)w.flash--;if(w.attackCD>0)w.attackCD--;if(w.timer>0&&--w.timer<=0&&['strike','hurt','knee','slam'].includes(w.state))w.state='idle';if(w.state==='grappled'){if(w.timer>0)w.timer--;if(w.timer<=0){w.state='idle';if(other.grab===w)other.grab=null}return}if(w.state==='down'){w.down--;w.vx*=.9;w.vy*=.9;if(w.down<=0&&!w.pin){w.state='idle';w.hp=clamp(w.hp+1,0,100)}}if(['pinned','pinning'].includes(w.state))return;if(w.grab){const g=w.grab;w.dir=g.x>w.x?1:-1;g.x=w.x+w.dir*30;g.y=w.y+2;g.vx=g.vy=0}const r=ring(),m=26;w.x=clamp(w.x+w.vx,r.rx+m,r.rx+r.rw-m);w.y=clamp(w.y+w.vy,r.ry+72,r.ry+r.rh-24);w.vx*=.78;w.vy*=.78;w.st=clamp(w.st+.085,0,100)}
function playerControl(){if(gameOver||['down','pinned','pinning','grappled'].includes(p1.state))return;let x=(keys['d']?1:0)-(keys['a']?1:0)+joy.x,y=(keys['s']?1:0)-(keys['w']?1:0)+joy.y;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}const run=keys['l']||running,sp=run&&p1.st>3?.76:.40;if(run&&m>.1)p1.st=clamp(p1.st-.22,0,100);p1.vx+=x*sp;p1.vy+=y*sp*.72;if(Math.abs(x)>.1)p1.dir=x>0?1:-1}
function pinLogic(){if(!p1.pin&&!p2.pin)return;countTimer++;const pinned=p1.state==='pinned'?p1:p2;if(countTimer%55===0){count++;msg.textContent=count<3?String(count):'3 — PINFALL!';if(count>=3){gameOver=true;setTimeout(()=>msg.textContent=(p1.state==='pinning'?'YOU WIN!':'CPU WINS!')+' — Press R to restart',250);return}}if(countTimer>38){const chance=(pinned.hp/100)*.006+(count===2?.004:0);if((pinned===p1&&(keys['i']||Math.random()<chance*.55))||(pinned===p2&&Math.random()<chance))releasePin()}}

function drawCrowd(){const r=ring();ctx.fillStyle='#0d0d10';ctx.fillRect(0,0,W,H);const grad=ctx.createLinearGradient(0,70,0,r.ry);grad.addColorStop(0,'#18181d');grad.addColorStop(1,'#09090b');ctx.fillStyle=grad;ctx.fillRect(0,70,W,r.ry-55);ctx.fillStyle='#3a3f46';ctx.fillRect(0,r.ry-18,W,18);ctx.fillStyle='#111';ctx.fillRect(0,r.ry-13,W,7);const cols=Math.ceil(W/34)+2;for(let row=0;row<4;row++){for(let i=0;i<cols;i++){const x=i*34+(row%2)*16-15,y=r.ry-45-row*38+Math.sin(i*1.7+row)*6,h=(i*41+row*67)%360;ctx.fillStyle=`hsl(${h} 24% ${28+row*3}%)`;ctx.fillRect(x-10,y,20,29);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% ${56+(i%4)*5}%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill();if((i+row)%7===0){ctx.fillStyle='#ddd';ctx.fillRect(x-14,y-37,28,17);ctx.fillStyle='#222';ctx.font='8px Arial';ctx.textAlign='center';ctx.fillText('FIGHT!',x,y-25)}}}}

function drawRing(){const r=ring();ctx.fillStyle='#20232a';ctx.fillRect(r.rx-48,r.ry+34,r.rw+96,r.rh+78);ctx.fillStyle='#111319';ctx.fillRect(r.rx-8,r.ry+r.rh-5,r.rw+16,48);ctx.fillStyle='#242834';ctx.fillRect(r.rx,r.ry+r.rh+8,r.rw,22);ctx.fillStyle='#eee';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('WRESTLING REVOLUTION-ISH',r.rx+r.rw/2,r.ry+r.rh+25);const g=ctx.createLinearGradient(0,r.ry,0,r.ry+r.rh);g.addColorStop(0,'#dfe8ef');g.addColorStop(1,'#bcc8d1');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(r.rx+18,r.ry);ctx.lineTo(r.rx+r.rw-18,r.ry);ctx.lineTo(r.rx+r.rw,r.ry+r.rh);ctx.lineTo(r.rx,r.ry+r.rh);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(70,90,100,.14)';ctx.lineWidth=1;for(let i=1;i<9;i++){let x=r.rx+18+(r.rw-36)*(i/9);ctx.beginPath();ctx.moveTo(x,r.ry);ctx.lineTo(r.rx+r.rw*(i/9),r.ry+r.rh);ctx.stroke()}ctx.fillStyle='#0c0d11';ctx.fillRect(r.rx-10,r.ry-6,13,r.rh+30);ctx.fillRect(r.rx+r.rw-3,r.ry-6,13,r.rh+30);[r.ry+27,r.ry+48,r.ry+69].forEach((y,i)=>{ctx.strokeStyle=i===1?'#d7d7d7':'#b8b8b8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});[[r.rx-4,r.ry+24],[r.rx+r.rw+4,r.ry+24]].forEach(([x,y])=>{ctx.fillStyle='#111';for(let j=0;j<3;j++)ctx.fillRect(x-8,y+j*21,16,12)})}

function limb(x1,y1,x2,y2,wid,color){ctx.strokeStyle=color;ctx.lineWidth=wid;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function joint(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function boot(x1,y1,x2,y2,wid,color){limb(x1,y1,x2,y2,wid,color);const a=Math.atan2(y2-y1,x2-x1);ctx.save();ctx.translate(x2,y2);ctx.rotate(a);ctx.fillStyle=color;ctx.fillRect(-wid*.1,-wid*.52,wid*1.2,wid*1.04);ctx.restore()}
function poseFor(w){let p={shL:{x:-16,y:-24},shR:{x:16,y:-24},elL:{x:-28,y:-5},elR:{x:28,y:-5},haL:{x:-31,y:12},haR:{x:31,y:12},hipL:{x:-9,y:16},hipR:{x:9,y:16},knL:{x:-11,y:43},knR:{x:11,y:43},ftL:{x:-14,y:68},ftR:{x:14,y:68},tilt:0};if(w.state==='strike'){const d=w.dir;if(d>0){p.elR={x:30,y:-18};p.haR={x:50,y:-22}}else{p.elL={x:-30,y:-18};p.haL={x:-50,y:-22}}p.tilt=-.05*d}if(w.state==='grapple'){p.elL={x:-24,y:-13};p.haL={x:-34,y:-3};p.elR={x:24,y:-13};p.haR={x:34,y:-3};p.tilt=.08*w.dir}if(w.state==='grappled'){p.elL={x:-12,y:-36};p.haL={x:-20,y:-47};p.elR={x:12,y:-36};p.haR={x:20,y:-47};p.tilt=-.10*w.dir}if(w.state==='hurt'){p.elL={x:-20,y:-25};p.haL={x:-5,y:-37};p.elR={x:20,y:-25};p.haR={x:5,y:-37};p.tilt=.12*w.dir}if(w.state==='knee'){p.knR={x:18,y:26};p.ftR={x:30,y:42}}return p}
function dark(hex,amt=-25){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return `rgb(${r},${g},${b})`}

function drawStanding(w){const r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=(.86+depth*.23)*w.body,skin=w.flash%2?dark(w.skin,45):w.skin,sd=dark(skin,-28),p=poseFor(w);ctx.save();ctx.translate(w.x,w.y);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.27)';ctx.beginPath();ctx.ellipse(0,68,25,8,0,0,7);ctx.fill();ctx.rotate(p.tilt);limb(p.shL.x,p.shL.y,p.elL.x,p.elL.y,11,sd);limb(p.elL.x,p.elL.y,p.haL.x,p.haL.y,9,sd);joint(p.haL.x,p.haL.y,6,sd);limb(p.hipL.x,p.hipL.y,p.knL.x,p.knL.y,13,sd);boot(p.knL.x,p.knL.y,p.ftL.x,p.ftL.y,12,w.boots);ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-20,-34,40,54,13);ctx.fill();ctx.strokeStyle=sd;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(0,6);ctx.stroke();ctx.beginPath();ctx.moveTo(-13,-7);ctx.quadraticCurveTo(0,-2,13,-7);ctx.stroke();ctx.fillStyle=w.trunks;ctx.fillRect(-20,7,40,18);ctx.fillStyle=w.accent;ctx.globalAlpha=.22;ctx.fillRect(-2,8,4,16);ctx.globalAlpha=1;limb(p.hipR.x,p.hipR.y,p.knR.x,p.knR.y,13,skin);boot(p.knR.x,p.knR.y,p.ftR.x,p.ftR.y,12,w.boots);limb(p.shR.x,p.shR.y,p.elR.x,p.elR.y,11,skin);limb(p.elR.x,p.elR.y,p.haR.x,p.haR.y,9,skin);joint(p.haR.x,p.haR.y,6,skin);ctx.fillStyle=sd;ctx.fillRect(-6,-42,12,11);ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-52,14,16,0,0,7);ctx.fill();ctx.fillStyle=w.hair;ctx.beginPath();ctx.arc(0,-55,14,Math.PI,Math.PI*2);ctx.lineTo(13,-51);ctx.quadraticCurveTo(6,-61,0,-60);ctx.quadraticCurveTo(-8,-61,-13,-51);ctx.fill();ctx.fillStyle='#17100d';ctx.beginPath();ctx.arc(w.dir*6,-53,1.8,0,7);ctx.fill();ctx.strokeStyle='#5c2d28';ctx.beginPath();ctx.moveTo(-4,-44);ctx.lineTo(4,-44);ctx.stroke();ctx.restore()}
function drawDown(w){const r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=(.86+depth*.23)*w.body,skin=w.skin,sd=dark(skin,-26);ctx.save();ctx.translate(w.x,w.y+12);ctx.scale(s,s);ctx.rotate(-1.47*w.dir);ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,20,36,9,0,0,7);ctx.fill();limb(-8,12,-10,40,13,sd);boot(-10,40,-12,64,12,w.boots);limb(8,12,12,40,13,skin);boot(12,40,15,64,12,w.boots);ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-20,-30,40,48,13);ctx.fill();ctx.fillStyle=w.trunks;ctx.fillRect(-20,7,40,17);limb(-16,-18,-33,-3,11,sd);limb(-33,-3,-40,12,9,sd);joint(-40,12,6,sd);limb(16,-18,31,-7,11,skin);limb(31,-7,39,8,9,skin);joint(39,8,6,skin);ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-45,14,16,0,0,7);ctx.fill();ctx.fillStyle=w.hair;ctx.beginPath();ctx.arc(0,-48,14,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function drawW(w){(w.state==='down'||w.state==='pinned')?drawDown(w):drawStanding(w)}
function drawForegroundRopes(){const r=ring();[r.ry+r.rh-18,r.ry+r.rh-39,r.ry+r.rh-60].forEach((y,i)=>{ctx.strokeStyle=i===1?'#e2e2e2':'#bcbcbc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()})}

function draw(){const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;if(shake>0)shake*=.82;ctx.save();ctx.translate(sx,sy);drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);drawForegroundRopes();ctx.restore();document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(){playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);pinLogic();if(p1.hp<=0&&p1.state!=='down'){p1.state='down';p1.down=170}if(p2.hp<=0&&p2.state!=='down'){p2.state='down';p2.down=170}draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
