<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Wrestling Combat Prototype - Version 2.2.1</title>
  <style>
    :root {
      --bg: #111722;
      --panel: #1a2230;
      --text: #f4f7fb;
      --muted: #aeb8c7;
      --ring-mat: #d9e6ef;
      --ring-edge: #57697c;
      --rope: #e7edf3;
      --player: #2f7df6;
      --cpu: #e34e4e;
      --health: #53d769;
      --health-low: #ff5a5a;
      --button: #2a3445;
      --button-hover: #39465b;
      --accent: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c2635 0%, var(--bg) 58%), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      overflow-x: hidden;
    }

    .game-shell { width: min(980px, 100%); }

    .title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0.5px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 14px;
    }

    .fighter-card {
      background: rgba(26, 34, 48, 0.96);
      border: 1px solid #344154;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,.22);
    }

    .fighter-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .health-track {
      height: 22px;
      background: #0e131c;
      border: 2px solid #4d5b6e;
      border-radius: 999px;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #37b957, var(--health));
      transition: width 260ms ease, background 260ms ease;
    }

    .arena {
      position: relative;
      height: clamp(350px, 54vw, 520px);
      min-height: 350px;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(to bottom, #33455d 0 42%, #252d38 42% 100%);
      border: 1px solid #3f4e62;
      box-shadow: 0 16px 36px rgba(0,0,0,.28);
    }

    .crowd {
      position: absolute;
      inset: 0 0 auto 0;
      height: 43%;
      opacity: .55;
      background:
        radial-gradient(circle at 8% 35%, #c4cad4 0 3px, transparent 4px),
        radial-gradient(circle at 18% 50%, #9aa5b6 0 3px, transparent 4px),
        radial-gradient(circle at 30% 28%, #d1d5dd 0 3px, transparent 4px),
        radial-gradient(circle at 42% 52%, #9da8b7 0 3px, transparent 4px),
        radial-gradient(circle at 53% 33%, #cbd0d9 0 3px, transparent 4px),
        radial-gradient(circle at 65% 48%, #a7b1c1 0 3px, transparent 4px),
        radial-gradient(circle at 79% 31%, #d5d9e0 0 3px, transparent 4px),
        radial-gradient(circle at 91% 53%, #9ea9b9 0 3px, transparent 4px);
      background-size: 120px 78px;
    }

    .ring {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 8%;
      height: 59%;
    }

    .ring-mat {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 55%;
      background: linear-gradient(#edf4f8, var(--ring-mat));
      border: 5px solid var(--ring-edge);
      box-shadow: 0 15px 0 #313c49;
    }

    .ring-skirt {
      position: absolute;
      left: 4%; right: 4%; bottom: -18px;
      height: 42px;
      background: linear-gradient(#253142, #151b24);
      border: 4px solid #313c49;
      border-top: none;
    }

    .post {
      position: absolute;
      bottom: 10%;
      width: 14px;
      height: 82%;
      background: #3a4658;
      border: 3px solid #222a35;
      border-radius: 3px;
      z-index: 3;
    }
    .post.left { left: 2%; }
    .post.right { right: 2%; }

    .rope {
      position: absolute;
      left: 3%; right: 3%;
      height: 4px;
      background: var(--rope);
      box-shadow: 0 1px 2px rgba(0,0,0,.6);
      z-index: 2;
    }
    .rope.top { bottom: 76%; }
    .rope.mid { bottom: 58%; }
    .rope.low { bottom: 40%; }

    /* ==========================================================
       V2.2 SVG SKELETAL WRESTLER RIG
       Every limb is rendered between mathematically calculated joints.
       ========================================================== */

    .fighter {
      position: absolute;
      bottom: 17%;
      width: 155px;
      height: 220px;
      z-index: 5;
      transform-origin: 50% 86%;
      pointer-events: none;
    }

    .fighter.player { left: 20%; }
    .fighter.cpu { left: 67%; }

    .fighter-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 3px 1px rgba(0,0,0,.16));
    }

    .fighter.cpu .fighter-svg {
      transform: scaleX(-1);
      transform-origin: 50% 50%;
    }

    .bone {
      stroke: #202733;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .skin-bone { stroke: #e8b18e; }
    .gear-bone { stroke: #161f2d; }

    .joint {
      stroke: #202733;
      stroke-width: 3;
    }

    .skin-joint { fill: #e8b18e; }
    .gear-joint { fill: #161f2d; }

    .torso-shape {
      stroke: #202733;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .player .torso-shape { fill: var(--player); }
    .cpu .torso-shape { fill: var(--cpu); }

    .torso-highlight {
      fill: rgba(255,255,255,.14);
      pointer-events: none;
    }

    .head-shape {
      fill: #e8b18e;
      stroke: #202733;
      stroke-width: 4;
    }

    .hair-shape { fill: #372b27; }
    .face-eye { fill: #202733; }
    .face-nose {
      fill: none;
      stroke: #9a654c;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .boot-shape {
      fill: #0d141f;
      stroke: #202733;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .far-limb { opacity: .78; }
    .near-limb { opacity: 1; }

    .fighter-nameplate {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      color: #26303c;
      background: rgba(255,255,255,.76);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .impact {
      position: absolute;
      z-index: 20;
      display: none;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 3px 3px 0 #1c1c1c;
      pointer-events: none;
    }

    .move-name {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12,17,25,.75);
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 800;
      letter-spacing: .7px;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }
    .move-name.show { opacity: 1; }

    .status-panel {
      margin-top: 14px;
      padding: 16px;
      min-height: 112px;
      background: rgba(26,34,48,.96);
      border: 1px solid #344154;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0,0,0,.2);
    }

    .round-result {
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 800;
      margin-bottom: 7px;
    }

    .choices {
      color: var(--muted);
      min-height: 22px;
      line-height: 1.5;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 58px;
      border: 1px solid #46556a;
      border-radius: 12px;
      background: var(--button);
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) { background: var(--button-hover); transform: translateY(-2px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .restart-wrap { margin-top: 12px; text-align: center; }
    #restartButton {
      display: none;
      min-width: 210px;
      padding: 0 24px;
      background: #3b8b4a;
      border-color: #58a968;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: #7e8a9d;
      font-size: 13px;
    }

    @media (max-width: 620px) {
      body { padding: 14px 10px; }
      .hud { gap: 10px; }
      .fighter-card { padding: 10px; }
      .fighter { transform: scale(.85); transform-origin: center bottom; }
      .fighter.player { left: 16%; }
      .fighter.cpu { left: 64%; }
      .controls { gap: 8px; }
      button { min-height: 54px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1 class="title">2D Wrestling Combat Prototype — V2.2.1</h1>

    <!-- V1 HEALTH HUD: gameplay values unchanged -->
    <section class="hud">
      <div class="fighter-card">
        <div class="fighter-label"><span>PLAYER</span><span id="playerHpText">100 HP</span></div>
        <div class="health-track"><div id="playerHealth" class="health-fill"></div></div>
      </div>
      <div class="fighter-card">
        <div class="fighter-label"><span>CPU</span><span id="cpuHpText">100 HP</span></div>
        <div class="health-track"><div id="cpuHealth" class="health-fill"></div></div>
      </div>
    </section>

    <section class="arena">
      <div class="crowd"></div>
      <div class="ring" id="ring">
        <div class="rope top"></div>
        <div class="rope mid"></div>
        <div class="rope low"></div>
        <div class="post left"></div>
        <div class="post right"></div>
        <div class="ring-mat"></div>
        <div class="ring-skirt"></div>

        <div id="moveName" class="move-name"></div>

        <!-- V2.2 SVG skeletal Player -->
        <div id="playerFighter" class="fighter player" aria-label="Player wrestler">
          <svg class="fighter-svg" viewBox="0 0 160 220" aria-hidden="true"></svg>
          <div class="fighter-nameplate">PLAYER</div>
        </div>

        <!-- V2.2 SVG skeletal CPU -->
        <div id="cpuFighter" class="fighter cpu" aria-label="CPU wrestler">
          <svg class="fighter-svg" viewBox="0 0 160 220" aria-hidden="true"></svg>
          <div class="fighter-nameplate">CPU</div>
        </div>

        <div id="impact" class="impact">BAM!</div>
      </div>
    </section>

    <section class="status-panel" aria-live="polite">
      <div id="roundResult" class="round-result">Choose your action.</div>
      <div id="choiceDisplay" class="choices">Strike beats Counter • Counter beats Grapple • Grapple beats Strike</div>
    </section>

    <section class="controls">
      <button class="action-button" data-action="strike">Strike</button>
      <button class="action-button" data-action="grapple">Grapple</button>
      <button class="action-button" data-action="counter">Counter</button>
    </section>

    <div class="restart-wrap"><button id="restartButton">Restart Match</button></div>
    <div class="footer-note">Version 2.2.1 — SVG rig combat-flow repair</div>
  </main>

  <script>
    // ============================================================
    // V1 GAME STATE - UNCHANGED GAMEPLAY VALUES
    // ============================================================
    const MAX_HEALTH = 100;
    const DAMAGE = { strike: 10, grapple: 15, counter: 12 };
    const ACTION_LABELS = { strike: "Strike", grapple: "Grapple", counter: "Counter" };

    let playerHealth = MAX_HEALTH;
    let cpuHealth = MAX_HEALTH;
    let exchangeLocked = false;
    let matchOver = false;

    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const playerHealthBar = document.getElementById("playerHealth");
    const cpuHealthBar = document.getElementById("cpuHealth");
    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");
    const playerFighter = document.getElementById("playerFighter");
    const cpuFighter = document.getElementById("cpuFighter");
    const impact = document.getElementById("impact");
    const moveName = document.getElementById("moveName");
    const roundResult = document.getElementById("roundResult");
    const choiceDisplay = document.getElementById("choiceDisplay");
    const actionButtons = [...document.querySelectorAll(".action-button")];
    const restartButton = document.getElementById("restartButton");

    // ============================================================
    // V2.2 COORDINATE-BASED SVG SKELETON
    // Limb endpoints are derived from parent joints every frame.
    // ============================================================

    const SVG_NS = "http://www.w3.org/2000/svg";

    const BASE_POSE = {
      x: 0, y: 0, bodyRot: 0, bodyLean: 0,
      headTilt: -3,
      nearUpperArm: 34, nearForearm: -38,
      farUpperArm: 19, farForearm: -28,
      nearThigh: 8, nearShin: -7,
      farThigh: -9, farShin: 9
    };

    function createFighterController(element, homeX) {
      return {
        element,
        svg: element.querySelector(".fighter-svg"),
        homeX,
        pose: { ...BASE_POSE, x: homeX },
        animToken: 0
      };
    }

    const fighters = {
      player: createFighterController(playerFighter, 20),
      cpu: createFighterController(cpuFighter, 67)
    };

    function pointFrom(start, length, angleDeg) {
      const r = angleDeg * Math.PI / 180;
      return {
        x: start.x + Math.sin(r) * length,
        y: start.y + Math.cos(r) * length
      };
    }

    function rotatePoint(p, center, deg) {
      const r = deg * Math.PI / 180;
      const dx = p.x - center.x;
      const dy = p.y - center.y;
      return {
        x: center.x + dx * Math.cos(r) - dy * Math.sin(r),
        y: center.y + dx * Math.sin(r) + dy * Math.cos(r)
      };
    }

    function svgEl(name, attrs = {}) {
      const el = document.createElementNS(SVG_NS, name);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function line(svg, a, b, cls, width) {
      svg.appendChild(svgEl("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        class: `bone ${cls}`, "stroke-width": width
      }));
    }

    function circle(svg, p, r, cls) {
      svg.appendChild(svgEl("circle", {
        cx: p.x, cy: p.y, r, class: `joint ${cls}`
      }));
    }

    function polygon(svg, points, cls) {
      svg.appendChild(svgEl("polygon", {
        points: points.map(p => `${p.x},${p.y}`).join(" "),
        class: cls
      }));
    }

    function renderFighter(f) {
      const p = f.pose;
      const svg = f.svg;
      svg.innerHTML = "";

      const center = { x: 82, y: 108 };
      const bodyShiftY = p.y || 0;

      // Strongly asymmetric 3/4 construction:
      // far shoulder/hip are narrower and higher; near side projects outward.
      let farShoulder = { x: 67, y: 58 + bodyShiftY };
      let nearShoulder = { x: 111, y: 65 + bodyShiftY };
      let farHip = { x: 73, y: 116 + bodyShiftY };
      let nearHip = { x: 101, y: 121 + bodyShiftY };
      let neck = { x: 91, y: 51 + bodyShiftY };
      let headCenter = { x: 101, y: 31 + bodyShiftY };

      const bodyRotation = (p.bodyRot || 0) + (p.bodyLean || 0);
      [farShoulder, nearShoulder, farHip, nearHip, neck, headCenter] =
        [farShoulder, nearShoulder, farHip, nearHip, neck, headCenter]
          .map(q => rotatePoint(q, center, bodyRotation));

      // Limb endpoints are calculated directly from the previous joint.
      const farElbow = pointFrom(farShoulder, 35, p.farUpperArm + bodyRotation);
      const farWrist = pointFrom(farElbow, 34, p.farForearm + bodyRotation);
      const nearElbow = pointFrom(nearShoulder, 39, p.nearUpperArm + bodyRotation);
      const nearWrist = pointFrom(nearElbow, 37, p.nearForearm + bodyRotation);

      const farKnee = pointFrom(farHip, 43, p.farThigh + bodyRotation);
      const farAnkle = pointFrom(farKnee, 44, p.farShin + bodyRotation);
      const nearKnee = pointFrom(nearHip, 46, p.nearThigh + bodyRotation);
      const nearAnkle = pointFrom(nearKnee, 46, p.nearShin + bodyRotation);

      // Far limbs first for real 3/4 depth.
      const farGroup = svgEl("g", { class: "far-limb" });
      line(farGroup, farHip, farKnee, "gear-bone", 17);
      line(farGroup, farKnee, farAnkle, "gear-bone", 16);
      circle(farGroup, farKnee, 7, "gear-joint");
      line(farGroup, farShoulder, farElbow, "skin-bone", 15);
      line(farGroup, farElbow, farWrist, "skin-bone", 14);
      circle(farGroup, farElbow, 6.5, "skin-joint");
      circle(farGroup, farWrist, 7.5, "skin-joint");
      svg.appendChild(farGroup);

      // Angled 3/4 torso polygon, deliberately not symmetrical.
      const torsoPts = [farShoulder, nearShoulder, nearHip, {x:84, y:125+bodyShiftY}, farHip];
      polygon(svg, torsoPts, "torso-shape");

      // Chest plane highlight reinforces turn toward opponent.
      const hi = [
        {x:102, y:69+bodyShiftY},
        {x:109, y:71+bodyShiftY},
        {x:102, y:111+bodyShiftY},
        {x:94, y:113+bodyShiftY}
      ].map(q => rotatePoint(q, center, bodyRotation));
      polygon(svg, hi, "torso-highlight");

      // Neck and head: head is offset toward the opponent and slightly profile-like.
      line(svg, neck, headCenter, "skin-bone", 12);
      const head = svgEl("ellipse", {
        cx: headCenter.x, cy: headCenter.y,
        rx: 19, ry: 22,
        class: "head-shape",
        transform: `rotate(${p.headTilt + bodyRotation} ${headCenter.x} ${headCenter.y})`
      });
      svg.appendChild(head);

      const hair = svgEl("path", {
        d: `M ${headCenter.x-17} ${headCenter.y-8}
            Q ${headCenter.x} ${headCenter.y-23} ${headCenter.x+17} ${headCenter.y-8}
            L ${headCenter.x+15} ${headCenter.y-15}
            Q ${headCenter.x} ${headCenter.y-24} ${headCenter.x-15} ${headCenter.y-14} Z`,
        class: "hair-shape"
      });
      svg.appendChild(hair);

      // Off-center facial features: only one prominent eye + nose cue.
      svg.appendChild(svgEl("circle", {
        cx: headCenter.x + 7, cy: headCenter.y - 1, r: 2.7, class: "face-eye"
      }));
      svg.appendChild(svgEl("circle", {
        cx: headCenter.x - 3, cy: headCenter.y - 2, r: 1.8, class: "face-eye", opacity: .45
      }));
      svg.appendChild(svgEl("path", {
        d: `M ${headCenter.x+11} ${headCenter.y+1} l 5 3 l -4 2`,
        class: "face-nose"
      }));

      // Near limbs last so they sit clearly in front.
      const nearGroup = svgEl("g", { class: "near-limb" });
      line(nearGroup, nearHip, nearKnee, "gear-bone", 19);
      line(nearGroup, nearKnee, nearAnkle, "gear-bone", 18);
      circle(nearGroup, nearKnee, 7.5, "gear-joint");

      line(nearGroup, nearShoulder, nearElbow, "skin-bone", 17);
      line(nearGroup, nearElbow, nearWrist, "skin-bone", 16);
      circle(nearGroup, nearElbow, 7, "skin-joint");
      circle(nearGroup, nearWrist, 8.5, "skin-joint");
      svg.appendChild(nearGroup);

      // Boots remain attached exactly at ankle points.
      function bootAt(ankle, front = true) {
        const dir = front ? 1 : .7;
        const boot = svgEl("path", {
          d: `M ${ankle.x-7} ${ankle.y-2}
              L ${ankle.x+7} ${ankle.y-2}
              L ${ankle.x+19*dir} ${ankle.y+6}
              L ${ankle.x+17*dir} ${ankle.y+12}
              L ${ankle.x-8} ${ankle.y+11} Z`,
          class: "boot-shape"
        });
        svg.appendChild(boot);
      }
      bootAt(farAnkle, false);
      bootAt(nearAnkle, true);
    }

    function renderAll() {
      renderFighter(fighters.player);
      renderFighter(fighters.cpu);
    }

    function easeInOut(t) {
      return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    }

    function animateTo(f, patch, duration = 180) {
      const token = ++f.animToken;
      const start = { ...f.pose };
      const target = { ...f.pose, ...patch };
      const keys = Object.keys(target).filter(k => typeof target[k] === "number");
      const t0 = performance.now();

      return new Promise(resolve => {
        function frame(now) {
          if (token !== f.animToken) return resolve();
          const raw = Math.min(1, (now - t0) / Math.max(1, duration));
          const e = easeInOut(raw);

          for (const k of keys) {
            const a = start[k] ?? 0;
            const b = target[k];
            f.pose[k] = a + (b - a) * e;
          }

          f.element.style.left = `${f.pose.x}%`;
          renderFighter(f);

          if (raw < 1) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    async function dualTo(a, poseA, b, poseB, duration = 180, hold = 0) {
      await Promise.all([animateTo(a, poseA, duration), animateTo(b, poseB, duration)]);
      if (hold) await wait(hold);
    }

    function resetFighter(f, duration = 220) {
      const target = { ...BASE_POSE, x: f.homeX };
      if (duration === 0) {
        f.animToken++;
        f.pose = target;
        f.element.style.left = `${f.homeX}%`;
        renderFighter(f);
        return Promise.resolve();
      }
      return animateTo(f, target, duration);
    }

    const MOVE_LIBRARY = {
      strike: [
        { name: "Straight Punch", play: movePunch },
        { name: "Clothesline", play: moveClothesline },
        { name: "Front Kick", play: moveKick }
      ],
      grapple: [
        { name: "Body Slam", play: moveBodySlam },
        { name: "Suplex", play: moveSuplex },
        { name: "DDT", play: moveDDT }
      ],
      counter: [
        { name: "Slip & Strike", play: moveDodgeStrike },
        { name: "Reversal Shove", play: moveReversalShove },
        { name: "Counter Takedown", play: moveCounterTakedown }
      ]
    };

    function pickMove(action) {
      const options = MOVE_LIBRARY[action];
      return options[Math.floor(Math.random() * options.length)];
    }

    function opponentOf(side) { return side === "player" ? "cpu" : "player"; }
    function approachX(side, amount = 10) {
      return fighters[side].homeX + (side === "player" ? amount : -amount);
    }
    function retreatX(side, amount = 4) {
      return fighters[side].homeX + (side === "player" ? -amount : amount);
    }

    function showMoveName(text) {
      moveName.textContent = text;
      moveName.classList.add("show");
    }
    function hideMoveName() { moveName.classList.remove("show"); }

    function showImpactBetween(attackerSide, text = "BAM!") {
      impact.textContent = text;
      impact.style.display = "block";
      impact.style.left = attackerSide === "player" ? "52%" : "38%";
      impact.style.top = "34%";
    }
    function hideImpact() { impact.style.display = "none"; }

    async function recoverBoth() {
      hideImpact();
      await Promise.all([
        resetFighter(fighters.player, 270),
        resetFighter(fighters.cpu, 270)
      ]);
      hideMoveName();
    }

    async function sellAndRecover(side, heavy = false) {
      const f = fighters[side];
      await animateTo(f, {
        bodyRot: side === "player" ? -72 : 72,
        bodyLean: side === "player" ? -12 : 12,
        y: 52,
        nearUpperArm: 72, nearForearm: 82,
        farUpperArm: -55, farForearm: -68,
        nearThigh: 60, nearShin: 95,
        farThigh: -42, farShin: -74
      }, heavy ? 230 : 190);
      await wait(heavy ? 220 : 120);
      await animateTo(f, {
        bodyRot: side === "player" ? -38 : 38,
        y: 28,
        nearUpperArm: 38, nearForearm: -22,
        farUpperArm: 14, farForearm: -24,
        nearThigh: 36, nearShin: 65,
        farThigh: -16, farShin: 26
      }, 260);
      await resetFighter(f, 280);
    }

    // ---------------- STRIKES ----------------
    async function movePunch(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await animateTo(a, {
        x: approachX(attackerSide, 6),
        bodyLean: 7,
        nearUpperArm: -18,
        nearForearm: -105
      }, 180);

      await dualTo(
        a, { x: approachX(attackerSide, 11), nearUpperArm: 89, nearForearm: 91, bodyLean: 11 },
        d, { x: retreatX(defenderSide, 2), bodyRot: defenderSide === "player" ? -12 : 12, headTilt: defenderSide === "player" ? -22 : 22 },
        110, 60
      );

      showImpactBetween(attackerSide, "POW!");
      await wait(90);
      await Promise.all([resetFighter(a, 190), resetFighter(d, 240)]);
      hideImpact(); hideMoveName();
    }

    async function moveClothesline(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await animateTo(a, {
        x: approachX(attackerSide, 6),
        nearUpperArm: 8,
        nearForearm: 88,
        bodyLean: 8
      }, 180);

      await dualTo(
        a, { x: approachX(attackerSide, 12), nearUpperArm: 92, nearForearm: 92, bodyLean: 14 },
        d, { x: retreatX(defenderSide, 2), bodyRot: defenderSide === "player" ? -30 : 30, headTilt: defenderSide === "player" ? -25 : 25 },
        130, 55
      );

      showImpactBetween(attackerSide, "WHAM!");
      await wait(80);
      await resetFighter(a, 180);
      await sellAndRecover(defenderSide, true);
      hideImpact(); hideMoveName();
    }

    async function moveKick(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await animateTo(a, {
        x: approachX(attackerSide, 6),
        bodyLean: -8,
        nearThigh: -20,
        nearShin: -105,
        nearUpperArm: 5,
        nearForearm: -35
      }, 190);

      await dualTo(
        a, { x: approachX(attackerSide, 10), nearThigh: 82, nearShin: 88, bodyLean: -11 },
        d, { x: retreatX(defenderSide, 2), bodyRot: defenderSide === "player" ? -18 : 18 },
        120, 70
      );

      showImpactBetween(attackerSide, "THUD!");
      await wait(90);
      await Promise.all([resetFighter(a, 220), resetFighter(d, 240)]);
      hideImpact(); hideMoveName();
    }

    // ---------------- GRAPPLES ----------------
    async function grappleSetup(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await dualTo(
        a, { x: approachX(attackerSide, 10), nearUpperArm: 76, nearForearm: 82, farUpperArm: 52, farForearm: 58, bodyLean: 8 },
        d, { x: approachX(defenderSide, 10), nearUpperArm: 76, nearForearm: 82, farUpperArm: 52, farForearm: 58, bodyLean: 6 },
        220, 80
      );
      return { a, d, defenderSide };
    }

    async function moveBodySlam(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);

      await dualTo(
        a, { x: approachX(attackerSide, 12), bodyLean: 22, nearUpperArm: 92, nearForearm: 18, farUpperArm: 35, farForearm: 8 },
        d, { x: approachX(defenderSide, 12), y: -28, bodyRot: defenderSide === "player" ? -68 : 68, nearThigh: 40, nearShin: 16, farThigh: -36, farShin: -18 },
        260, 90
      );

      await dualTo(
        a, { bodyLean: -8, nearUpperArm: 52, nearForearm: 48 },
        d, { y: 50, bodyRot: defenderSide === "player" ? -86 : 86 },
        160, 60
      );

      showImpactBetween(attackerSide, "SLAM!");
      await wait(160);
      await resetFighter(a, 210);
      await sellAndRecover(defenderSide, true);
      hideImpact(); hideMoveName();
    }

    async function moveSuplex(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);

      await dualTo(
        a, { x: approachX(attackerSide, 12), bodyLean: -15, nearUpperArm: 104, nearForearm: 28, farUpperArm: 74, farForearm: 20 },
        d, { x: approachX(defenderSide, 12), y: -45, bodyRot: defenderSide === "player" ? -145 : 145, nearThigh: 42, nearShin: 20, farThigh: -38, farShin: -20 },
        300, 90
      );

      await dualTo(
        a, { y: 24, bodyRot: attackerSide === "player" ? -52 : 52 },
        d, { y: 52, bodyRot: defenderSide === "player" ? -92 : 92 },
        190, 60
      );

      showImpactBetween(attackerSide, "BOOM!");
      await wait(190);
      await Promise.all([resetFighter(a, 300), sellAndRecover(defenderSide, true)]);
      hideImpact(); hideMoveName();
    }

    async function moveDDT(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);

      await dualTo(
        a, { x: approachX(attackerSide, 12), bodyLean: 15, nearUpperArm: 100, nearForearm: -10, farUpperArm: 20, farForearm: -18 },
        d, { x: approachX(defenderSide, 12), bodyLean: defenderSide === "player" ? -28 : 28, headTilt: defenderSide === "player" ? -32 : 32 },
        220, 100
      );

      await dualTo(
        a, { y: 45, bodyRot: attackerSide === "player" ? -74 : 74, nearUpperArm: 108, nearForearm: 4 },
        d, { y: 50, bodyRot: defenderSide === "player" ? -82 : 82, headTilt: defenderSide === "player" ? -24 : 24 },
        175, 60
      );

      showImpactBetween(attackerSide, "DDT!");
      await wait(190);
      await Promise.all([resetFighter(a, 290), sellAndRecover(defenderSide, true)]);
      hideImpact(); hideMoveName();
    }

    // ---------------- COUNTERS ----------------
    async function moveDodgeStrike(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await dualTo(
        d, { x: approachX(defenderSide, 8), nearUpperArm: 88, nearForearm: 90 },
        a, { x: retreatX(attackerSide, 3), bodyLean: attackerSide === "player" ? -20 : 20 },
        150, 70
      );

      await animateTo(a, { x: approachX(attackerSide, 7), nearUpperArm: -14, nearForearm: -105 }, 130);
      await dualTo(
        a, { x: approachX(attackerSide, 10), nearUpperArm: 90, nearForearm: 91 },
        d, { x: retreatX(defenderSide, 3), bodyRot: defenderSide === "player" ? -18 : 18 },
        105, 60
      );

      showImpactBetween(attackerSide, "CRACK!");
      await wait(90);
      await Promise.all([resetFighter(a, 200), resetFighter(d, 250)]);
      hideImpact(); hideMoveName();
    }

    async function moveReversalShove(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await dualTo(
        d, { x: approachX(defenderSide, 9), nearUpperArm: 74, nearForearm: 80, farUpperArm: 50, farForearm: 58 },
        a, { x: approachX(attackerSide, 8), nearUpperArm: 66, nearForearm: 74, farUpperArm: 46, farForearm: 56 },
        190, 70
      );

      await dualTo(
        a, { x: approachX(attackerSide, 11), nearUpperArm: 90, nearForearm: 92, farUpperArm: 82, farForearm: 88, bodyLean: 12 },
        d, { x: retreatX(defenderSide, 7), bodyRot: defenderSide === "player" ? -32 : 32 },
        130, 60
      );

      showImpactBetween(attackerSide, "SHOVE!");
      await wait(80);
      await resetFighter(a, 190);
      await sellAndRecover(defenderSide, false);
      hideImpact(); hideMoveName();
    }

    async function moveCounterTakedown(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];

      await dualTo(
        d, { x: approachX(defenderSide, 10), nearUpperArm: 74, nearForearm: 78 },
        a, { x: approachX(attackerSide, 9), bodyLean: 24, nearUpperArm: 84, nearForearm: 45, farUpperArm: 65, farForearm: 38, nearThigh: 28, nearShin: -24 },
        210, 70
      );

      await dualTo(
        a, { bodyRot: attackerSide === "player" ? -36 : 36, y: 14 },
        d, { bodyRot: defenderSide === "player" ? -72 : 72, y: 18 },
        190, 55
      );

      await dualTo(
        a, { bodyRot: attackerSide === "player" ? -50 : 50, y: 28 },
        d, { bodyRot: defenderSide === "player" ? -88 : 88, y: 52 },
        170, 55
      );

      showImpactBetween(attackerSide, "DOWN!");
      await wait(160);
      await Promise.all([resetFighter(a, 280), sellAndRecover(defenderSide, true)]);
      hideImpact(); hideMoveName();
    }


    // ============================================================
    // V2.2.1 COMBAT FLOW REPAIR
    // Restores the V1/V2 input -> CPU -> RPS -> SVG move pipeline
    // that was accidentally removed during the V2.2 rig conversion.
    // ============================================================

    actionButtons.forEach(button => {
      button.addEventListener("click", () => {
        handlePlayerInput(button.dataset.action);
      });
    });

    function handlePlayerInput(playerAction) {
      if (exchangeLocked || matchOver) return;

      exchangeLocked = true;
      setActionButtonsEnabled(false);

      const cpuAction = chooseCpuAction();
      const result = determineExchangeWinner(playerAction, cpuAction);

      choiceDisplay.textContent =
        `Player chose ${ACTION_LABELS[playerAction]} • CPU chose ${ACTION_LABELS[cpuAction]}`;

      // The exchange function owns the complete async animation/damage flow.
      resolveExchange(result, playerAction, cpuAction).catch(error => {
        console.error("Exchange failed:", error);

        // Fail safely instead of leaving the match permanently locked.
        hideImpact();
        hideMoveName();
        if (!matchOver) {
          exchangeLocked = false;
          roundResult.textContent = "Animation error — choose your action again.";
          setActionButtonsEnabled(true);
        }
      });
    }

    function chooseCpuAction() {
      const actions = ["strike", "grapple", "counter"];
      return actions[Math.floor(Math.random() * actions.length)];
    }

    function determineExchangeWinner(playerAction, cpuAction) {
      if (playerAction === cpuAction) return "draw";

      const playerWins =
        (playerAction === "strike" && cpuAction === "counter") ||
        (playerAction === "counter" && cpuAction === "grapple") ||
        (playerAction === "grapple" && cpuAction === "strike");

      return playerWins ? "player" : "cpu";
    }

    async function resolveExchange(result, playerAction, cpuAction) {
      if (result === "draw") {
        roundResult.textContent = "Draw! No damage.";
        await playDrawAnimation();
        finishExchange();
        return;
      }

      const winnerAction = result === "player" ? playerAction : cpuAction;
      const damageAmount = DAMAGE[winnerAction];
      const move = pickMove(winnerAction);

      if (result === "player") {
        roundResult.textContent =
          `Player wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());

        await move.play("player");
        applyDamage("cpu", damageAmount);
      } else {
        roundResult.textContent =
          `CPU wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());

        await move.play("cpu");
        applyDamage("player", damageAmount);
      }

      updateHealthUI();

      if (checkMatchEnd()) return;

      await wait(420);
      finishExchange();
    }

    async function playDrawAnimation() {
      const p = fighters.player;
      const c = fighters.cpu;

      await dualTo(
        p,
        {
          x: approachX("player", 5),
          nearUpperArm: 88,
          nearForearm: 90,
          farUpperArm: 54,
          farForearm: 68,
          bodyLean: 5
        },
        c,
        {
          x: approachX("cpu", 5),
          nearUpperArm: 88,
          nearForearm: 90,
          farUpperArm: 54,
          farForearm: 68,
          bodyLean: 5
        },
        180,
        90
      );

      showImpactBetween("player", "BLOCK!");
      await wait(140);
      await recoverBoth();
    }

    // ============================================================
    // V1 DAMAGE - UNCHANGED
    // ============================================================
    function applyDamage(target, amount) {
      if (target === "player") playerHealth = Math.max(0, playerHealth - amount);
      else cpuHealth = Math.max(0, cpuHealth - amount);
    }

    // ============================================================
    // V1 HEALTH / UI - UNCHANGED
    // ============================================================
    function updateHealthUI() {
      playerHealthBar.style.width = `${playerHealth}%`;
      cpuHealthBar.style.width = `${cpuHealth}%`;
      playerHpText.textContent = `${playerHealth} HP`;
      cpuHpText.textContent = `${cpuHealth} HP`;
      updateHealthBarColor(playerHealthBar, playerHealth);
      updateHealthBarColor(cpuHealthBar, cpuHealth);
    }

    function updateHealthBarColor(element, health) {
      element.style.background = health <= 30
        ? "linear-gradient(90deg, #d63a3a, var(--health-low))"
        : "linear-gradient(90deg, #37b957, var(--health))";
    }

    // ============================================================
    // V1 MATCH ENDING - UNCHANGED
    // ============================================================
    function checkMatchEnd() {
      if (playerHealth > 0 && cpuHealth > 0) return false;
      endMatch(playerHealth <= 0 ? "cpu" : "player");
      return true;
    }

    function endMatch(winner) {
      matchOver = true;
      exchangeLocked = true;
      setActionButtonsEnabled(false);
      hideMoveName();

      if (winner === "player") {
        roundResult.textContent = "PLAYER WINS THE MATCH!";
        choiceDisplay.textContent = "The CPU's health reached 0.";
      } else {
        roundResult.textContent = "CPU WINS THE MATCH!";
        choiceDisplay.textContent = "Your health reached 0.";
      }

      restartButton.style.display = "inline-block";
    }

    // ============================================================
    // V1 RESTART - UNCHANGED BEHAVIOR
    // ============================================================
    restartButton.addEventListener("click", restartMatch);

    function restartMatch() {
      playerHealth = MAX_HEALTH;
      cpuHealth = MAX_HEALTH;
      exchangeLocked = false;
      matchOver = false;
      hideImpact();
      hideMoveName();
      resetFighter(fighters.player, 0);
      resetFighter(fighters.cpu, 0);
      updateHealthUI();
      roundResult.textContent = "Choose your action.";
      choiceDisplay.textContent = "Strike beats Counter • Counter beats Grapple • Grapple beats Strike";
      restartButton.style.display = "none";
      setActionButtonsEnabled(true);
    }

    // ============================================================
    // EXCHANGE HELPERS
    // ============================================================
    function finishExchange() {
      if (matchOver) return;
      exchangeLocked = false;
      roundResult.textContent = "Choose your next action.";
      setActionButtonsEnabled(true);
    }

    function setActionButtonsEnabled(enabled) {
      actionButtons.forEach(button => button.disabled = !enabled);
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    // ============================================================
    // INITIAL SETUP
    // ============================================================
    resetFighter(fighters.player, 0);
    resetFighter(fighters.cpu, 0);
    updateHealthUI();
  </script>
</body>
