<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wrestling Game v0.3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0c;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;left:0;top:0;width:100%;color:#fff;font-weight:900;pointer-events:none;text-shadow:0 2px 4px #000}
.bars{display:flex;justify-content:space-between;padding:10px 12px;gap:16px}
.side{width:46%} .right{text-align:right}
.name{font-size:17px;margin-bottom:4px}
.bar{height:12px;background:#222;border:2px solid #eee;border-radius:4px;overflow:hidden}
.fill{height:100%;background:#ddd;width:100%}
.stam{height:7px;margin-top:4px;border-width:1px} .stam .fill{background:#888}
#msg{position:fixed;top:17%;left:0;width:100%;text-align:center;color:#fff;font-size:30px;font-weight:900;text-shadow:0 3px 7px #000;pointer-events:none}
#controls{position:fixed;left:0;bottom:0;width:100%;height:43%;pointer-events:none}
.pad{position:absolute;left:18px;bottom:18px;width:156px;height:156px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff44;pointer-events:auto}
.nub{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffffff55;left:49px;top:49px}
.buttons{position:absolute;right:16px;bottom:15px;width:192px;height:170px;pointer-events:auto}
button{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid #ffffffbb;background:#0000007a;color:#fff;font-weight:900}
#strike{right:0;top:47px}#grapple{right:66px;top:0}#run{right:66px;bottom:0}#action{left:0;top:52px}
#help{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:#bbb;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="bars">
<div class="side"><div class="name">YOU</div><div class="bar"><div id="hp1" class="fill"></div></div><div class="bar stam"><div id="st1" class="fill"></div></div></div>
<div class="side right"><div class="name">CPU</div><div class="bar"><div id="hp2" class="fill"></div></div><div class="bar stam"><div id="st2" class="fill"></div></div></div>
</div></div>
<div id="msg"></div>
<div id="controls"><div id="pad" class="pad"><div id="nub" class="nub"></div></div><div class="buttons">
<button id="strike">STRIKE</button><button id="grapple">GRAPPLE</button><button id="run">RUN</button><button id="action">PIN</button>
</div></div>

let joy={x:0,y:0},running=false;const pad=document.getElementById('pad'),nub=document.getElementById('nub');
function moveJoy(e){const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,lim=48,s=Math.min(lim,m)/m;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`;joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1)}
pad.addEventListener('touchstart',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='translate(0,0)'});
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn()});el.addEventListener('mousedown',fn)} bind('strike',()=>strike(p1,p2));bind('grapple',()=>grapple(p1,p2));bind('action',()=>action(p1,p2));document.getElementById('run').addEventListener('touchstart',e=>{e.preventDefault();running=true});document.getElementById('run').addEventListener('touchend',()=>running=false);
function strike(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){a.attackCD=20;a.st-=6;b.hit(8,a.dir*2.4,0,.2);return}a.state='strike';a.timer=12;a.attackCD=18;a.st-=4;if(dist(a,b)<78){a.dir=b.x>a.x?1:-1;b.hit(8+Math.random()*3,a.dir*3.4,(b.y-a.y)*.04,.2)}}
function grapple(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){a.attackCD=45;a.st-=14;const g=a.grab;g.hit(16,a.dir*5,-1,.9);g.state='down';g.down=120;a.grab=null;g.grab=null;return}if(dist(a,b)<68&&b.state!=='down'){a.dir=b.x>a.x?1:-1;a.grab=b;b.grab=a;a.state='grapple';b.state='grappled';b.timer=38}}
function action(a,b){if(gameOver)return;if(a.state==='down'){a.down=Math.min(a.down,12);return}if(b.state==='down'&&dist(a,b)<72){a.state='pinning';b.state='pinned';a.pin=b.pin=true;count=0;countTimer=0}}
function ring(){const rw=Math.min(W*.86,820),rh=Math.min(H*.47,390),rx=(W-rw)/2,ry=H*.33;return{rx,ry,rw,rh}}
function physics(w,o){if(w.attackCD>0)w.attackCD--;if(w.timer>0&&--w.timer<=0&&['strike','hurt'].includes(w.state))w.state='idle';if(w.state==='grappled'){if(w.timer>0)w.timer--;if(w.timer<=0){w.state='idle';if(o.grab===w)o.grab=null}return}if(w.state==='down'){w.down--;if(w.down<=0&&!w.pin)w.state='idle'}if(['pinned','pinning'].includes(w.state))return;if(w.grab){w.grab.x=w.x+w.dir*34;w.grab.y=w.y+3;w.grab.vx=w.grab.vy=0}const r=ring();w.x=clamp(w.x+w.vx,r.rx+28,r.rx+r.rw-28);w.y=clamp(w.y+w.vy,r.ry+78,r.ry+r.rh-24);w.vx*=.78;w.vy*=.78;w.st=clamp(w.st+.085,0,100)}
function playerControl(){if(gameOver||['down','pinned','pinning','grappled'].includes(p1.state))return;let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}const run=keys.l||running,sp=run&&p1.st>3?.76:.40;if(run&&m>.1)p1.st-=.22;p1.vx+=x*sp;p1.vy+=y*sp*.72;if(Math.abs(x)>.1)p1.dir=x>0?1:-1}
function ai(a,b){if(gameOver||['down','pinned','grappled'].includes(a.state))return;const d=dist(a,b);if(a.grab){if(Math.random()<.05)grapple(a,b);return}if(b.state==='down'&&d<70&&b.hp<50&&Math.random()<.018){action(a,b);return}if(d>58){a.vx+=(b.x-a.x)/d*.18;a.vy+=(b.y-a.y)/d*.14}else if(Math.random()<.04)strike(a,b);else if(Math.random()<.025)grapple(a,b)}
function pinLogic(){if(!p1.pin&&!p2.pin)return;countTimer++;const m=document.getElementById('msg');if(countTimer%55===0){count++;m.textContent=count<3?count:'3 — PINFALL!';if(count>=3){gameOver=true;setTimeout(()=>m.textContent=(p1.state==='pinning'?'YOU WIN!':'CPU WINS!'),250)}}}
function drawCrowd(){const r=ring();ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let row=0;row<4;row++)for(let i=0;i<Math.ceil(W/34)+1;i++){let x=i*34+(row%2)*16,y=r.ry-44-row*38;ctx.fillStyle=`hsl(${(i*41+row*69)%360} 25% 32%)`;ctx.fillRect(x-10,y,20,30);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% 62%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill()}ctx.fillStyle='#353941';ctx.fillRect(0,r.ry-18,W,18)}
function drawRing(){const r=ring();ctx.fillStyle='#20242b';ctx.fillRect(r.rx-50,r.ry+35,r.rw+100,r.rh+75);ctx.fillStyle='#d7e1e8';ctx.fillRect(r.rx,r.ry,r.rw,r.rh);ctx.strokeStyle='#aeb4ba';ctx.lineWidth=4;[r.ry+28,r.ry+50,r.ry+72].forEach(y=>{ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});ctx.fillStyle='#111';ctx.fillRect(r.rx-9,r.ry-4,12,r.rh+28);ctx.fillRect(r.rx+r.rw-3,r.ry-4,12,r.rh+28);ctx.fillStyle='#181a20';ctx.fillRect(r.rx,r.ry+r.rh,r.rw,35);ctx.fillStyle='#eee';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('WRESTLING v0.3',r.rx+r.rw/2,r.ry+r.rh+23)}
function drawPart(im,x,y,w,h,rot,flip=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function drawW(w){const I=imgs[w.who],r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=.66+depth*.22,flip=w.dir<0;ctx.save();ctx.translate(w.x,w.y);ctx.scale(s,s);if(w.state==='down'||w.state==='pinned')ctx.rotate(-1.45*w.dir);
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,62,36,10,0,0,7);ctx.fill();
let armR=w.state==='strike'?-1.15:-.15,armL=.15,foreR=w.state==='strike'?-1.35:.05;
drawPart(I.thigh,-13,32,42,75,.05);drawPart(I.shin,-14,75,36,70,.03);drawPart(I.boot,-15,112,42,65,.03);
drawPart(I.thigh,13,32,42,75,-.04);drawPart(I.shin,14,75,36,70,-.03);drawPart(I.boot,15,112,42,65,-.03);
drawPart(I.trunks,0,10,78,62,0);drawPart(I.torso,0,-35,92,100,0);
drawPart(I.upperarm,-42,-30,34,70,armL);drawPart(I.forearm,-55,2,28,62,.18);drawPart(I.hand,-60,33,28,28,.1);
drawPart(I.upperarm,42,-30,34,70,armR);drawPart(I.forearm,60,-42,28,62,foreR);drawPart(I.hand,78,-64,28,28,foreR);
drawPart(I.head,0,-92,62,72,0,flip);ctx.restore()}
function draw(){drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(){playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);pinLogic();draw();requestAnimationFrame(loop)} loop();
</script>
