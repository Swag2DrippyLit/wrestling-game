<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Wrestling Combat Prototype - Version 1</title>
  <style>
    :root {
      --bg: #111722;
      --panel: #1a2230;
      --panel-2: #232d3d;
      --text: #f4f7fb;
      --muted: #aeb8c7;
      --ring-mat: #d9e6ef;
      --ring-edge: #57697c;
      --rope: #e7edf3;
      --player: #2f7df6;
      --cpu: #e34e4e;
      --health: #53d769;
      --health-low: #ff5a5a;
      --button: #2a3445;
      --button-hover: #39465b;
      --accent: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #1c2635 0%, var(--bg) 58%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
    }

    .game-shell {
      width: min(980px, 100%);
    }

    .title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0.5px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 14px;
    }

    .fighter-card {
      background: rgba(26, 34, 48, 0.96);
      border: 1px solid #344154;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
    }

    .fighter-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .health-track {
      height: 22px;
      background: #0e131c;
      border: 2px solid #4d5b6e;
      border-radius: 999px;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #37b957, var(--health));
      transition: width 260ms ease, background 260ms ease;
    }

    .arena {
      position: relative;
      height: clamp(330px, 52vw, 500px);
      min-height: 330px;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(to bottom, #33455d 0 42%, #252d38 42% 100%);
      border: 1px solid #3f4e62;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
    }

    .crowd {
      position: absolute;
      inset: 0 0 auto 0;
      height: 43%;
      opacity: 0.55;
      background:
        radial-gradient(circle at 8% 35%, #c4cad4 0 3px, transparent 4px),
        radial-gradient(circle at 18% 50%, #9aa5b6 0 3px, transparent 4px),
        radial-gradient(circle at 30% 28%, #d1d5dd 0 3px, transparent 4px),
        radial-gradient(circle at 42% 52%, #9da8b7 0 3px, transparent 4px),
        radial-gradient(circle at 53% 33%, #cbd0d9 0 3px, transparent 4px),
        radial-gradient(circle at 65% 48%, #a7b1c1 0 3px, transparent 4px),
        radial-gradient(circle at 79% 31%, #d5d9e0 0 3px, transparent 4px),
        radial-gradient(circle at 91% 53%, #9ea9b9 0 3px, transparent 4px);
      background-size: 120px 78px;
    }

    .ring {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 8%;
      height: 57%;
    }

    .ring-mat {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 55%;
      background: linear-gradient(#edf4f8, var(--ring-mat));
      border: 5px solid var(--ring-edge);
      box-shadow: 0 15px 0 #313c49;
    }

    .ring-skirt {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: -18px;
      height: 42px;
      background: linear-gradient(#253142, #151b24);
      border: 4px solid #313c49;
      border-top: none;
    }

    .post {
      position: absolute;
      bottom: 10%;
      width: 14px;
      height: 82%;
      background: #3a4658;
      border: 3px solid #222a35;
      border-radius: 3px;
      z-index: 3;
    }

    .post.left { left: 2%; }
    .post.right { right: 2%; }

    .rope {
      position: absolute;
      left: 3%;
      right: 3%;
      height: 4px;
      background: var(--rope);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .rope.top { bottom: 76%; }
    .rope.mid { bottom: 58%; }
    .rope.low { bottom: 40%; }

    .fighter {
      position: absolute;
      bottom: 22%;
      width: 74px;
      height: 142px;
      z-index: 4;
      transition:
        left 280ms ease,
        right 280ms ease,
        transform 160ms ease;
      transform-origin: bottom center;
    }

    .fighter.player {
      left: 27%;
    }

    .fighter.cpu {
      right: 27%;
    }

    .head {
      position: absolute;
      left: 20px;
      top: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e8b18e;
      border: 3px solid #202733;
    }

    .body {
      position: absolute;
      left: 15px;
      top: 32px;
      width: 44px;
      height: 58px;
      border: 3px solid #202733;
      border-radius: 10px 10px 7px 7px;
    }

    .player .body { background: var(--player); }
    .cpu .body { background: var(--cpu); }

    .arm, .leg {
      position: absolute;
      width: 12px;
      background: #e8b18e;
      border: 3px solid #202733;
      border-radius: 9px;
      transform-origin: top center;
    }

    .arm {
      height: 53px;
      top: 40px;
    }

    .arm.left { left: 8px; transform: rotate(9deg); }
    .arm.right { right: 8px; transform: rotate(-9deg); }

    .leg {
      top: 87px;
      height: 54px;
      background: #1b2230;
    }

    .leg.left { left: 19px; transform: rotate(5deg); }
    .leg.right { right: 19px; transform: rotate(-5deg); }

    .fighter.cpu .head,
    .fighter.cpu .body,
    .fighter.cpu .arm,
    .fighter.cpu .leg {
      transform-origin: center;
    }

    .fighter.cpu {
      transform: scaleX(-1);
    }

    .fighter.cpu.attacking,
    .fighter.cpu.hit,
    .fighter.cpu.grapple-hit,
    .fighter.cpu.counter-hit {
      transform: scaleX(-1);
    }

    .fighter.player.attacking {
      transform: translateX(58px) rotate(-3deg);
    }

    .fighter.cpu.attacking {
      right: calc(27% + 58px);
    }

    .fighter.player.hit {
      transform: translateX(-18px) rotate(-9deg);
    }

    .fighter.cpu.hit {
      right: calc(27% - 18px);
    }

    .fighter.player.grapple-hit {
      transform: translateX(-32px) rotate(-13deg);
    }

    .fighter.cpu.grapple-hit {
      right: calc(27% - 32px);
    }

    .fighter.player.counter-hit {
      transform: translateX(-20px) rotate(10deg);
    }

    .fighter.cpu.counter-hit {
      right: calc(27% - 20px);
    }

    .impact {
      position: absolute;
      z-index: 10;
      display: none;
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 3px 3px 0 #1c1c1c;
      pointer-events: none;
    }

    .status-panel {
      margin-top: 14px;
      padding: 16px;
      min-height: 112px;
      background: rgba(26, 34, 48, 0.96);
      border: 1px solid #344154;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.2);
    }

    .round-result {
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 800;
      margin-bottom: 7px;
    }

    .choices {
      color: var(--muted);
      min-height: 22px;
      line-height: 1.5;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 58px;
      border: 1px solid #46556a;
      border-radius: 12px;
      background: var(--button);
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
      transform: translateY(-2px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .restart-wrap {
      margin-top: 12px;
      text-align: center;
    }

    #restartButton {
      display: none;
      min-width: 210px;
      padding: 0 24px;
      background: #3b8b4a;
      border-color: #58a968;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: #7e8a9d;
      font-size: 13px;
    }

    @media (max-width: 620px) {
      body {
        padding: 14px 10px;
      }

      .hud {
        gap: 10px;
      }

      .fighter-card {
        padding: 10px;
      }

      .fighter {
        width: 64px;
        height: 126px;
      }

      .fighter.player {
        left: 20%;
      }

      .fighter.cpu {
        right: 20%;
      }

      .fighter.cpu.attacking {
        right: calc(20% + 42px);
      }

      .fighter.player.attacking {
        transform: translateX(42px) rotate(-3deg);
      }

      .controls {
        gap: 8px;
      }

      button {
        min-height: 54px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1 class="title">2D Wrestling Combat Prototype</h1>

    <!-- Health HUD -->
    <section class="hud">
      <div class="fighter-card">
        <div class="fighter-label">
          <span>PLAYER</span>
          <span id="playerHpText">100 HP</span>
        </div>
        <div class="health-track">
          <div id="playerHealth" class="health-fill"></div>
        </div>
      </div>

      <div class="fighter-card">
        <div class="fighter-label">
          <span>CPU</span>
          <span id="cpuHpText">100 HP</span>
        </div>
        <div class="health-track">
          <div id="cpuHealth" class="health-fill"></div>
        </div>
      </div>
    </section>

    <!-- Arena -->
    <section class="arena">
      <div class="crowd"></div>

      <div class="ring">
        <div class="rope top"></div>
        <div class="rope mid"></div>
        <div class="rope low"></div>
        <div class="post left"></div>
        <div class="post right"></div>
        <div class="ring-mat"></div>
        <div class="ring-skirt"></div>

        <div id="playerFighter" class="fighter player" aria-label="Player wrestler">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div id="cpuFighter" class="fighter cpu" aria-label="CPU wrestler">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div id="impact" class="impact">BAM!</div>
      </div>
    </section>

    <!-- Match Status -->
    <section class="status-panel" aria-live="polite">
      <div id="roundResult" class="round-result">Choose your action.</div>
      <div id="choiceDisplay" class="choices">
        Strike beats Counter • Counter beats Grapple • Grapple beats Strike
      </div>
    </section>

    <!-- Combat Buttons -->
    <section class="controls">
      <button class="action-button" data-action="strike">Strike</button>
      <button class="action-button" data-action="grapple">Grapple</button>
      <button class="action-button" data-action="counter">Counter</button>
    </section>

    <div class="restart-wrap">
      <button id="restartButton">Restart Match</button>
    </div>

    <div class="footer-note">Version 1 — Simple turn-based combat prototype</div>
  </main>

  <script>
    // ============================================================
    // GAME STATE
    // ============================================================

    const MAX_HEALTH = 100;

    const DAMAGE = {
      strike: 10,
      grapple: 15,
      counter: 12
    };

    const ACTION_LABELS = {
      strike: "Strike",
      grapple: "Grapple",
      counter: "Counter"
    };

    let playerHealth = MAX_HEALTH;
    let cpuHealth = MAX_HEALTH;
    let exchangeLocked = false;
    let matchOver = false;

    // ============================================================
    // DOM REFERENCES
    // ============================================================

    const playerHealthBar = document.getElementById("playerHealth");
    const cpuHealthBar = document.getElementById("cpuHealth");
    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");

    const playerFighter = document.getElementById("playerFighter");
    const cpuFighter = document.getElementById("cpuFighter");
    const impact = document.getElementById("impact");

    const roundResult = document.getElementById("roundResult");
    const choiceDisplay = document.getElementById("choiceDisplay");
    const actionButtons = [...document.querySelectorAll(".action-button")];
    const restartButton = document.getElementById("restartButton");

    // ============================================================
    // PLAYER INPUT
    // ============================================================

    actionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        handlePlayerInput(button.dataset.action);
      });
    });

    function handlePlayerInput(playerAction) {
      if (exchangeLocked || matchOver) return;

      exchangeLocked = true;
      setActionButtonsEnabled(false);

      const cpuAction = chooseCpuAction();
      const result = determineExchangeWinner(playerAction, cpuAction);

      choiceDisplay.textContent =
        `Player chose ${ACTION_LABELS[playerAction]} • CPU chose ${ACTION_LABELS[cpuAction]}`;

      resolveExchange(result, playerAction, cpuAction);
    }

    // ============================================================
    // CPU DECISION
    // ============================================================

    function chooseCpuAction() {
      const actions = ["strike", "grapple", "counter"];
      const randomIndex = Math.floor(Math.random() * actions.length);
      return actions[randomIndex];
    }

    // ============================================================
    // DETERMINE EXCHANGE WINNER
    // ============================================================

    function determineExchangeWinner(playerAction, cpuAction) {
      if (playerAction === cpuAction) {
        return "draw";
      }

      const playerWins =
        (playerAction === "strike" && cpuAction === "counter") ||
        (playerAction === "counter" && cpuAction === "grapple") ||
        (playerAction === "grapple" && cpuAction === "strike");

      return playerWins ? "player" : "cpu";
    }

    // ============================================================
    // RESOLVE EXCHANGE
    // ============================================================

    async function resolveExchange(result, playerAction, cpuAction) {
      if (result === "draw") {
        roundResult.textContent = "Draw! No damage.";
        await wait(700);
        finishExchange();
        return;
      }

      const winnerAction = result === "player" ? playerAction : cpuAction;
      const damageAmount = DAMAGE[winnerAction];

      if (result === "player") {
        roundResult.textContent =
          `Player wins the exchange with ${ACTION_LABELS[winnerAction]}!`;

        await playAttackAnimation("player", winnerAction);
        applyDamage("cpu", damageAmount);
      } else {
        roundResult.textContent =
          `CPU wins the exchange with ${ACTION_LABELS[winnerAction]}!`;

        await playAttackAnimation("cpu", winnerAction);
        applyDamage("player", damageAmount);
      }

      updateHealthUI();

      if (checkMatchEnd()) {
        return;
      }

      await wait(500);
      finishExchange();
    }

    // ============================================================
    // DAMAGE
    // ============================================================

    function applyDamage(target, amount) {
      if (target === "player") {
        playerHealth = Math.max(0, playerHealth - amount);
      } else {
        cpuHealth = Math.max(0, cpuHealth - amount);
      }
    }

    // ============================================================
    // SIMPLE EXCHANGE ANIMATION
    // ============================================================

    async function playAttackAnimation(attacker, action) {
      const attackerEl = attacker === "player" ? playerFighter : cpuFighter;
      const defenderEl = attacker === "player" ? cpuFighter : playerFighter;

      attackerEl.classList.add("attacking");
      await wait(260);

      showImpact(attacker);

      const hitClass =
        action === "grapple"
          ? "grapple-hit"
          : action === "counter"
          ? "counter-hit"
          : "hit";

      defenderEl.classList.add(hitClass);
      await wait(300);

      hideImpact();

      attackerEl.classList.remove("attacking");
      defenderEl.classList.remove(hitClass);

      await wait(260);
    }

    function showImpact(attacker) {
      impact.style.display = "block";
      impact.textContent = "BAM!";

      if (attacker === "player") {
        impact.style.left = "54%";
        impact.style.top = "36%";
      } else {
        impact.style.left = "36%";
        impact.style.top = "36%";
      }
    }

    function hideImpact() {
      impact.style.display = "none";
    }

    // ============================================================
    // HEALTH / UI
    // ============================================================

    function updateHealthUI() {
      playerHealthBar.style.width = `${playerHealth}%`;
      cpuHealthBar.style.width = `${cpuHealth}%`;

      playerHpText.textContent = `${playerHealth} HP`;
      cpuHpText.textContent = `${cpuHealth} HP`;

      updateHealthBarColor(playerHealthBar, playerHealth);
      updateHealthBarColor(cpuHealthBar, cpuHealth);
    }

    function updateHealthBarColor(element, health) {
      if (health <= 30) {
        element.style.background =
          "linear-gradient(90deg, #d63a3a, var(--health-low))";
      } else {
        element.style.background =
          "linear-gradient(90deg, #37b957, var(--health))";
      }
    }

    // ============================================================
    // MATCH ENDING
    // ============================================================

    function checkMatchEnd() {
      if (playerHealth > 0 && cpuHealth > 0) {
        return false;
      }

      endMatch(playerHealth <= 0 ? "cpu" : "player");
      return true;
    }

    function endMatch(winner) {
      matchOver = true;
      exchangeLocked = true;
      setActionButtonsEnabled(false);

      if (winner === "player") {
        roundResult.textContent = "PLAYER WINS THE MATCH!";
        choiceDisplay.textContent = "The CPU's health reached 0.";
      } else {
        roundResult.textContent = "CPU WINS THE MATCH!";
        choiceDisplay.textContent = "Your health reached 0.";
      }

      restartButton.style.display = "inline-block";
    }

    // ============================================================
    // MATCH RESTART
    // ============================================================

    restartButton.addEventListener("click", restartMatch);

    function restartMatch() {
      playerHealth = MAX_HEALTH;
      cpuHealth = MAX_HEALTH;
      exchangeLocked = false;
      matchOver = false;

      playerFighter.className = "fighter player";
      cpuFighter.className = "fighter cpu";
      hideImpact();

      updateHealthUI();

      roundResult.textContent = "Choose your action.";
      choiceDisplay.textContent =
        "Strike beats Counter • Counter beats Grapple • Grapple beats Strike";

      restartButton.style.display = "none";
      setActionButtonsEnabled(true);
    }

    // ============================================================
    // EXCHANGE CONTROL HELPERS
    // ============================================================

    function finishExchange() {
      if (matchOver) return;

      exchangeLocked = false;
      roundResult.textContent = "Choose your next action.";
      setActionButtonsEnabled(true);
    }

    function setActionButtonsEnabled(enabled) {
      actionButtons.forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function wait(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    // ============================================================
    // INITIAL SETUP
    // ============================================================

    updateHealthUI();
  </script>
</body>
</html>
