const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),P=(x,y)=>({x,y});
function end(p,len,a){return{x:p.x+Math.sin(a)*len,y:p.y+Math.cos(a)*len}}

class Wrestler{
 constructor(x,y,type,human=false){Object.assign(this,{x,y,type,human,vx:0,vy:0,dir:1,hp:100,st:100,state:'idle',timer:0,down:0,attackCD:0,grab:null,pin:false,walkPhase:Math.random()*6.28})}
 hit(d,kx=0,ky=0,dc=.18){this.hp=clamp(this.hp-d,0,100);this.st=clamp(this.st-d*.35,0,100);this.vx+=kx;this.vy+=ky;if(Math.random()<dc||this.hp<18){this.state='down';this.down=105+Math.random()*65;this.grab=null}else{this.state='hurt';this.timer=15}}
}
let p1,p2,gameOver=false,count=0,countTimer=0;const message=document.getElementById('msg'),rematch=document.getElementById('rematch');
function reset(){p1=new Wrestler(W*.42,H*.59,'cody',true);p2=new Wrestler(W*.58,H*.59,'roman');gameOver=false;count=0;countTimer=0;message.textContent='';rematch.style.display='none'}reset();rematch.addEventListener('click',reset);

const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='j')strike(p1,p2);if(e.key.toLowerCase()==='k')grapple(p1,p2);if(e.key.toLowerCase()==='i')action(p1,p2);if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},running=false;const pad=document.getElementById('pad'),nub=document.getElementById('nub');
function moveJoy(e){const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,lim=48,s=Math.min(lim,m)/m;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`;joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1)}pad.addEventListener('touchstart',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e)},{passive:false});pad.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='translate(0,0)'});
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});el.addEventListener('mousedown',fn)}bind('strike',()=>strike(p1,p2));bind('grapple',()=>grapple(p1,p2));bind('action',()=>action(p1,p2));document.getElementById('run').addEventListener('touchstart',e=>{e.preventDefault();running=true},{passive:false});document.getElementById('run').addEventListener('touchend',()=>running=false);

function strike(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;a.state='strike';a.timer=18;a.attackCD=22;a.st-=4;if(dist(a,b)<100){a.dir=b.x>a.x?1:-1;b.hit(8+Math.random()*4,a.dir*3.5,(b.y-a.y)*.03,.2)}}
function grapple(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){const g=a.grab;a.attackCD=52;a.st-=14;g.hit(17,a.dir*5,-1,.92);g.state='down';g.down=130;a.grab=null;g.grab=null;a.state='idle';return}if(dist(a,b)<94&&b.state!=='down'){a.dir=b.x>a.x?1:-1;a.grab=b;b.grab=a;a.state='grapple';b.state='grappled';b.timer=44}}
function action(a,b){if(gameOver)return;if(a.state==='down'){a.down=Math.min(a.down,12);return}if(b.state==='down'&&dist(a,b)<94){a.state='pinning';b.state='pinned';a.pin=b.pin=true;count=0;countTimer=0}}
function ring(){const rw=Math.min(W*.9,840),rh=Math.min(H*.43,350),rx=(W-rw)/2,ry=H*.345;return{rx,ry,rw,rh}}
function physics(w,o){if(w.attackCD>0)w.attackCD--;if(w.timer>0&&--w.timer<=0&&['strike','hurt'].includes(w.state))w.state='idle';if(w.state==='grappled'){if(w.timer>0)w.timer--;if(w.timer<=0){w.state='idle';if(o.grab===w)o.grab=null}return}if(w.state==='down'){w.down--;if(w.down<=0&&!w.pin)w.state='idle'}if(['pinned','pinning'].includes(w.state))return;if(w.grab){w.grab.x=w.x+w.dir*48;w.grab.y=w.y+1;w.grab.vx=w.grab.vy=0}const r=ring();w.x=clamp(w.x+w.vx,r.rx+45,r.rx+r.rw-45);w.y=clamp(w.y+w.vy,r.ry+100,r.ry+r.rh-20);w.vx*=.78;w.vy*=.78;w.st=clamp(w.st+.085,0,100);if(Math.hypot(w.vx,w.vy)>.04)w.walkPhase+=.18*(1+Math.min(2,Math.hypot(w.vx,w.vy)))}
function playerControl(){if(gameOver||['down','pinned','pinning','grappled'].includes(p1.state))return;let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}const run=keys.l||running,sp=run&&p1.st>3?.80:.42;if(run&&m>.1)p1.st-=.22;p1.vx+=x*sp;p1.vy+=y*sp*.72;if(Math.abs(x)>.1)p1.dir=x>0?1:-1}
function ai(a,b){if(gameOver||['down','pinned','grappled'].includes(a.state))return;const d=dist(a,b);if(a.grab){if(Math.random()<.055)grapple(a,b);return}if(b.state==='down'&&d<92&&b.hp<52&&Math.random()<.018){action(a,b);return}if(d>82){a.vx+=(b.x-a.x)/d*.18;a.vy+=(b.y-a.y)/d*.14}else if(Math.random()<.04)strike(a,b);else if(Math.random()<.026)grapple(a,b)}
function pinLogic(){if(!p1.pin&&!p2.pin)return;countTimer++;if(countTimer%55===0){count++;message.textContent=count<3?count:'3 — PINFALL!';if(count>=3){gameOver=true;setTimeout(()=>{message.textContent=(p1.state==='pinning'?'CODY WINS!':'ROMAN WINS!');rematch.style.display='block'},250)}}}

function separate(a,b){if(['down','pinned'].includes(a.state)||['down','pinned'].includes(b.state)||a.grab===b||b.grab===a)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=64;if(d<min){const push=(min-d)/2;a.x-=dx/d*push;b.x+=dx/d*push;a.y-=dy/d*push*.25;b.y+=dy/d*push*.25}}

function drawCrowd(){const r=ring();ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let row=0;row<4;row++)for(let i=0;i<Math.ceil(W/34)+1;i++){let x=i*34+(row%2)*16,y=r.ry-44-row*38;ctx.fillStyle=`hsl(${(i*41+row*69)%360} 25% 32%)`;ctx.fillRect(x-10,y,20,30);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% 62%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill()}ctx.fillStyle='#353941';ctx.fillRect(0,r.ry-18,W,18)}
function drawRing(){const r=ring();ctx.fillStyle='#20242b';ctx.fillRect(r.rx-50,r.ry+35,r.rw+100,r.rh+75);ctx.fillStyle='#d7e1e8';ctx.fillRect(r.rx,r.ry,r.rw,r.rh);ctx.strokeStyle='#aeb4ba';ctx.lineWidth=4;[r.ry+28,r.ry+50,r.ry+72].forEach(y=>{ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});ctx.fillStyle='#111';ctx.fillRect(r.rx-9,r.ry-4,12,r.rh+28);ctx.fillRect(r.rx+r.rw-3,r.ry-4,12,r.rh+28);ctx.fillStyle='#181a20';ctx.fillRect(r.rx,r.ry+r.rh,r.rw,35)}

function centered(im,x,y,w,h,rot=0,flip=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function along(im,a,b,width,over=8,flip=false){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dx,dy);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(-ang);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-width/2,-over,width,len+over*2);ctx.restore()}

function pose(w){
 let root=0,bob=0,headTilt=0;
 let L={ua:.22,fa:.05,th:.04,lo:.02},R={ua:-.22,fa:-.05,th:-.04,lo:-.02};
 const speed=Math.hypot(w.vx,w.vy);
 if(w.state==='idle'&&speed<.08){bob=Math.sin(T*.004+w.walkPhase)*1.8;L.ua+=Math.sin(T*.003+w.walkPhase)*.03;R.ua-=Math.sin(T*.003+w.walkPhase)*.03}
 if(w.state==='idle'&&speed>=.08){const amp=Math.min(.52,.18+speed*.16),sw=Math.sin(w.walkPhase);L.th=amp*sw;R.th=-amp*sw;L.lo=-.35*sw;R.lo=.35*sw;L.ua=-.45*sw;R.ua=.45*sw;bob=Math.abs(Math.cos(w.walkPhase))*2.5}
 if(w.state==='strike'){const p=1-w.timer/18, snap=Math.sin(Math.min(1,p)*Math.PI);R.ua=-.35-1.0*snap;R.fa=-.2-1.25*snap;L.ua=.34;root=-.06*w.dir*snap;headTilt=.03*w.dir}
 if(w.state==='hurt'){L.ua=.85;L.fa=.4;R.ua=-.85;R.fa=-.4;root=.13*w.dir;headTilt=.10*w.dir}
 if(w.state==='grapple'){L.ua=1.02;L.fa=.62;R.ua=-1.02;R.fa=-.62;L.th=.08;R.th=-.08}
 if(w.state==='grappled'){L.ua=1.48;L.fa=1.75;R.ua=-1.48;R.fa=-1.75;root=-.08*w.dir}
 if(w.state==='pinning'){root=.32*w.dir;L.ua=.72;R.ua=-.72;L.fa=.2;R.fa=-.2;L.th=.3;R.th=-.3;L.lo=-.25;R.lo=.25}
 if(w.state==='down'){root=-1.48*w.dir;L.ua=1.2;L.fa=.5;R.ua=-1.0;R.fa=-.45;L.th=.62;L.lo=-.58;R.th=-.42;R.lo=.48;headTilt=-.08*w.dir}
 if(w.state==='pinned'){root=-1.48*w.dir;L.ua=.8;L.fa=.25;R.ua=-.7;R.fa=-.2;L.th=.32;L.lo=-.25;R.th=-.25;R.lo=.22}
 return{root,bob,headTilt,L,R};
}

function drawCody(w){
 const Q=pose(w),r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=.80+depth*.18;
 ctx.save();ctx.translate(w.x,w.y+Q.bob);ctx.scale(s,s);ctx.rotate(Q.root);
 ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(0,90,43,10,0,0,7);ctx.fill();
 const hipL=P(-17,19),hipR=P(17,19),shL=P(-38,-46),shR=P(38,-46);
 const kneeL=end(hipL,62,Q.L.th),footL=end(kneeL,67,Q.L.lo);
 const kneeR=end(hipR,62,Q.R.th),footR=end(kneeR,67,Q.R.lo);
 const elbowL=end(shL,55,Q.L.ua),wristL=end(elbowL,56,Q.L.fa);
 const elbowR=end(shR,55,Q.R.ua),wristR=end(elbowR,56,Q.R.fa);
 along(IMG.c_thigh,hipL,kneeL,39,10,false);along(IMG.c_boot,kneeL,footL,37,11,false);
 along(IMG.c_upper,shL,elbowL,34,10,false);along(IMG.c_fore,elbowL,wristL,32,11,false);
 centered(IMG.c_trunks,0,13,77,61);centered(IMG.c_torso,0,-43,105,102);
 along(IMG.c_thigh,hipR,kneeR,39,10,true);along(IMG.c_boot,kneeR,footR,37,11,true);
 along(IMG.c_upper,shR,elbowR,34,10,true);along(IMG.c_fore,elbowR,wristR,32,11,true);
 centered(IMG.c_head,0,-105,58,73,Q.headTilt,w.dir<0);ctx.restore();
}

function drawRoman(w){
 const Q=pose(w),r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=.79+depth*.18;
 ctx.save();ctx.translate(w.x,w.y+Q.bob);ctx.scale(s,s);ctx.rotate(Q.root);
 ctx.fillStyle='rgba(0,0,0,.23)';ctx.beginPath();ctx.ellipse(0,91,43,10,0,0,7);ctx.fill();
 const hipL=P(-17,19),hipR=P(17,19),shL=P(-39,-46),shR=P(39,-46);
 const kneeL=end(hipL,63,Q.L.th),footL=end(kneeL,69,Q.L.lo);
 const kneeR=end(hipR,63,Q.R.th),footR=end(kneeR,69,Q.R.lo);
 const elbowL=end(shL,57,Q.L.ua),wristL=end(elbowL,58,Q.L.fa);
 const elbowR=end(shR,57,Q.R.ua),wristR=end(elbowR,58,Q.R.fa);
 along(IMG.r_thigh,hipL,kneeL,40,10,false);along(IMG.r_boot,kneeL,footL,38,12,false);
 along(IMG.r_upper_tat,shL,elbowL,34,10,false);along(IMG.r_fore_red,elbowL,wristL,32,11,false);
 centered(IMG.r_pants,0,13,79,67);centered(IMG.r_torso,0,-43,108,104);
 along(IMG.r_thigh,hipR,kneeR,40,10,true);along(IMG.r_boot,kneeR,footR,38,12,true);
 along(IMG.r_upper_bare,shR,elbowR,34,10,true);along(IMG.r_fore_black,elbowR,wristR,32,11,true);
 centered(IMG.r_head,0,-106,61,70,Q.headTilt,w.dir<0);ctx.restore();
}

function drawW(w){w.type==='cody'?drawCody(w):drawRoman(w)}
function draw(){drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(ts){T=ts;playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);separate(p1,p2);pinLogic();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
