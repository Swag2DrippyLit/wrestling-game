<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Wrestling Game v0.2</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#090a0d;font-family:Arial,Helvetica,sans-serif;touch-action:none}
  #game{display:block;width:100vw;height:100vh;background:#090a0d}
  .hud{position:fixed;left:0;top:0;width:100%;pointer-events:none;color:white;text-shadow:0 2px 3px #000;font-weight:700}
  .bars{display:flex;justify-content:space-between;padding:10px 12px;gap:14px}
  .side{width:46%}
  .name{font-size:16px;margin-bottom:4px}
  .bar{height:12px;background:#333;border:2px solid #fff;border-radius:3px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#f5f5f5,#9a9a9a);width:100%}
  .stam{height:7px;margin-top:4px;background:#222;border:1px solid #ddd}
  .stam .fill{background:linear-gradient(90deg,#bbb,#666)}
  #msg{position:fixed;top:18%;left:0;width:100%;text-align:center;font-size:26px;color:#fff;pointer-events:none;text-shadow:0 3px 6px #000;font-weight:900}
  #controls{position:fixed;left:0;bottom:0;width:100%;height:43%;pointer-events:none}
  .pad{position:absolute;left:18px;bottom:18px;width:154px;height:154px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:auto}
  .nub{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.32);left:48px;top:48px}
  .buttons{position:absolute;right:18px;bottom:18px;width:185px;height:165px;pointer-events:auto}
  button{position:absolute;width:66px;height:66px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.48);color:#fff;font-size:13px;font-weight:900}
  #strike{right:0;top:42px}
  #grapple{right:62px;top:0}
  #run{right:62px;bottom:0}
  #action{left:0;top:47px}
  #help{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#bbb;font-size:11px;pointer-events:none;white-space:nowrap}
  @media (min-width:900px){#controls{display:none} #help{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="bars">
    <div class="side">
      <div class="name">YOU</div>
      <div class="bar"><div id="hp1" class="fill"></div></div>
      <div class="bar stam"><div id="st1" class="fill"></div></div>
    </div>
    <div class="side" style="text-align:right">
      <div class="name">CPU</div>
      <div class="bar"><div id="hp2" class="fill"></div></div>
      <div class="bar stam"><div id="st2" class="fill"></div></div>
    </div>
  </div>
</div>
<div id="msg"></div>
<div id="controls">
  <div id="pad" class="pad"><div id="nub" class="nub"></div></div>
  <div class="buttons">
    <button id="strike">STRIKE</button>
    <button id="grapple">GRAPPLE</button>
    <button id="run">RUN</button>
    <button id="action">PIN</button>
  </div>
</div>
<div id="help">Keyboard: WASD move • J strike • K grapple • L run • I pin/get up • R restart</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=Math.max(0,Math.min(255,(n>>16)+amt));
  let g=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  let b=Math.max(0,Math.min(255,(n&255)+amt));
  return `rgb(${r},${g},${b})`;
}
const msg=document.getElementById('msg');
let gameOver=false, count=0, countTimer=0;

class Wrestler{
  constructor(x,y,skin,trunks,human=false){
    Object.assign(this,{x,y,vx:0,vy:0,dir:1,skin,trunks,human,hp:100,st:100,state:'idle',timer:0,down:0,attackCD:0,grab:null,pin:false,flash:0});
  }
  hit(dmg,kx=0,ky=0,downChance=.18){
    if(this.state==='down' || this.state==='pinned') dmg*=.65;
    this.hp=clamp(this.hp-dmg,0,100); this.st=clamp(this.st-dmg*.3,0,100);
    this.vx+=kx; this.vy+=ky; this.flash=8;
    if(Math.random()<downChance || this.hp<18){
      this.state='down'; this.down=65+Math.random()*70; this.grab=null;
    } else { this.state='hurt'; this.timer=14; }
  }
}
let p1,p2;
function reset(){
  p1=new Wrestler(W*.43,H*.55,'#d6a275','#111',true);
  p2=new Wrestler(W*.57,H*.55,'#b9744c','#c22',false);
  gameOver=false;count=0;msg.textContent='';
}
reset();

const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='j') strike(p1,p2);
 if(e.key.toLowerCase()==='k') grapple(p1,p2);
 if(e.key.toLowerCase()==='i') action(p1,p2);
 if(e.key.toLowerCase()==='r') reset();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,y:0}, running=false;
const pad=document.getElementById('pad'),nub=document.getElementById('nub');
function moveJoy(e){
 const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
 const dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 const m=Math.hypot(dx,dy)||1,lim=47,scale=Math.min(lim,m)/m;
 const nx=dx*scale,ny=dy*scale;nub.style.transform=`translate(${nx}px,${ny}px)`;
 joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1);
}
pad.addEventListener('touchstart',e=>{e.preventDefault();moveJoy(e)},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e)},{passive:false});
pad.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='translate(0,0)'});
document.getElementById('strike').addEventListener('touchstart',e=>{e.preventDefault();strike(p1,p2)});
document.getElementById('grapple').addEventListener('touchstart',e=>{e.preventDefault();grapple(p1,p2)});
document.getElementById('action').addEventListener('touchstart',e=>{e.preventDefault();action(p1,p2)});
document.getElementById('run').addEventListener('touchstart',e=>{e.preventDefault();running=true});
document.getElementById('run').addEventListener('touchend',()=>running=false);
['strike','grapple','action'].forEach(id=>{
 document.getElementById(id).addEventListener('mousedown',e=>{
   if(id==='strike') strike(p1,p2); if(id==='grapple') grapple(p1,p2); if(id==='action') action(p1,p2);
 });
});

function strike(a,b){
 if(gameOver||a.attackCD>0||a.state==='down'||a.state==='pinned')return;
 if(a.grab){ // knee in grapple
   a.attackCD=20;a.st-=6;b.hit(8,a.dir*2.5,0,.2);return;
 }
 a.state='strike';a.timer=12;a.attackCD=18;a.st-=4;
 if(dist(a,b)<68){
   a.dir=b.x>a.x?1:-1;b.hit(6+Math.random()*4,a.dir*3,(b.y-a.y)*.03,.15);
 }
}
function grapple(a,b){
 if(gameOver||a.attackCD>0||a.state==='down'||a.state==='pinned')return;
 if(a.grab){
   // slam
   a.attackCD=44;a.st-=14;
   b.x=a.x+a.dir*26;b.y=a.y;
   b.hit(15,a.dir*6,-1,.85);
   b.state='down';b.down=110;
   a.grab=null;a.state='idle'; return;
 }
 if(dist(a,b)<62 && b.state!=='down' && b.state!=='pinned'){
   a.grab=b;b.grab=a;a.state='grapple';b.state='grappled';a.attackCD=20;b.timer=35;
 }
}
function action(a,b){
 if(gameOver)return;
 if(a.state==='down'){ a.down=Math.min(a.down,12); return; }
 if(b.state==='down' && dist(a,b)<65){
   a.state='pinning'; b.state='pinned'; b.pin=true; a.pin=true; count=0; countTimer=0;
 }
}
function releasePin(){
 p1.pin=p2.pin=false;
 if(p1.state==='pinning')p1.state='idle';
 if(p2.state==='pinned'){p2.state='down';p2.down=45;}
 count=0;msg.textContent='';
}

function ai(a,b){
 if(gameOver||a.state==='down'||a.state==='pinned'||a.state==='grappled')return;
 if(a.grab){
   if(Math.random()<.04)grapple(a,b);
   else if(Math.random()<.04)strike(a,b);
   return;
 }
 const d=dist(a,b);
 if(b.state==='down' && d<62 && b.hp<45 && Math.random()<.018){action(a,b);return}
 if(d>52){
   const sp=1.15+(a.hp<35?.15:0);
   a.vx+=(b.x-a.x)/d*.18*sp;a.vy+=(b.y-a.y)/d*.13*sp;
 } else {
   if(Math.random()<.035) strike(a,b);
   else if(Math.random()<.026) grapple(a,b);
   else {a.vx+=(Math.random()-.5)*.2;a.vy+=(Math.random()-.5)*.15}
 }
}


function ring(){
 const rw=Math.min(W*.86,820),rh=Math.min(H*.48,390),rx=(W-rw)/2,ry=H*.32;
 return {rx,ry,rw,rh,cx:W/2,cy:ry+rh/2};
}
function physics(w,other){
 if(w.flash>0)w.flash--; if(w.attackCD>0)w.attackCD--;
 if(w.timer>0 && --w.timer<=0 && (w.state==='strike'||w.state==='hurt'))w.state='idle';
 if(w.state==='grappled'){if(w.timer>0)w.timer--; if(w.timer<=0){w.state='idle';if(other.grab===w)other.grab=null;}return}
 if(w.state==='down'){
   w.down--;w.vx*=.91;w.vy*=.91;
   if(w.down<=0 && !w.pin){w.state='idle';w.hp=clamp(w.hp+1,0,100)}
 }
 if(w.state==='pinned'||w.state==='pinning')return;
 if(w.grab){
   const g=w.grab;w.dir=g.x>w.x?1:-1;g.x=w.x+w.dir*34;g.y=w.y+3;g.vx=g.vy=0;
 }
 const r=ring(),margin=28;
 w.x=clamp(w.x+w.vx,r.rx+margin,r.rx+r.rw-margin);
 w.y=clamp(w.y+w.vy,r.ry+67,r.ry+r.rh-25);
 w.vx*=.78;w.vy*=.78;
 w.st=clamp(w.st+.085,0,100);
}
function playerControl(){
 if(gameOver||p1.state==='down'||p1.state==='pinned'||p1.state==='pinning'||p1.state==='grappled')return;
 let x=(keys['d']?1:0)-(keys['a']?1:0)+joy.x;
 let y=(keys['s']?1:0)-(keys['w']?1:0)+joy.y;
 const m=Math.hypot(x,y); if(m>1){x/=m;y/=m}
 const run=keys['l']||running, sp=run&&p1.st>3?0.72:0.38;
 if(run&&m>.1)p1.st=clamp(p1.st-.22,0,100);
 p1.vx+=x*sp;p1.vy+=y*sp*.75;
 if(Math.abs(x)>.1)p1.dir=x>0?1:-1;
}
function pinLogic(){
 if(!p1.pin&&!p2.pin)return;
 countTimer++;
 const pinned=p1.state==='pinned'?p1:p2;
 if(countTimer%55===0){
   count++;
   msg.textContent=count<3?String(count):'3 — PINFALL!';
   if(count>=3){
     gameOver=true;
     setTimeout(()=>msg.textContent=(p1.state==='pinning'?'YOU WIN!':'CPU WINS!')+'  —  Press R to restart',250);
     return;
   }
 }
 if(countTimer>38){
   const chance=(pinned.hp/100)*.006 + (count===2?.004:0);
   if((pinned===p1 && (keys['i']||Math.random()<chance*.55)) || (pinned===p2 && Math.random()<chance)){
      releasePin();
   }
 }
}

function drawCrowd(){
 const r=ring();
 ctx.fillStyle='#08090b';ctx.fillRect(0,0,W,H);
 let grd=ctx.createLinearGradient(0,70,0,r.ry);
 grd.addColorStop(0,'#1b1d24');grd.addColorStop(1,'#08090b');
 ctx.fillStyle=grd;ctx.fillRect(0,65,W,r.ry-45);
 for(let row=0;row<4;row++){
   const step=35;
   for(let i=-1;i<W/step+2;i++){
     const x=i*step+(row%2)*18;
     const y=r.ry-43-row*36+Math.sin(i*1.6+row)*4;
     const hue=(i*47+row*71+3600)%360;
     ctx.fillStyle=`hsl(${hue} 25% ${25+row*3}%)`;
     ctx.fillRect(x-10,y,20,27);
     ctx.fillStyle=`hsl(${22+(i%4)*7} 32% ${53+(i%3)*5}%)`;
     ctx.beginPath();ctx.arc(x,y-8,8.5,0,Math.PI*2);ctx.fill();
     if((i+row*3)%9===0){
       ctx.fillStyle='#eee';ctx.fillRect(x-14,y-36,28,16);
       ctx.fillStyle='#222';ctx.font='bold 7px Arial';ctx.textAlign='center';ctx.fillText('FIGHT!',x,y-25);
     }
   }
 }
 ctx.fillStyle='#42464d';ctx.fillRect(0,r.ry-18,W,18);
 ctx.fillStyle='#17191d';ctx.fillRect(0,r.ry-12,W,6);
}

function drawRing(){
 const r=ring();
 ctx.fillStyle='#20232a';ctx.fillRect(r.rx-48,r.ry+28,r.rw+96,r.rh+85);
 ctx.fillStyle='#12141a';ctx.fillRect(r.rx-10,r.ry+r.rh-4,r.rw+20,49);
 ctx.fillStyle='#242936';ctx.fillRect(r.rx,r.ry+r.rh+7,r.rw,23);
 ctx.fillStyle='#ededed';ctx.font='bold 15px Arial';ctx.textAlign='center';
 ctx.fillText('WRESTLING REVOLUTION-ISH',r.rx+r.rw/2,r.ry+r.rh+25);

 const g=ctx.createLinearGradient(0,r.ry,0,r.ry+r.rh);
 g.addColorStop(0,'#e1e9ee');g.addColorStop(1,'#b9c5ce');
 ctx.fillStyle=g;ctx.beginPath();
 ctx.moveTo(r.rx+18,r.ry);ctx.lineTo(r.rx+r.rw-18,r.ry);
 ctx.lineTo(r.rx+r.rw,r.ry+r.rh);ctx.lineTo(r.rx,r.ry+r.rh);ctx.closePath();ctx.fill();

 ctx.strokeStyle='rgba(70,90,100,.13)';ctx.lineWidth=1;
 for(let i=1;i<9;i++){
   let xt=r.rx+18+(r.rw-36)*i/9, xb=r.rx+r.rw*i/9;
   ctx.beginPath();ctx.moveTo(xt,r.ry);ctx.lineTo(xb,r.ry+r.rh);ctx.stroke();
 }
 for(let j=1;j<5;j++){
   let y=r.ry+r.rh*j/5;
   ctx.beginPath();ctx.moveTo(r.rx,y);ctx.lineTo(r.rx+r.rw,y);ctx.stroke();
 }

 ctx.fillStyle='#0b0c10';
 ctx.fillRect(r.rx-10,r.ry-5,13,r.rh+30);
 ctx.fillRect(r.rx+r.rw-3,r.ry-5,13,r.rh+30);

 [r.ry+26,r.ry+47,r.ry+68].forEach((y,i)=>{
   ctx.strokeStyle=i===1?'#dedede':'#b8b8b8';ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(r.rx-5,y);ctx.lineTo(r.rx+r.rw+5,y);ctx.stroke();
 });
 [[r.rx-4,r.ry+22],[r.rx+r.rw+4,r.ry+22]].forEach(([x,y])=>{
   ctx.fillStyle='#101116';
   for(let j=0;j<3;j++)ctx.fillRect(x-8,y+j*21,16,12);
 });
}
function limb(x1,y1,x2,y2,width,color){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function drawBoot(x1,y1,x2,y2,width,color){
 limb(x1,y1,x2,y2,width,color);
 const a=Math.atan2(y2-y1,x2-x1);
 ctx.save();ctx.translate(x2,y2);ctx.rotate(a);
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-width*.2,-width*.54,width*1.25,width*1.08,4);ctx.fill();ctx.restore();
}
function wrestlerPose(w){
 const p={
  ls:[-16,-23],rs:[16,-23],le:[-29,-5],re:[29,-5],lh:[-32,12],rh:[32,12],
  lhip:[-9,15],rhip:[9,15],lk:[-11,42],rk:[11,42],lf:[-14,67],rf:[14,67],tilt:0
 };
 if(w.state==='strike'){
   if(w.dir>0){p.re=[31,-17];p.rh=[52,-21]} else {p.le=[-31,-17];p.lh=[-52,-21]}
   p.tilt=-.05*w.dir;
 }
 if(w.state==='grapple'){
   p.le=[-23,-14];p.lh=[-34,-4];p.re=[23,-14];p.rh=[34,-4];p.tilt=.08*w.dir;
 }
 if(w.state==='grappled'){
   p.le=[-11,-34];p.lh=[-19,-47];p.re=[11,-34];p.rh=[19,-47];p.tilt=-.1*w.dir;
 }
 if(w.state==='hurt'){
   p.le=[-20,-25];p.lh=[-5,-38];p.re=[20,-25];p.rh=[5,-38];p.tilt=.11*w.dir;
 }
 return p;
}
function drawStanding(w){
 const r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),sc=.86+depth*.23;
 const skin=w.flash%2?shade(w.skin,45):w.skin,dark=shade(skin,-28),lite=shade(skin,24),p=wrestlerPose(w);
 ctx.save();ctx.translate(w.x,w.y);ctx.scale(sc,sc);ctx.rotate(p.tilt);
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,68,25,8,0,0,Math.PI*2);ctx.fill();

 limb(...p.ls,...p.le,11,dark);circle(...p.le,5.5,dark);limb(...p.le,...p.lh,9,dark);circle(...p.lh,6,dark);
 limb(...p.lhip,...p.lk,13,dark);circle(...p.lk,6,dark);drawBoot(...p.lk,...p.lf,12,'#080808');

 ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-20,-34,40,54,13);ctx.fill();
 ctx.fillStyle=lite;ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(-8,-15,7,16,-.25,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle=dark;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(0,7);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-13,-7);ctx.quadraticCurveTo(0,-1,13,-7);ctx.stroke();

 ctx.fillStyle=w.trunks;ctx.beginPath();ctx.roundRect(-20,7,40,18,3);ctx.fill();

 limb(...p.rhip,...p.rk,13,skin);circle(...p.rk,6,skin);drawBoot(...p.rk,...p.rf,12,'#080808');
 limb(...p.rs,...p.re,11,skin);circle(...p.re,5.5,skin);limb(...p.re,...p.rh,9,skin);circle(...p.rh,6,skin);

 ctx.fillStyle=dark;ctx.fillRect(-6,-42,12,10);
 ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-53,14,16,0,0,Math.PI*2);ctx.fill();
 circle(-14,-52,3,skin);circle(14,-52,3,skin);
 ctx.fillStyle='#241914';ctx.beginPath();ctx.arc(0,-56,14,Math.PI,Math.PI*2);ctx.lineTo(13,-53);ctx.quadraticCurveTo(6,-63,0,-62);ctx.quadraticCurveTo(-7,-63,-13,-53);ctx.fill();

 const d=w.dir;
 ctx.strokeStyle='#261511';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(d*2,-56);ctx.lineTo(d*8,-57);ctx.stroke();
 circle(d*6,-54,1.6,'#15100e');
 ctx.strokeStyle=dark;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(d*3,-51);ctx.lineTo(d*6,-48);ctx.stroke();
 ctx.strokeStyle='#6b342f';ctx.beginPath();ctx.moveTo(-4,-44);ctx.lineTo(4,-44);ctx.stroke();
 ctx.restore();
}
function drawDown(w){
 const r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),sc=.86+depth*.23;
 const skin=w.flash%2?shade(w.skin,45):w.skin,dark=shade(skin,-28);
 ctx.save();ctx.translate(w.x,w.y+12);ctx.scale(sc,sc);ctx.rotate(-1.47*w.dir);
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,22,38,9,0,0,Math.PI*2);ctx.fill();
 limb(-9,14,-11,41,13,dark);drawBoot(-11,41,-13,65,12,'#080808');
 limb(9,14,12,41,13,skin);drawBoot(12,41,15,65,12,'#080808');
 ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-20,-30,40,49,13);ctx.fill();
 ctx.fillStyle=w.trunks;ctx.fillRect(-20,7,40,18);
 limb(-16,-18,-33,-4,11,dark);limb(-33,-4,-40,12,9,dark);circle(-40,12,6,dark);
 limb(16,-18,31,-7,11,skin);limb(31,-7,39,8,9,skin);circle(39,8,6,skin);
 ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(0,-45,14,16,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#241914';ctx.beginPath();ctx.arc(0,-48,14,Math.PI,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawW(w){
 if(w.state==='down'||w.state==='pinned')drawDown(w); else drawStanding(w);
}
function drawForegroundRopes(){
 const r=ring();
 [r.ry+r.rh-18,r.ry+r.rh-39,r.ry+r.rh-60].forEach((y,i)=>{
   ctx.strokeStyle=i===1?'#e1e1e1':'#bdbdbd';ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(r.rx-5,y);ctx.lineTo(r.rx+r.rw+5,y);ctx.stroke();
 });
}
function draw(){
 drawCrowd();drawRing();
 [p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);
 drawForegroundRopes();
 document.getElementById('hp1').style.width=p1.hp+'%';
 document.getElementById('hp2').style.width=p2.hp+'%';
 document.getElementById('st1').style.width=p1.st+'%';
 document.getElementById('st2').style.width=p2.st+'%';
}

function loop(){
 playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);pinLogic();
 if(p1.hp<=0 && p1.state!=='down'){p1.state='down';p1.down=160}
 if(p2.hp<=0 && p2.state!=='down'){p2.state='down';p2.down=160}
 draw();requestAnimationFrame(loop);
}
loop();
</script>
