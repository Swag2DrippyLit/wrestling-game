const IMG={};
for(const k in SPRITES){const im=new Image();im.src=SPRITES[k];IMG[k]=im}

const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

class Wrestler{
 constructor(x,y,type,human=false){Object.assign(this,{x,y,type,human,vx:0,vy:0,dir:1,hp:100,st:100,state:'idle',timer:0,down:0,attackCD:0,grab:null,pin:false})}
 hit(d,kx=0,ky=0,dc=.18){this.hp=clamp(this.hp-d,0,100);this.st=clamp(this.st-d*.35,0,100);this.vx+=kx;this.vy+=ky;if(Math.random()<dc||this.hp<18){this.state='down';this.down=100+Math.random()*60;this.grab=null}else{this.state='hurt';this.timer=15}}
}
let p1,p2,gameOver=false,count=0,countTimer=0;
const message=document.getElementById('msg'),rematch=document.getElementById('rematch');

function reset(){
 p1=new Wrestler(W*.42,H*.59,'cody',true);
 p2=new Wrestler(W*.58,H*.59,'roman',false);
 gameOver=false;count=0;countTimer=0;message.textContent='';rematch.style.display='none';
}
reset(); rematch.addEventListener('click',reset);

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='j')strike(p1,p2);if(e.key.toLowerCase()==='k')grapple(p1,p2);if(e.key.toLowerCase()==='i')action(p1,p2);if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,y:0},running=false;
const pad=document.getElementById('pad'),nub=document.getElementById('nub');
function moveJoy(e){const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,lim=48,s=Math.min(lim,m)/m;nub.style.transform=`translate(${dx*s}px,${dy*s}px)`;joy.x=clamp(dx/lim,-1,1);joy.y=clamp(dy/lim,-1,1)}
pad.addEventListener('touchstart',e=>{e.preventDefault();moveJoy(e)},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();moveJoy(e)},{passive:false});
pad.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='translate(0,0)'});
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});el.addEventListener('mousedown',fn)}
bind('strike',()=>strike(p1,p2));bind('grapple',()=>grapple(p1,p2));bind('action',()=>action(p1,p2));
document.getElementById('run').addEventListener('touchstart',e=>{e.preventDefault();running=true},{passive:false});
document.getElementById('run').addEventListener('touchend',()=>running=false);

function strike(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;a.state='strike';a.timer=14;a.attackCD=19;a.st-=4;if(dist(a,b)<96){a.dir=b.x>a.x?1:-1;b.hit(8+Math.random()*4,a.dir*3.5,(b.y-a.y)*.03,.2)}}
function grapple(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){const g=a.grab;a.attackCD=48;a.st-=14;g.hit(17,a.dir*5,-1,.92);g.state='down';g.down=125;a.grab=null;g.grab=null;a.state='idle';return}if(dist(a,b)<92&&b.state!=='down'){a.dir=b.x>a.x?1:-1;a.grab=b;b.grab=a;a.state='grapple';b.state='grappled';b.timer=40}}
function action(a,b){if(gameOver)return;if(a.state==='down'){a.down=Math.min(a.down,12);return}if(b.state==='down'&&dist(a,b)<92){a.state='pinning';b.state='pinned';a.pin=b.pin=true;count=0;countTimer=0}}
function ring(){const rw=Math.min(W*.9,840),rh=Math.min(H*.43,350),rx=(W-rw)/2,ry=H*.345;return{rx,ry,rw,rh}}
function physics(w,o){if(w.attackCD>0)w.attackCD--;if(w.timer>0&&--w.timer<=0&&['strike','hurt'].includes(w.state))w.state='idle';if(w.state==='grappled'){if(w.timer>0)w.timer--;if(w.timer<=0){w.state='idle';if(o.grab===w)o.grab=null}return}if(w.state==='down'){w.down--;if(w.down<=0&&!w.pin)w.state='idle'}if(['pinned','pinning'].includes(w.state))return;if(w.grab){w.grab.x=w.x+w.dir*48;w.grab.y=w.y+1;w.grab.vx=w.grab.vy=0}const r=ring();w.x=clamp(w.x+w.vx,r.rx+45,r.rx+r.rw-45);w.y=clamp(w.y+w.vy,r.ry+95,r.ry+r.rh-20);w.vx*=.78;w.vy*=.78;w.st=clamp(w.st+.085,0,100)}
function playerControl(){if(gameOver||['down','pinned','pinning','grappled'].includes(p1.state))return;let x=(keys.d?1:0)-(keys.a?1:0)+joy.x,y=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}const run=keys.l||running,sp=run&&p1.st>3?.76:.40;if(run&&m>.1)p1.st-=.22;p1.vx+=x*sp;p1.vy+=y*sp*.72;if(Math.abs(x)>.1)p1.dir=x>0?1:-1}
function ai(a,b){if(gameOver||['down','pinned','grappled'].includes(a.state))return;const d=dist(a,b);if(a.grab){if(Math.random()<.055)grapple(a,b);return}if(b.state==='down'&&d<90&&b.hp<52&&Math.random()<.018){action(a,b);return}if(d>78){a.vx+=(b.x-a.x)/d*.18;a.vy+=(b.y-a.y)/d*.14}else if(Math.random()<.04)strike(a,b);else if(Math.random()<.026)grapple(a,b)}
function pinLogic(){if(!p1.pin&&!p2.pin)return;countTimer++;if(countTimer%55===0){count++;message.textContent=count<3?count:'3 — PINFALL!';if(count>=3){gameOver=true;setTimeout(()=>{message.textContent=(p1.state==='pinning'?'CODY WINS!':'ROMAN WINS!');rematch.style.display='block'},250)}}}

function drawCrowd(){const r=ring();ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let row=0;row<4;row++)for(let i=0;i<Math.ceil(W/34)+1;i++){let x=i*34+(row%2)*16,y=r.ry-44-row*38;ctx.fillStyle=`hsl(${(i*41+row*69)%360} 25% 32%)`;ctx.fillRect(x-10,y,20,30);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% 62%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill()}ctx.fillStyle='#353941';ctx.fillRect(0,r.ry-18,W,18)}
function drawRing(){const r=ring();ctx.fillStyle='#20242b';ctx.fillRect(r.rx-50,r.ry+35,r.rw+100,r.rh+75);ctx.fillStyle='#d7e1e8';ctx.fillRect(r.rx,r.ry,r.rw,r.rh);ctx.strokeStyle='#aeb4ba';ctx.lineWidth=4;[r.ry+28,r.ry+50,r.ry+72].forEach(y=>{ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});ctx.fillStyle='#111';ctx.fillRect(r.rx-9,r.ry-4,12,r.rh+28);ctx.fillRect(r.rx+r.rw-3,r.ry-4,12,r.rh+28);ctx.fillStyle='#181a20';ctx.fillRect(r.rx,r.ry+r.rh,r.rw,35)}

function drawW(w){
 const im=IMG[w.type], r=ring(), depth=clamp((w.y-r.ry)/r.rh,0,1);
 let scale=.76+depth*.18, rot=0, lean=0, squash=1;
 if(w.state==='strike'){lean=-.12*w.dir}
 if(w.state==='hurt'){lean=.12*w.dir}
 if(w.state==='grapple'){lean=.08*w.dir}
 if(w.state==='grappled'){lean=-.14*w.dir}
 if(w.state==='down'||w.state==='pinned'){rot=-1.5*w.dir;scale*=.93;squash=.96}
 ctx.save();ctx.translate(w.x,w.y);ctx.scale(scale,scale*squash);ctx.rotate(rot+lean);
 ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,92,42,10,0,0,7);ctx.fill();
 const h=190, ar=im.width/im.height, ww=h*ar;
 ctx.drawImage(im,-ww/2,-h+92,ww,h);
 ctx.restore();
}
function draw(){drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(){playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);pinLogic();draw();requestAnimationFrame(loop)}loop();
</script>
