<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Wrestling Combat Prototype - Version 2.3.1</title>
  <style>
    :root {
      --bg: #111722;
      --panel: #1a2230;
      --text: #f4f7fb;
      --muted: #aeb8c7;
      --ring-mat: #d9e6ef;
      --ring-edge: #57697c;
      --rope: #e7edf3;
      --player: #2f7df6;
      --cpu: #e34e4e;
      --health: #53d769;
      --health-low: #ff5a5a;
      --button: #2a3445;
      --button-hover: #39465b;
      --accent: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c2635 0%, var(--bg) 58%), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      overflow-x: hidden;
    }

    .game-shell { width: min(980px, 100%); }

    .title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0.5px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 14px;
    }

    .fighter-card {
      background: rgba(26, 34, 48, 0.96);
      border: 1px solid #344154;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,.22);
    }

    .fighter-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .health-track {
      height: 22px;
      background: #0e131c;
      border: 2px solid #4d5b6e;
      border-radius: 999px;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #37b957, var(--health));
      transition: width 260ms ease, background 260ms ease;
    }

    .arena {
      position: relative;
      height: clamp(350px, 54vw, 520px);
      min-height: 350px;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(to bottom, #33455d 0 42%, #252d38 42% 100%);
      border: 1px solid #3f4e62;
      box-shadow: 0 16px 36px rgba(0,0,0,.28);
    }

    .crowd {
      position: absolute;
      inset: 0 0 auto 0;
      height: 43%;
      opacity: .55;
      background:
        radial-gradient(circle at 8% 35%, #c4cad4 0 3px, transparent 4px),
        radial-gradient(circle at 18% 50%, #9aa5b6 0 3px, transparent 4px),
        radial-gradient(circle at 30% 28%, #d1d5dd 0 3px, transparent 4px),
        radial-gradient(circle at 42% 52%, #9da8b7 0 3px, transparent 4px),
        radial-gradient(circle at 53% 33%, #cbd0d9 0 3px, transparent 4px),
        radial-gradient(circle at 65% 48%, #a7b1c1 0 3px, transparent 4px),
        radial-gradient(circle at 79% 31%, #d5d9e0 0 3px, transparent 4px),
        radial-gradient(circle at 91% 53%, #9ea9b9 0 3px, transparent 4px);
      background-size: 120px 78px;
    }

    .ring {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 8%;
      height: 59%;
    }

    .ring-mat {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 55%;
      background: linear-gradient(#edf4f8, var(--ring-mat));
      border: 5px solid var(--ring-edge);
      box-shadow: 0 15px 0 #313c49;
    }

    .ring-skirt {
      position: absolute;
      left: 4%; right: 4%; bottom: -18px;
      height: 42px;
      background: linear-gradient(#253142, #151b24);
      border: 4px solid #313c49;
      border-top: none;
    }

    .post {
      position: absolute;
      bottom: 10%;
      width: 14px;
      height: 82%;
      background: #3a4658;
      border: 3px solid #222a35;
      border-radius: 3px;
      z-index: 3;
    }
    .post.left { left: 2%; }
    .post.right { right: 2%; }

    .rope {
      position: absolute;
      left: 3%; right: 3%;
      height: 4px;
      background: var(--rope);
      box-shadow: 0 1px 2px rgba(0,0,0,.6);
      z-index: 2;
    }
    .rope.top { bottom: 76%; }
    .rope.mid { bottom: 58%; }
    .rope.low { bottom: 40%; }

    /* ==========================================================
       V2.2 SVG SKELETAL WRESTLER RIG
       Every limb is rendered between mathematically calculated joints.
       ========================================================== */

    .fighter {
      position: absolute;
      bottom: 17%;
      width: 155px;
      height: 220px;
      z-index: 5;
      transform-origin: 50% 86%;
      pointer-events: none;
    }

    .fighter.player { left: 20%; }
    .fighter.cpu { left: 67%; }

    .fighter-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 3px 1px rgba(0,0,0,.16));
    }

    .fighter.cpu .fighter-svg {
      transform: scaleX(-1);
      transform-origin: 50% 50%;
    }

    .bone {
      stroke: #202733;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .skin-bone { stroke: #e8b18e; }
    .gear-bone { stroke: #161f2d; }

    .joint {
      stroke: #202733;
      stroke-width: 3;
    }

    .skin-joint { fill: #e8b18e; }
    .gear-joint { fill: #161f2d; }

    .torso-shape {
      stroke: #202733;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .player .torso-shape { fill: var(--player); }
    .cpu .torso-shape { fill: var(--cpu); }

    .torso-highlight {
      fill: rgba(255,255,255,.14);
      pointer-events: none;
    }

    .chest-line{fill:none;stroke:rgba(32,39,51,.48);stroke-width:2.2;stroke-linecap:round}
    .chest-mark{fill:none;stroke:rgba(255,255,255,.28);stroke-width:2.1;stroke-linecap:round}
    .waist-line{fill:none;stroke:rgba(32,39,51,.42);stroke-width:2}
    .ear-shape{fill:#d99a78;stroke:#202733;stroke-width:2}
    .mouth-line{fill:none;stroke:#8e5946;stroke-width:1.8;stroke-linecap:round}

    .head-shape {
      fill: #e8b18e;
      stroke: #202733;
      stroke-width: 4;
    }

    .hair-shape { fill: #372b27; }
    .face-eye { fill: #202733; }
    .face-nose {
      fill: none;
      stroke: #9a654c;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .boot-shape {
      fill: #0d141f;
      stroke: #202733;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .far-limb { opacity: .78; }
    .near-limb { opacity: 1; }

    .fighter-nameplate {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      color: #26303c;
      background: rgba(255,255,255,.76);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .impact {
      position: absolute;
      z-index: 20;
      display: none;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 3px 3px 0 #1c1c1c;
      pointer-events: none;
    }

    .move-name {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12,17,25,.75);
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 800;
      letter-spacing: .7px;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }
    .move-name.show { opacity: 1; }

    .status-panel {
      margin-top: 14px;
      padding: 16px;
      min-height: 112px;
      background: rgba(26,34,48,.96);
      border: 1px solid #344154;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0,0,0,.2);
    }

    .round-result {
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 800;
      margin-bottom: 7px;
    }

    .choices {
      color: var(--muted);
      min-height: 22px;
      line-height: 1.5;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 58px;
      border: 1px solid #46556a;
      border-radius: 12px;
      background: var(--button);
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) { background: var(--button-hover); transform: translateY(-2px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .restart-wrap { margin-top: 12px; text-align: center; }
    #restartButton {
      display: none;
      min-width: 210px;
      padding: 0 24px;
      background: #3b8b4a;
      border-color: #58a968;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: #7e8a9d;
      font-size: 13px;
    }

    @media (max-width: 620px) {
      body { padding: 14px 10px; }
      .hud { gap: 10px; }
      .fighter-card { padding: 10px; }
      .fighter { transform: scale(.85); transform-origin: center bottom; }
      .fighter.player { left: 16%; }
      .fighter.cpu { left: 64%; }
      .controls { gap: 8px; }
      button { min-height: 54px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1 class="title">2D Wrestling Combat Prototype — V2.3.1</h1>

    <!-- V1 HEALTH HUD: gameplay values unchanged -->
    <section class="hud">
      <div class="fighter-card">
        <div class="fighter-label"><span>PLAYER</span><span id="playerHpText">100 HP</span></div>
        <div class="health-track"><div id="playerHealth" class="health-fill"></div></div>
      </div>
      <div class="fighter-card">
        <div class="fighter-label"><span>CPU</span><span id="cpuHpText">100 HP</span></div>
        <div class="health-track"><div id="cpuHealth" class="health-fill"></div></div>
      </div>
    </section>

    <section class="arena">
      <div class="crowd"></div>
      <div class="ring" id="ring">
        <div class="rope top"></div>
        <div class="rope mid"></div>
        <div class="rope low"></div>
        <div class="post left"></div>
        <div class="post right"></div>
        <div class="ring-mat"></div>
        <div class="ring-skirt"></div>

        <div id="moveName" class="move-name"></div>

        <!-- V2.2 SVG skeletal Player -->
        <div id="playerFighter" class="fighter player" aria-label="Player wrestler">
          <svg class="fighter-svg" viewBox="0 0 160 220" aria-hidden="true"></svg>
          <div class="fighter-nameplate">PLAYER</div>
        </div>

        <!-- V2.2 SVG skeletal CPU -->
        <div id="cpuFighter" class="fighter cpu" aria-label="CPU wrestler">
          <svg class="fighter-svg" viewBox="0 0 160 220" aria-hidden="true"></svg>
          <div class="fighter-nameplate">CPU</div>
        </div>

        <div id="impact" class="impact">BAM!</div>
      </div>
    </section>

    <section class="status-panel" aria-live="polite">
      <div id="roundResult" class="round-result">Choose your action.</div>
      <div id="choiceDisplay" class="choices">Strike beats Counter • Counter beats Grapple • Grapple beats Strike</div>
    </section>

    <section class="controls">
      <button class="action-button" data-action="strike">Strike</button>
      <button class="action-button" data-action="grapple">Grapple</button>
      <button class="action-button" data-action="counter">Counter</button>
    </section>

    <div class="restart-wrap"><button id="restartButton">Restart Match</button></div>
    <div class="footer-note">Version 2.3.1 — Synced 3/4-front wrestler rendering</div>
  </main>

  <script>
    // ============================================================
    // V1 GAME STATE - UNCHANGED GAMEPLAY VALUES
    // ============================================================
    const MAX_HEALTH = 100;
    const DAMAGE = { strike: 10, grapple: 15, counter: 12 };
    const ACTION_LABELS = { strike: "Strike", grapple: "Grapple", counter: "Counter" };

    let playerHealth = MAX_HEALTH;
    let cpuHealth = MAX_HEALTH;
    let exchangeLocked = false;
    let matchOver = false;

    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const playerHealthBar = document.getElementById("playerHealth");
    const cpuHealthBar = document.getElementById("cpuHealth");
    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");
    const playerFighter = document.getElementById("playerFighter");
    const cpuFighter = document.getElementById("cpuFighter");
    const impact = document.getElementById("impact");
    const moveName = document.getElementById("moveName");
    const roundResult = document.getElementById("roundResult");
    const choiceDisplay = document.getElementById("choiceDisplay");
    const actionButtons = [...document.querySelectorAll(".action-button")];
    const restartButton = document.getElementById("restartButton");

    // ============================================================
    // V2.2 COORDINATE-BASED SVG SKELETON
    // Limb endpoints are derived from parent joints every frame.
    // ============================================================

    const SVG_NS = "http://www.w3.org/2000/svg";

    const BASE_POSE = {
      x: 0, y: 0, bodyRot: 0, bodyLean: 0,
      headTilt: -3,
      nearUpperArm: 34, nearForearm: -38,
      farUpperArm: 19, farForearm: -28,
      nearThigh: 8, nearShin: -7,
      farThigh: -9, farShin: 9
    };

    function createFighterController(element, homeX) {
      return {
        element,
        svg: element.querySelector(".fighter-svg"),
        homeX,
        pose: { ...BASE_POSE, x: homeX },
        animToken: 0
      };
    }

    const fighters = {
      player: createFighterController(playerFighter, 20),
      cpu: createFighterController(cpuFighter, 67)
    };

    function pointFrom(start, length, angleDeg) {
      const r = angleDeg * Math.PI / 180;
      return {
        x: start.x + Math.sin(r) * length,
        y: start.y + Math.cos(r) * length
      };
    }

    function rotatePoint(p, center, deg) {
      const r = deg * Math.PI / 180;
      const dx = p.x - center.x;
      const dy = p.y - center.y;
      return {
        x: center.x + dx * Math.cos(r) - dy * Math.sin(r),
        y: center.y + dx * Math.sin(r) + dy * Math.cos(r)
      };
    }

    function svgEl(name, attrs = {}) {
      const el = document.createElementNS(SVG_NS, name);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function line(svg, a, b, cls, width) {
      svg.appendChild(svgEl("line", {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        class: `bone ${cls}`, "stroke-width": width
      }));
    }

    function circle(svg, p, r, cls) {
      svg.appendChild(svgEl("circle", {
        cx: p.x, cy: p.y, r, class: `joint ${cls}`
      }));
    }

    function polygon(svg, points, cls) {
      svg.appendChild(svgEl("polygon", {
        points: points.map(p => `${p.x},${p.y}`).join(" "),
        class: cls
      }));
    }

    function renderFighter(f){
  const p=f.pose,svg=f.svg; svg.innerHTML="";
  const center={x:82,y:108},sy=p.y||0;

  let farShoulder={x:67,y:58+sy},nearShoulder={x:111,y:65+sy};
  let farHip={x:73,y:116+sy},nearHip={x:101,y:121+sy};
  let neck={x:91,y:51+sy},headCenter={x:101,y:31+sy};

  const br=(p.bodyRot||0)+(p.bodyLean||0);
  [farShoulder,nearShoulder,farHip,nearHip,neck,headCenter]=
    [farShoulder,nearShoulder,farHip,nearHip,neck,headCenter].map(q=>rotatePoint(q,center,br));

  const farElbow=pointFrom(farShoulder,35,p.farUpperArm+br);
  const farWrist=pointFrom(farElbow,34,p.farForearm+br);
  const nearElbow=pointFrom(nearShoulder,39,p.nearUpperArm+br);
  const nearWrist=pointFrom(nearElbow,37,p.nearForearm+br);
  const farKnee=pointFrom(farHip,43,p.farThigh+br);
  const farAnkle=pointFrom(farKnee,44,p.farShin+br);
  const nearKnee=pointFrom(nearHip,46,p.nearThigh+br);
  const nearAnkle=pointFrom(nearKnee,46,p.nearShin+br);

  const fg=svgEl("g",{class:"far-limb"});
  line(fg,farHip,farKnee,"gear-bone",17); line(fg,farKnee,farAnkle,"gear-bone",16); circle(fg,farKnee,7,"gear-joint");
  line(fg,farShoulder,farElbow,"skin-bone",15); line(fg,farElbow,farWrist,"skin-bone",14); circle(fg,farElbow,6.5,"skin-joint"); circle(fg,farWrist,7.5,"skin-joint");
  svg.appendChild(fg);

  // Torso is intentionally drawn as a 3/4 FRONT view:
  // the near chest plane is broad/bright, the far side recedes, and
  // chest/waist landmarks make it read as the front of the body.
  polygon(svg,[farShoulder,nearShoulder,nearHip,{x:84,y:125+sy},farHip],"torso-shape");

  const hi=[{x:91,y:64+sy},{x:111,y:69+sy},{x:102,y:114+sy},{x:88,y:116+sy}].map(q=>rotatePoint(q,center,br));
  polygon(svg,hi,"torso-highlight");

  const chestA=rotatePoint({x:78,y:78+sy},center,br);
  const chestB=rotatePoint({x:94,y:75+sy},center,br);
  const chestC=rotatePoint({x:108,y:80+sy},center,br);
  const sternumTop=rotatePoint({x:91,y:72+sy},center,br);
  const sternumBottom=rotatePoint({x:91,y:108+sy},center,br);
  const waistL=rotatePoint({x:76,y:112+sy},center,br);
  const waistR=rotatePoint({x:102,y:116+sy},center,br);

  svg.appendChild(svgEl("path",{d:`M ${chestA.x} ${chestA.y} Q ${chestB.x} ${chestB.y-6} ${sternumTop.x} ${sternumTop.y+7}`,class:"chest-mark"}));
  svg.appendChild(svgEl("path",{d:`M ${sternumTop.x} ${sternumTop.y+7} Q ${chestC.x} ${chestC.y-5} ${chestC.x+3} ${chestC.y+3}`,class:"chest-mark"}));
  svg.appendChild(svgEl("line",{x1:sternumTop.x,y1:sternumTop.y,x2:sternumBottom.x,y2:sternumBottom.y,class:"chest-line"}));
  svg.appendChild(svgEl("path",{d:`M ${waistL.x} ${waistL.y} Q ${(waistL.x+waistR.x)/2} ${(waistL.y+waistR.y)/2+4} ${waistR.x} ${waistR.y}`,class:"waist-line"}));

  line(svg,neck,headCenter,"skin-bone",12);

  // Head also reads 3/4 FRONT: the visible ear sits on the rear edge,
  // while both eyes, projecting nose and mouth sit on the opponent-facing plane.
  const headAngle=p.headTilt+br;
  svg.appendChild(svgEl("ellipse",{cx:headCenter.x-14,cy:headCenter.y+1,rx:5.2,ry:7.5,class:"ear-shape",transform:`rotate(${headAngle} ${headCenter.x} ${headCenter.y})`}));
  svg.appendChild(svgEl("ellipse",{cx:headCenter.x,cy:headCenter.y,rx:19,ry:22,class:"head-shape",transform:`rotate(${headAngle} ${headCenter.x} ${headCenter.y})`}));
  svg.appendChild(svgEl("path",{d:`M ${headCenter.x-17} ${headCenter.y-8} Q ${headCenter.x-2} ${headCenter.y-24} ${headCenter.x+16} ${headCenter.y-10} L ${headCenter.x+13} ${headCenter.y-16} Q ${headCenter.x-1} ${headCenter.y-25} ${headCenter.x-15} ${headCenter.y-13} Z`,class:"hair-shape"}));
  svg.appendChild(svgEl("circle",{cx:headCenter.x+8,cy:headCenter.y-2,r:2.7,class:"face-eye"}));
  svg.appendChild(svgEl("circle",{cx:headCenter.x-1,cy:headCenter.y-3,r:2.1,class:"face-eye",opacity:.72}));
  svg.appendChild(svgEl("path",{d:`M ${headCenter.x+10} ${headCenter.y} Q ${headCenter.x+17} ${headCenter.y+2} ${headCenter.x+18} ${headCenter.y+5} Q ${headCenter.x+15} ${headCenter.y+7} ${headCenter.x+11} ${headCenter.y+6}`,class:"face-nose"}));
  svg.appendChild(svgEl("path",{d:`M ${headCenter.x+5} ${headCenter.y+12} Q ${headCenter.x+10} ${headCenter.y+14} ${headCenter.x+14} ${headCenter.y+11}`,class:"mouth-line"}));

  const ng=svgEl("g",{class:"near-limb"});
  line(ng,nearHip,nearKnee,"gear-bone",19); line(ng,nearKnee,nearAnkle,"gear-bone",18); circle(ng,nearKnee,7.5,"gear-joint");
  line(ng,nearShoulder,nearElbow,"skin-bone",17); line(ng,nearElbow,nearWrist,"skin-bone",16); circle(ng,nearElbow,7,"skin-joint"); circle(ng,nearWrist,8.5,"skin-joint");
  svg.appendChild(ng);

  function bootAt(ankle,front=true){
    const dir=front?1:.7;
    svg.appendChild(svgEl("path",{d:`M ${ankle.x-7} ${ankle.y-2} L ${ankle.x+7} ${ankle.y-2} L ${ankle.x+19*dir} ${ankle.y+6} L ${ankle.x+17*dir} ${ankle.y+12} L ${ankle.x-8} ${ankle.y+11} Z`,class:"boot-shape"}));
  }
  bootAt(farAnkle,false);bootAt(nearAnkle,true);
  f.element.style.left=`${p.x}%`;
}

    function renderAll() {
      renderFighter(fighters.player);
      renderFighter(fighters.cpu);
    }

    function easeInOut(t) {
      return t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    }

    function animateTo(f, patch, duration = 180) {
      const token = ++f.animToken;
      const start = { ...f.pose };
      const target = { ...f.pose, ...patch };
      const keys = Object.keys(target).filter(k => typeof target[k] === "number");
      const t0 = performance.now();

      return new Promise(resolve => {
        function frame(now) {
          if (token !== f.animToken) return resolve();
          const raw = Math.min(1, (now - t0) / Math.max(1, duration));
          const e = easeInOut(raw);

          for (const k of keys) {
            const a = start[k] ?? 0;
            const b = target[k];
            f.pose[k] = a + (b - a) * e;
          }

          f.element.style.left = `${f.pose.x}%`;

        renderFighter(f);
        return Promise.resolve();

      return animateTo(f, target, duration);

    // ============================================================
    // V2.2.1 COMBAT FLOW REPAIR
    // Restores the V1/V2 input -> CPU -> RPS -> SVG move pipeline
    // that was accidentally removed during the V2.2 rig conversion.
    // ============================================================

    actionButtons.forEach(button => {
      button.addEventListener("click", () => {
        handlePlayerInput(button.dataset.action);
      });
    });

    function handlePlayerInput(playerAction) {
      if (exchangeLocked || matchOver) return;

      exchangeLocked = true;
      setActionButtonsEnabled(false);

      const cpuAction = chooseCpuAction();
      const result = determineExchangeWinner(playerAction, cpuAction);

      choiceDisplay.textContent =
        `Player chose ${ACTION_LABELS[playerAction]} • CPU chose ${ACTION_LABELS[cpuAction]}`;

      // The exchange function owns the complete async animation/damage flow.
      resolveExchange(result, playerAction, cpuAction).catch(error => {
        console.error("Exchange failed:", error);

        // Fail safely instead of leaving the match permanently locked.
        hideImpact();
        hideMoveName();
        if (!matchOver) {
          exchangeLocked = false;
          roundResult.textContent = "Animation error — choose your action again.";
          setActionButtonsEnabled(true);
        }
      });
    }

    function chooseCpuAction() {
      const actions = ["strike", "grapple", "counter"];
      return actions[Math.floor(Math.random() * actions.length)];
    }

    function determineExchangeWinner(playerAction, cpuAction) {
      if (playerAction === cpuAction) return "draw";

      const playerWins =
        (playerAction === "strike" && cpuAction === "counter") ||
        (playerAction === "counter" && cpuAction === "grapple") ||
        (playerAction === "grapple" && cpuAction === "strike");

      return playerWins ? "player" : "cpu";
    }

    async function resolveExchange(result, playerAction, cpuAction) {
      if (result === "draw") {
        roundResult.textContent = "Draw! No damage.";
        await playDrawAnimation();
        finishExchange();
        return;
      }

      const winnerAction = result === "player" ? playerAction : cpuAction;
      const damageAmount = DAMAGE[winnerAction];
      const move = pickMove(winnerAction);

      if (result === "player") {
        roundResult.textContent =
          `Player wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());

        await move.play("player");
        applyDamage("cpu", damageAmount);
      } else {
        roundResult.textContent =
          `CPU wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());

        await move.play("cpu");
        applyDamage("player", damageAmount);
      }

      updateHealthUI();

      if (checkMatchEnd()) return;

      await wait(420);
      finishExchange();
    }

    async function playDrawAnimation() {
      const p = fighters.player;
      const c = fighters.cpu;

      await dualTo(

          farForearm: 68,

      showImpactBetween("player", "BLOCK!");
      await wait(140);
      await recoverBoth();
    }

    // ============================================================
    // V1 DAMAGE - UNCHANGED
    // ============================================================
    function applyDamage(target, amount) {
      if (target === "player") playerHealth = Math.max(0, playerHealth - amount);
      else cpuHealth = Math.max(0, cpuHealth - amount);
    }

    // ============================================================
    // V1 HEALTH / UI - UNCHANGED
    // ============================================================
    function updateHealthUI() {
      playerHealthBar.style.width = `${playerHealth}%`;
      cpuHealthBar.style.width = `${cpuHealth}%`;
      playerHpText.textContent = `${playerHealth} HP`;
      cpuHpText.textContent = `${cpuHealth} HP`;
      updateHealthBarColor(playerHealthBar, playerHealth);
      updateHealthBarColor(cpuHealthBar, cpuHealth);
    }

    function updateHealthBarColor(element, health) {
      element.style.background = health <= 30
        ? "linear-gradient(90deg, #d63a3a, var(--health-low))"
        : "linear-gradient(90deg, #37b957, var(--health))";
    }

    // ============================================================
    // V1 MATCH ENDING - UNCHANGED
    // ============================================================
    function checkMatchEnd() {
      if (playerHealth > 0 && cpuHealth > 0) return false;
      endMatch(playerHealth <= 0 ? "cpu" : "player");
      return true;
    }

    function endMatch(winner) {
      matchOver = true;
      exchangeLocked = true;
      setActionButtonsEnabled(false);
      hideMoveName();

      if (winner === "player") {
        roundResult.textContent = "PLAYER WINS THE MATCH!";
        choiceDisplay.textContent = "The CPU's health reached 0.";
      } else {
        roundResult.textContent = "CPU WINS THE MATCH!";
        choiceDisplay.textContent = "Your health reached 0.";
      }

      restartButton.style.display = "inline-block";
    }

    // ============================================================
    // V1 RESTART - UNCHANGED BEHAVIOR
    // ============================================================
    restartButton.addEventListener("click", restartMatch);

    function restartMatch() {
      playerHealth = MAX_HEALTH;
      cpuHealth = MAX_HEALTH;
      exchangeLocked = false;
      matchOver = false;
      hideImpact();
      hideMoveName();
      resetFighter(fighters.player, 0);
      resetFighter(fighters.cpu, 0);
      updateHealthUI();
      roundResult.textContent = "Choose your action.";
      choiceDisplay.textContent = "Strike beats Counter • Counter beats Grapple • Grapple beats Strike";
      restartButton.style.display = "none";
      setActionButtonsEnabled(true);
    }

    // ============================================================
    // EXCHANGE HELPERS
    // ============================================================
    function finishExchange() {
      if (matchOver) return;
      exchangeLocked = false;
      roundResult.textContent = "Choose your next action.";
      setActionButtonsEnabled(true);
    }

    function setActionButtonsEnabled(enabled) {
      actionButtons.forEach(button => button.disabled = !enabled);
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    // ============================================================
    // INITIAL SETUP
    // ============================================================
    resetFighter(fighters.player, 0);
    resetFighter(fighters.cpu, 0);
    updateHealthUI();
  </script>
</body>
</html>
