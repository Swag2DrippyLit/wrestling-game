<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Wrestling Combat Prototype - Version 2</title>
  <style>
    :root {
      --bg: #111722;
      --panel: #1a2230;
      --text: #f4f7fb;
      --muted: #aeb8c7;
      --ring-mat: #d9e6ef;
      --ring-edge: #57697c;
      --rope: #e7edf3;
      --player: #2f7df6;
      --cpu: #e34e4e;
      --health: #53d769;
      --health-low: #ff5a5a;
      --button: #2a3445;
      --button-hover: #39465b;
      --accent: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c2635 0%, var(--bg) 58%), var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 14px;
      overflow-x: hidden;
    }

    .game-shell { width: min(980px, 100%); }

    .title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: 0.5px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 14px;
    }

    .fighter-card {
      background: rgba(26, 34, 48, 0.96);
      border: 1px solid #344154;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 10px 26px rgba(0,0,0,.22);
    }

    .fighter-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .health-track {
      height: 22px;
      background: #0e131c;
      border: 2px solid #4d5b6e;
      border-radius: 999px;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #37b957, var(--health));
      transition: width 260ms ease, background 260ms ease;
    }

    .arena {
      position: relative;
      height: clamp(350px, 54vw, 520px);
      min-height: 350px;
      overflow: hidden;
      border-radius: 18px;
      background: linear-gradient(to bottom, #33455d 0 42%, #252d38 42% 100%);
      border: 1px solid #3f4e62;
      box-shadow: 0 16px 36px rgba(0,0,0,.28);
    }

    .crowd {
      position: absolute;
      inset: 0 0 auto 0;
      height: 43%;
      opacity: .55;
      background:
        radial-gradient(circle at 8% 35%, #c4cad4 0 3px, transparent 4px),
        radial-gradient(circle at 18% 50%, #9aa5b6 0 3px, transparent 4px),
        radial-gradient(circle at 30% 28%, #d1d5dd 0 3px, transparent 4px),
        radial-gradient(circle at 42% 52%, #9da8b7 0 3px, transparent 4px),
        radial-gradient(circle at 53% 33%, #cbd0d9 0 3px, transparent 4px),
        radial-gradient(circle at 65% 48%, #a7b1c1 0 3px, transparent 4px),
        radial-gradient(circle at 79% 31%, #d5d9e0 0 3px, transparent 4px),
        radial-gradient(circle at 91% 53%, #9ea9b9 0 3px, transparent 4px);
      background-size: 120px 78px;
    }

    .ring {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 8%;
      height: 59%;
    }

    .ring-mat {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 0;
      height: 55%;
      background: linear-gradient(#edf4f8, var(--ring-mat));
      border: 5px solid var(--ring-edge);
      box-shadow: 0 15px 0 #313c49;
    }

    .ring-skirt {
      position: absolute;
      left: 4%; right: 4%; bottom: -18px;
      height: 42px;
      background: linear-gradient(#253142, #151b24);
      border: 4px solid #313c49;
      border-top: none;
    }

    .post {
      position: absolute;
      bottom: 10%;
      width: 14px;
      height: 82%;
      background: #3a4658;
      border: 3px solid #222a35;
      border-radius: 3px;
      z-index: 3;
    }
    .post.left { left: 2%; }
    .post.right { right: 2%; }

    .rope {
      position: absolute;
      left: 3%; right: 3%;
      height: 4px;
      background: var(--rope);
      box-shadow: 0 1px 2px rgba(0,0,0,.6);
      z-index: 2;
    }
    .rope.top { bottom: 76%; }
    .rope.mid { bottom: 58%; }
    .rope.low { bottom: 40%; }

    /* ==========================================================
       ARTICULATED WRESTLER
       Each segment is independently transformable by JavaScript.
       ========================================================== */

    .fighter {
      position: absolute;
      bottom: 20%;
      width: 92px;
      height: 166px;
      z-index: 5;
      transform-origin: 50% 92%;
      pointer-events: none;
    }

    .fighter.player { left: 24%; }
    .fighter.cpu { left: 66%; }

    .fighter-root {
      position: absolute;
      inset: 0;
      transform-origin: 46px 152px;
    }

    .segment {
      position: absolute;
      transform-origin: top center;
      will-change: transform;
    }

    .torso {
      left: 29px;
      top: 41px;
      width: 38px;
      height: 62px;
      border: 3px solid #202733;
      border-radius: 13px 13px 9px 9px;
      transform-origin: 50% 82%;
      z-index: 5;
    }

    .player .torso { background: var(--player); }
    .cpu .torso { background: var(--cpu); }

    .head {
      left: 31px;
      top: 7px;
      width: 34px;
      height: 36px;
      border-radius: 48% 48% 45% 45%;
      background: #e8b18e;
      border: 3px solid #202733;
      transform-origin: 50% 90%;
      z-index: 8;
    }

    .hair {
      position: absolute;
      left: 4px; right: 4px; top: -1px;
      height: 10px;
      border-radius: 50% 50% 15% 15%;
      background: #372b27;
    }

    .eye {
      position: absolute;
      top: 15px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #222;
    }
    .eye.a { left: 8px; }
    .eye.b { right: 8px; }

    .upper-arm, .forearm, .upper-leg, .lower-leg {
      width: 12px;
      border: 3px solid #202733;
      border-radius: 8px;
    }

    .upper-arm, .forearm { background: #e8b18e; }
    .upper-leg, .lower-leg { background: #1b2230; }

    .upper-arm {
      top: 45px;
      height: 38px;
      z-index: 4;
    }
    .upper-arm.left { left: 21px; }
    .upper-arm.right { left: 63px; }

    .forearm {
      top: 76px;
      height: 38px;
      z-index: 3;
    }
    .forearm.left { left: 19px; }
    .forearm.right { left: 65px; }

    .upper-leg {
      top: 99px;
      height: 38px;
      z-index: 3;
    }
    .upper-leg.left { left: 33px; }
    .upper-leg.right { left: 51px; }

    .lower-leg {
      top: 130px;
      height: 36px;
      z-index: 2;
    }
    .lower-leg.left { left: 31px; }
    .lower-leg.right { left: 53px; }

    .joint {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e8b18e;
      border: 2px solid #202733;
      z-index: 7;
      pointer-events: none;
    }

    .joint.elbow-left { left: 20px; top: 76px; }
    .joint.elbow-right { left: 66px; top: 76px; }
    .joint.knee-left, .joint.knee-right { background: #1b2230; }
    .joint.knee-left { left: 32px; top: 130px; }
    .joint.knee-right { left: 54px; top: 130px; }

    .boot {
      position: absolute;
      width: 23px;
      height: 10px;
      bottom: -1px;
      background: #111722;
      border: 3px solid #202733;
      border-radius: 5px 8px 4px 4px;
      z-index: 8;
    }
    .boot.left { left: 23px; }
    .boot.right { left: 51px; }

    .fighter.cpu .fighter-root {
      transform: scaleX(-1);
    }

    .fighter-nameplate {
      position: absolute;
      left: 50%;
      bottom: -24px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      color: #26303c;
      background: rgba(255,255,255,.76);
      border-radius: 5px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .impact {
      position: absolute;
      z-index: 20;
      display: none;
      font-size: clamp(28px, 6vw, 54px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 3px 3px 0 #1c1c1c;
      pointer-events: none;
    }

    .move-name {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12,17,25,.75);
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 800;
      letter-spacing: .7px;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }
    .move-name.show { opacity: 1; }

    .status-panel {
      margin-top: 14px;
      padding: 16px;
      min-height: 112px;
      background: rgba(26,34,48,.96);
      border: 1px solid #344154;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 26px rgba(0,0,0,.2);
    }

    .round-result {
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 800;
      margin-bottom: 7px;
    }

    .choices {
      color: var(--muted);
      min-height: 22px;
      line-height: 1.5;
    }

    .controls {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 58px;
      border: 1px solid #46556a;
      border-radius: 12px;
      background: var(--button);
      color: var(--text);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) { background: var(--button-hover); transform: translateY(-2px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .48; cursor: not-allowed; }

    .restart-wrap { margin-top: 12px; text-align: center; }
    #restartButton {
      display: none;
      min-width: 210px;
      padding: 0 24px;
      background: #3b8b4a;
      border-color: #58a968;
    }

    .footer-note {
      margin-top: 12px;
      text-align: center;
      color: #7e8a9d;
      font-size: 13px;
    }

    @media (max-width: 620px) {
      body { padding: 14px 10px; }
      .hud { gap: 10px; }
      .fighter-card { padding: 10px; }
      .fighter { transform: scale(.85); transform-origin: center bottom; }
      .fighter.player { left: 16%; }
      .fighter.cpu { left: 64%; }
      .controls { gap: 8px; }
      button { min-height: 54px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1 class="title">2D Wrestling Combat Prototype</h1>

    <!-- V1 HEALTH HUD: gameplay values unchanged -->
    <section class="hud">
      <div class="fighter-card">
        <div class="fighter-label"><span>PLAYER</span><span id="playerHpText">100 HP</span></div>
        <div class="health-track"><div id="playerHealth" class="health-fill"></div></div>
      </div>
      <div class="fighter-card">
        <div class="fighter-label"><span>CPU</span><span id="cpuHpText">100 HP</span></div>
        <div class="health-track"><div id="cpuHealth" class="health-fill"></div></div>
      </div>
    </section>

    <section class="arena">
      <div class="crowd"></div>
      <div class="ring" id="ring">
        <div class="rope top"></div>
        <div class="rope mid"></div>
        <div class="rope low"></div>
        <div class="post left"></div>
        <div class="post right"></div>
        <div class="ring-mat"></div>
        <div class="ring-skirt"></div>

        <div id="moveName" class="move-name"></div>

        <!-- Articulated Player -->
        <div id="playerFighter" class="fighter player" aria-label="Player wrestler">
          <div class="fighter-root">
            <div class="head segment" data-part="head"><div class="hair"></div><div class="eye a"></div><div class="eye b"></div></div>
            <div class="torso segment" data-part="torso"></div>
            <div class="upper-arm left segment" data-part="upperArmL"></div>
            <div class="forearm left segment" data-part="forearmL"></div>
            <div class="upper-arm right segment" data-part="upperArmR"></div>
            <div class="forearm right segment" data-part="forearmR"></div>
            <div class="upper-leg left segment" data-part="upperLegL"></div>
            <div class="lower-leg left segment" data-part="lowerLegL"></div>
            <div class="upper-leg right segment" data-part="upperLegR"></div>
            <div class="lower-leg right segment" data-part="lowerLegR"></div>
            <div class="joint elbow-left"></div><div class="joint elbow-right"></div>
            <div class="joint knee-left"></div><div class="joint knee-right"></div>
            <div class="boot left"></div><div class="boot right"></div>
          </div>
          <div class="fighter-nameplate">PLAYER</div>
        </div>

        <!-- Articulated CPU -->
        <div id="cpuFighter" class="fighter cpu" aria-label="CPU wrestler">
          <div class="fighter-root">
            <div class="head segment" data-part="head"><div class="hair"></div><div class="eye a"></div><div class="eye b"></div></div>
            <div class="torso segment" data-part="torso"></div>
            <div class="upper-arm left segment" data-part="upperArmL"></div>
            <div class="forearm left segment" data-part="forearmL"></div>
            <div class="upper-arm right segment" data-part="upperArmR"></div>
            <div class="forearm right segment" data-part="forearmR"></div>
            <div class="upper-leg left segment" data-part="upperLegL"></div>
            <div class="lower-leg left segment" data-part="lowerLegL"></div>
            <div class="upper-leg right segment" data-part="upperLegR"></div>
            <div class="lower-leg right segment" data-part="lowerLegR"></div>
            <div class="joint elbow-left"></div><div class="joint elbow-right"></div>
            <div class="joint knee-left"></div><div class="joint knee-right"></div>
            <div class="boot left"></div><div class="boot right"></div>
          </div>
          <div class="fighter-nameplate">CPU</div>
        </div>

        <div id="impact" class="impact">BAM!</div>
      </div>
    </section>

    <section class="status-panel" aria-live="polite">
      <div id="roundResult" class="round-result">Choose your action.</div>
      <div id="choiceDisplay" class="choices">Strike beats Counter • Counter beats Grapple • Grapple beats Strike</div>
    </section>

    <section class="controls">
      <button class="action-button" data-action="strike">Strike</button>
      <button class="action-button" data-action="grapple">Grapple</button>
      <button class="action-button" data-action="counter">Counter</button>
    </section>

    <div class="restart-wrap"><button id="restartButton">Restart Match</button></div>
    <div class="footer-note">Version 2 — Articulated wrestlers + reusable move animation system</div>
  </main>

  <script>
    // ============================================================
    // V1 GAME STATE - UNCHANGED GAMEPLAY VALUES
    // ============================================================
    const MAX_HEALTH = 100;
    const DAMAGE = { strike: 10, grapple: 15, counter: 12 };
    const ACTION_LABELS = { strike: "Strike", grapple: "Grapple", counter: "Counter" };

    let playerHealth = MAX_HEALTH;
    let cpuHealth = MAX_HEALTH;
    let exchangeLocked = false;
    let matchOver = false;

    // ============================================================
    // DOM REFERENCES
    // ============================================================
    const playerHealthBar = document.getElementById("playerHealth");
    const cpuHealthBar = document.getElementById("cpuHealth");
    const playerHpText = document.getElementById("playerHpText");
    const cpuHpText = document.getElementById("cpuHpText");
    const playerFighter = document.getElementById("playerFighter");
    const cpuFighter = document.getElementById("cpuFighter");
    const impact = document.getElementById("impact");
    const moveName = document.getElementById("moveName");
    const roundResult = document.getElementById("roundResult");
    const choiceDisplay = document.getElementById("choiceDisplay");
    const actionButtons = [...document.querySelectorAll(".action-button")];
    const restartButton = document.getElementById("restartButton");

    // ============================================================
    // V2 ARTICULATED FIGHTER CONTROLLERS
    // ============================================================
    function createFighterController(element, homeX) {
      const parts = {};
      element.querySelectorAll("[data-part]").forEach(el => parts[el.dataset.part] = el);
      return { element, root: element.querySelector(".fighter-root"), parts, homeX, x: homeX, y: 0, rot: 0, scaleX: 1 };
    }

    const fighters = {
      player: createFighterController(playerFighter, 24),
      cpu: createFighterController(cpuFighter, 66)
    };

    const IDLE_POSE = {
      rootRot: 0, rootY: 0,
      head: 0, torso: 0,
      upperArmL: 8, forearmL: 4,
      upperArmR: -8, forearmR: -4,
      upperLegL: 3, lowerLegL: -2,
      upperLegR: -3, lowerLegR: 2
    };

    function applyPose(fighter, pose = {}, duration = 180, easing = "ease") {
      fighter.element.style.transition = `left ${duration}ms ${easing}, bottom ${duration}ms ${easing}, transform ${duration}ms ${easing}`;
      if (pose.x !== undefined) fighter.x = pose.x;
      if (pose.y !== undefined) fighter.y = pose.y;
      if (pose.rootRot !== undefined) fighter.rot = pose.rootRot;

      fighter.element.style.left = `${fighter.x}%`;
      fighter.element.style.bottom = `calc(20% + ${fighter.y}px)`;
      fighter.element.style.transform = `rotate(${fighter.rot}deg)`;

      const rootScale = fighter.element.classList.contains("cpu") ? -1 : 1;
      fighter.root.style.transition = `transform ${duration}ms ${easing}`;
      fighter.root.style.transform = `scaleX(${rootScale}) translateY(${pose.rootY || 0}px)`;

      for (const [partName, partEl] of Object.entries(fighter.parts)) {
        const angle = pose[partName] !== undefined ? pose[partName] : (IDLE_POSE[partName] || 0);
        partEl.style.transition = `transform ${duration}ms ${easing}`;
        partEl.style.transform = `rotate(${angle}deg)`;
      }
    }

    function resetFighter(fighter, duration = 220) {
      applyPose(fighter, { ...IDLE_POSE, x: fighter.homeX, y: 0, rootRot: 0 }, duration, "ease-out");
    }

    async function poseStep(fighter, pose, duration = 180, hold = 0, easing = "ease") {
      applyPose(fighter, pose, duration, easing);
      await wait(duration + hold);
    }

    async function dualPoseStep(a, poseA, b, poseB, duration = 180, hold = 0, easing = "ease") {
      applyPose(a, poseA, duration, easing);
      applyPose(b, poseB, duration, easing);
      await wait(duration + hold);
    }

    // ============================================================
    // V2 MOVE LIBRARY
    // Each category contains multiple visual moves. Damage still comes
    // only from the V1 action category, never from the individual move.
    // ============================================================
    const MOVE_LIBRARY = {
      strike: [
        { name: "Straight Punch", play: movePunch },
        { name: "Clothesline", play: moveClothesline },
        { name: "Front Kick", play: moveKick }
      ],
      grapple: [
        { name: "Body Slam", play: moveBodySlam },
        { name: "Suplex", play: moveSuplex },
        { name: "DDT", play: moveDDT }
      ],
      counter: [
        { name: "Slip & Strike", play: moveDodgeStrike },
        { name: "Reversal Shove", play: moveReversalShove },
        { name: "Counter Takedown", play: moveCounterTakedown }
      ]
    };

    function pickMove(action) {
      const options = MOVE_LIBRARY[action];
      return options[Math.floor(Math.random() * options.length)];
    }

    function opponentOf(side) { return side === "player" ? "cpu" : "player"; }
    function approachX(side, amount = 10) { return fighters[side].homeX + (side === "player" ? amount : -amount); }
    function retreatX(side, amount = 4) { return fighters[side].homeX + (side === "player" ? -amount : amount); }

    function showMoveName(text) {
      moveName.textContent = text;
      moveName.classList.add("show");
    }
    function hideMoveName() { moveName.classList.remove("show"); }

    function showImpactBetween(attackerSide, text = "BAM!") {
      impact.textContent = text;
      impact.style.display = "block";
      impact.style.left = attackerSide === "player" ? "52%" : "38%";
      impact.style.top = "34%";
    }
    function hideImpact() { impact.style.display = "none"; }

    async function recoverBoth() {
      hideImpact();
      applyPose(fighters.player, { ...IDLE_POSE, x: fighters.player.homeX, y: 0, rootRot: 0 }, 300, "ease-out");
      applyPose(fighters.cpu, { ...IDLE_POSE, x: fighters.cpu.homeX, y: 0, rootRot: 0 }, 300, "ease-out");
      await wait(340);
      hideMoveName();
    }

    // ---------------- STRIKES ----------------
    async function movePunch(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await poseStep(a, { x: approachX(attackerSide, 7), torso: -10, upperArmR: -65, forearmR: -55, upperArmL: 18, forearmL: 18, upperLegL: 12, upperLegR: -10 }, 180, 40);
      await dualPoseStep(a, { x: approachX(attackerSide, 10), torso: 12, upperArmR: -98, forearmR: -84, upperArmL: 30 }, d, { x: retreatX(defenderSide, 1), rootRot: defenderSide === "player" ? -8 : 8, head: defenderSide === "player" ? -30 : 30, torso: defenderSide === "player" ? -16 : 16, upperArmL: 24, upperArmR: -24 }, 120, 120, "ease-out");
      showImpactBetween(attackerSide, "POW!");
      await wait(180);
      await dualPoseStep(a, { x: approachX(attackerSide, 7), torso: -2, upperArmR: -35, forearmR: -20 }, d, { x: retreatX(defenderSide, 3), rootRot: defenderSide === "player" ? -5 : 5, head: defenderSide === "player" ? -12 : 12, torso: defenderSide === "player" ? -8 : 8 }, 190, 50);
      await recoverBoth();
    }

    async function moveClothesline(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await poseStep(a, { x: approachX(attackerSide, 5), torso: -8, upperArmR: -82, forearmR: -78, upperLegL: 18, upperLegR: -14 }, 170, 30);
      await dualPoseStep(a, { x: approachX(attackerSide, 12), torso: 8, upperArmR: -95, forearmR: -90, upperArmL: -15 }, d, { x: retreatX(defenderSide, 2), y: 4, rootRot: defenderSide === "player" ? -38 : 38, head: defenderSide === "player" ? -30 : 30, upperArmL: 65, upperArmR: -65, upperLegL: -18, upperLegR: 18 }, 150, 80, "ease-in");
      showImpactBetween(attackerSide, "WHAM!");
      await dualPoseStep(a, { x: approachX(attackerSide, 10), torso: 0, upperArmR: -40 }, d, { x: retreatX(defenderSide, 6), y: -24, rootRot: defenderSide === "player" ? -82 : 82, head: defenderSide === "player" ? -18 : 18, torso: 0, upperArmL: 90, upperArmR: -90, upperLegL: 35, upperLegR: -35 }, 240, 180, "ease-in");
      await recoverBoth();
    }

    async function moveKick(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await poseStep(a, { x: approachX(attackerSide, 7), torso: -10, upperArmL: 25, upperArmR: -25, upperLegR: -32, lowerLegR: 55 }, 180, 50);
      await dualPoseStep(a, { x: approachX(attackerSide, 9), torso: 8, upperLegR: -72, lowerLegR: -28, upperArmL: 34, upperArmR: -34 }, d, { x: retreatX(defenderSide, 2), rootRot: defenderSide === "player" ? -15 : 15, torso: defenderSide === "player" ? -25 : 25, head: defenderSide === "player" ? -18 : 18 }, 130, 130, "ease-out");
      showImpactBetween(attackerSide, "THUD!");
      await wait(150);
      await recoverBoth();
    }

    // ---------------- GRAPPLES ----------------
    async function grappleSetup(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await dualPoseStep(a, { x: approachX(attackerSide, 9), torso: -8, upperArmL: -48, forearmL: -52, upperArmR: -65, forearmR: -55 }, d, { x: approachX(defenderSide, 8), torso: 5, upperArmL: 18, upperArmR: -18 }, 220, 70);
      return { a, d, defenderSide };
    }

    async function moveBodySlam(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);
      await dualPoseStep(a, { x: approachX(attackerSide, 11), y: -4, torso: 18, upperArmL: -95, forearmL: -60, upperArmR: -95, forearmR: -60, upperLegL: 25, upperLegR: -25 }, d, { x: approachX(defenderSide, 11), y: 24, rootRot: defenderSide === "player" ? -68 : 68, upperArmL: 80, upperArmR: -80, upperLegL: 24, upperLegR: -24 }, 230, 100, "ease-out");
      await dualPoseStep(a, { x: approachX(attackerSide, 9), y: 0, torso: -14, upperArmL: -35, upperArmR: -55 }, d, { x: retreatX(defenderSide, 2), y: -28, rootRot: defenderSide === "player" ? -92 : 92, upperArmL: 100, upperArmR: -100, upperLegL: 50, upperLegR: -50 }, 210, 80, "ease-in");
      showImpactBetween(attackerSide, "SLAM!");
      await wait(240);
      await recoverBoth();
    }

    async function moveSuplex(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);
      await dualPoseStep(a, { x: approachX(attackerSide, 11), y: -6, rootRot: attackerSide === "player" ? -12 : 12, torso: -22, upperArmL: -90, upperArmR: -110, upperLegL: 28, upperLegR: -28 }, d, { x: approachX(defenderSide, 11), y: 50, rootRot: defenderSide === "player" ? -132 : 132, head: 10, upperArmL: 75, upperArmR: -75, upperLegL: 45, upperLegR: -45 }, 260, 110, "ease-out");
      await dualPoseStep(a, { x: approachX(attackerSide, 7), y: -14, rootRot: attackerSide === "player" ? -42 : 42, torso: -15, upperLegL: 50, upperLegR: -50 }, d, { x: retreatX(defenderSide, 1), y: 12, rootRot: defenderSide === "player" ? -205 : 205, upperArmL: 110, upperArmR: -110, upperLegL: 60, upperLegR: -60 }, 250, 70, "ease-in-out");
      await dualPoseStep(a, { x: approachX(attackerSide, 5), y: -22, rootRot: attackerSide === "player" ? -70 : 70, torso: 5 }, d, { x: retreatX(defenderSide, 5), y: -34, rootRot: defenderSide === "player" ? -270 : 270, upperArmL: 105, upperArmR: -105, upperLegL: 65, upperLegR: -65 }, 220, 50, "ease-in");
      showImpactBetween(attackerSide, "BOOM!");
      await wait(260);
      await recoverBoth();
    }

    async function moveDDT(attackerSide) {
      const { a, d, defenderSide } = await grappleSetup(attackerSide);
      await dualPoseStep(a, { x: approachX(attackerSide, 11), torso: 18, upperArmR: -105, forearmR: -80, upperArmL: -55 }, d, { x: approachX(defenderSide, 11), y: 5, rootRot: defenderSide === "player" ? -38 : 38, head: defenderSide === "player" ? -20 : 20, torso: defenderSide === "player" ? -25 : 25 }, 180, 90);
      await dualPoseStep(a, { x: approachX(attackerSide, 7), y: -20, rootRot: attackerSide === "player" ? -55 : 55, upperArmR: -120, upperLegL: 55, upperLegR: -50 }, d, { x: approachX(defenderSide, 8), y: -23, rootRot: defenderSide === "player" ? -92 : 92, head: defenderSide === "player" ? -30 : 30, upperArmL: 70, upperArmR: -70, upperLegL: 40, upperLegR: -40 }, 230, 70, "ease-in");
      showImpactBetween(attackerSide, "DDT!");
      await wait(260);
      await recoverBoth();
    }

    // ---------------- COUNTERS ----------------
    async function moveDodgeStrike(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await dualPoseStep(d, { x: approachX(defenderSide, 8), torso: 8, upperArmR: -85, forearmR: -70 }, a, { x: retreatX(attackerSide, 2), y: -3, rootRot: attackerSide === "player" ? -18 : 18, torso: attackerSide === "player" ? -30 : 30, upperLegL: 18, upperLegR: -18 }, 170, 80);
      await poseStep(a, { x: approachX(attackerSide, 8), torso: -12, upperArmR: -85, forearmR: -75, upperArmL: 22 }, 150, 50);
      await dualPoseStep(a, { x: approachX(attackerSide, 10), torso: 14, upperArmR: -105, forearmR: -88 }, d, { x: retreatX(defenderSide, 4), rootRot: defenderSide === "player" ? -20 : 20, head: defenderSide === "player" ? -26 : 26, torso: defenderSide === "player" ? -22 : 22 }, 120, 100);
      showImpactBetween(attackerSide, "CRACK!");
      await wait(180);
      await recoverBoth();
    }

    async function moveReversalShove(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await dualPoseStep(d, { x: approachX(defenderSide, 9), upperArmL: -55, upperArmR: -70, torso: -8 }, a, { x: approachX(attackerSide, 7), upperArmL: -45, upperArmR: -45, torso: 5 }, 190, 80);
      await dualPoseStep(a, { x: approachX(attackerSide, 10), torso: 15, upperArmL: -92, forearmL: -82, upperArmR: -92, forearmR: -82 }, d, { x: retreatX(defenderSide, 6), rootRot: defenderSide === "player" ? -32 : 32, torso: defenderSide === "player" ? -24 : 24, upperArmL: 70, upperArmR: -70 }, 150, 80, "ease-out");
      showImpactBetween(attackerSide, "SHOVE!");
      await dualPoseStep(a, { x: approachX(attackerSide, 6), torso: 0 }, d, { x: retreatX(defenderSide, 8), y: -18, rootRot: defenderSide === "player" ? -76 : 76, upperLegL: 36, upperLegR: -36 }, 220, 160, "ease-in");
      await recoverBoth();
    }

    async function moveCounterTakedown(attackerSide) {
      const defenderSide = opponentOf(attackerSide);
      const a = fighters[attackerSide], d = fighters[defenderSide];
      await dualPoseStep(d, { x: approachX(defenderSide, 9), upperArmL: -65, upperArmR: -65 }, a, { x: approachX(attackerSide, 8), torso: 20, upperArmL: -75, upperArmR: -55, upperLegL: 30, upperLegR: -30 }, 190, 80);
      await dualPoseStep(a, { x: approachX(attackerSide, 10), y: -8, rootRot: attackerSide === "player" ? -28 : 28, torso: -18, upperArmL: -105, upperArmR: -90 }, d, { x: approachX(defenderSide, 10), y: 14, rootRot: defenderSide === "player" ? -75 : 75, upperArmL: 85, upperArmR: -85, upperLegL: 35, upperLegR: -35 }, 220, 70);
      await dualPoseStep(a, { x: approachX(attackerSide, 6), y: -10, rootRot: attackerSide === "player" ? -48 : 48, upperLegL: 48, upperLegR: -42 }, d, { x: retreatX(defenderSide, 4), y: -30, rootRot: defenderSide === "player" ? -115 : 115, upperArmL: 105, upperArmR: -105, upperLegL: 55, upperLegR: -55 }, 230, 80, "ease-in");
      showImpactBetween(attackerSide, "DOWN!");
      await wait(240);
      await recoverBoth();
    }

    // ============================================================
    // V1 PLAYER INPUT / CPU / RPS LOGIC - PRESERVED
    // ============================================================
    actionButtons.forEach(button => {
      button.addEventListener("click", () => handlePlayerInput(button.dataset.action));
    });

    function handlePlayerInput(playerAction) {
      if (exchangeLocked || matchOver) return;
      exchangeLocked = true;
      setActionButtonsEnabled(false);

      const cpuAction = chooseCpuAction();
      const result = determineExchangeWinner(playerAction, cpuAction);

      choiceDisplay.textContent = `Player chose ${ACTION_LABELS[playerAction]} • CPU chose ${ACTION_LABELS[cpuAction]}`;
      resolveExchange(result, playerAction, cpuAction);
    }

    function chooseCpuAction() {
      const actions = ["strike", "grapple", "counter"];
      return actions[Math.floor(Math.random() * actions.length)];
    }

    function determineExchangeWinner(playerAction, cpuAction) {
      if (playerAction === cpuAction) return "draw";

      const playerWins =
        (playerAction === "strike" && cpuAction === "counter") ||
        (playerAction === "counter" && cpuAction === "grapple") ||
        (playerAction === "grapple" && cpuAction === "strike");

      return playerWins ? "player" : "cpu";
    }

    // ============================================================
    // RESOLVE EXCHANGE - SAME RULES, V2 VISUAL MOVE SELECTION
    // ============================================================
    async function resolveExchange(result, playerAction, cpuAction) {
      if (result === "draw") {
        roundResult.textContent = "Draw! No damage.";
        await playDrawAnimation();
        finishExchange();
        return;
      }

      const winnerAction = result === "player" ? playerAction : cpuAction;
      const damageAmount = DAMAGE[winnerAction];
      const move = pickMove(winnerAction);

      if (result === "player") {
        roundResult.textContent = `Player wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());
        await move.play("player");
        applyDamage("cpu", damageAmount);
      } else {
        roundResult.textContent = `CPU wins with ${ACTION_LABELS[winnerAction]} — ${move.name}!`;
        showMoveName(move.name.toUpperCase());
        await move.play("cpu");
        applyDamage("player", damageAmount);
      }

      updateHealthUI();
      if (checkMatchEnd()) return;

      await wait(420);
      finishExchange();
    }

    async function playDrawAnimation() {
      const p = fighters.player, c = fighters.cpu;
      await dualPoseStep(p, { x: approachX("player", 5), upperArmR: -55, forearmR: -55, torso: -4 }, c, { x: approachX("cpu", 5), upperArmR: -55, forearmR: -55, torso: -4 }, 180, 100);
      showImpactBetween("player", "BLOCK!");
      await wait(180);
      await recoverBoth();
    }

    // ============================================================
    // V1 DAMAGE - UNCHANGED
    // ============================================================
    function applyDamage(target, amount) {
      if (target === "player") playerHealth = Math.max(0, playerHealth - amount);
      else cpuHealth = Math.max(0, cpuHealth - amount);
    }

    // ============================================================
    // V1 HEALTH / UI - UNCHANGED
    // ============================================================
    function updateHealthUI() {
      playerHealthBar.style.width = `${playerHealth}%`;
      cpuHealthBar.style.width = `${cpuHealth}%`;
      playerHpText.textContent = `${playerHealth} HP`;
      cpuHpText.textContent = `${cpuHealth} HP`;
      updateHealthBarColor(playerHealthBar, playerHealth);
      updateHealthBarColor(cpuHealthBar, cpuHealth);
    }

    function updateHealthBarColor(element, health) {
      element.style.background = health <= 30
        ? "linear-gradient(90deg, #d63a3a, var(--health-low))"
        : "linear-gradient(90deg, #37b957, var(--health))";
    }

    // ============================================================
    // V1 MATCH ENDING - UNCHANGED
    // ============================================================
    function checkMatchEnd() {
      if (playerHealth > 0 && cpuHealth > 0) return false;
      endMatch(playerHealth <= 0 ? "cpu" : "player");
      return true;
    }

    function endMatch(winner) {
      matchOver = true;
      exchangeLocked = true;
      setActionButtonsEnabled(false);
      hideMoveName();

      if (winner === "player") {
        roundResult.textContent = "PLAYER WINS THE MATCH!";
        choiceDisplay.textContent = "The CPU's health reached 0.";
      } else {
        roundResult.textContent = "CPU WINS THE MATCH!";
        choiceDisplay.textContent = "Your health reached 0.";
      }

      restartButton.style.display = "inline-block";
    }

    // ============================================================
    // V1 RESTART - UNCHANGED BEHAVIOR
    // ============================================================
    restartButton.addEventListener("click", restartMatch);

    function restartMatch() {
      playerHealth = MAX_HEALTH;
      cpuHealth = MAX_HEALTH;
      exchangeLocked = false;
      matchOver = false;
      hideImpact();
      hideMoveName();
      resetFighter(fighters.player, 0);
      resetFighter(fighters.cpu, 0);
      updateHealthUI();
      roundResult.textContent = "Choose your action.";
      choiceDisplay.textContent = "Strike beats Counter • Counter beats Grapple • Grapple beats Strike";
      restartButton.style.display = "none";
      setActionButtonsEnabled(true);
    }

    // ============================================================
    // EXCHANGE HELPERS
    // ============================================================
    function finishExchange() {
      if (matchOver) return;
      exchangeLocked = false;
      roundResult.textContent = "Choose your next action.";
      setActionButtonsEnabled(true);
    }

    function setActionButtonsEnabled(enabled) {
      actionButtons.forEach(button => button.disabled = !enabled);
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    // ============================================================
    // INITIAL SETUP
    // ============================================================
    resetFighter(fighters.player, 0);
    resetFighter(fighters.cpu, 0);
    updateHealthUI();
  </script>
</body>
</html>
