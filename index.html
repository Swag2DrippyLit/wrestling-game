<head>

<title>Wrestling Game v0.4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#09090c;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;left:0;top:0;width:100%;color:#fff;font-weight:900;pointer-events:none;text-shadow:0 2px 4px #000}
.bars{display:flex;justify-content:space-between;padding:10px 12px;gap:16px}
.side{width:46%} .right{text-align:right} .name{font-size:17px;margin-bottom:4px}
.bar{height:12px;background:#222;border:2px solid #eee;border-radius:4px;overflow:hidden}
.fill{height:100%;background:#ddd;width:100%} .stam{height:7px;margin-top:4px;border-width:1px} .stam .fill{background:#888}
#msg{position:fixed;top:17%;left:0;width:100%;text-align:center;color:#fff;font-size:30px;font-weight:900;text-shadow:0 3px 7px #000;pointer-events:none}
#controls{position:fixed;left:0;bottom:0;width:100%;height:43%;pointer-events:none}
.pad{position:absolute;left:18px;bottom:18px;width:156px;height:156px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff44;pointer-events:auto}
.nub{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffffff55;left:49px;top:49px}
.buttons{position:absolute;right:16px;bottom:15px;width:192px;height:170px;pointer-events:auto}
button{position:absolute;width:68px;height:68px;border-radius:50%;border:2px solid #ffffffbb;background:#0000007a;color:#fff;font-weight:900}
#strike{right:0;top:47px}#grapple{right:66px;top:0}#run{right:66px;bottom:0}#action{left:0;top:52px}
#rematch{display:none;position:fixed;left:50%;top:51%;transform:translate(-50%,-50%);width:170px;height:64px;border-radius:14px;border:3px solid #fff;background:#17171c;color:white;font-size:22px;font-weight:900;z-index:20}
#help{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:#bbb;white-space:nowrap;pointer-events:none}
@media(max-width:900px){#help{display:none}}
</style>
</head>

class Wrestler{constructor(x,y,who,human=false){Object.assign(this,{x,y,vx:0,vy:0,dir:1,hp:100,st:100,state:'idle',timer:0,down:0,attackCD:0,grab:null,pin:false,human,who})}hit(d,kx=0,ky=0,dc=.18){this.hp=clamp(this.hp-d,0,100);this.st=clamp(this.st-d*.35,0,100);this.vx+=kx;this.vy+=ky;if(Math.random()<dc||this.hp<18){this.state='down';this.down=90+Math.random()*60;this.grab=null}else{this.state='hurt';this.timer=15}}}

function strike(a,b){if(gameOver||a.attackCD>0||['down','pinned','pinning','grappled'].includes(a.state))return;if(a.grab){a.attackCD=20;a.st-=6;b.hit(8,a.dir*2.4,0,.2);return}a.state='strike';a.timer=12;a.attackCD=18;a.st-=4;if(dist(a,b)<86){a.dir=b.x>a.x?1:-1;b.hit(8+Math.random()*3,a.dir*3.4,(b.y-a.y)*.04,.2)}}

function ring(){const rw=Math.min(W*.88,820),rh=Math.min(H*.44,360),rx=(W-rw)/2,ry=H*.34;return{rx,ry,rw,rh}}
function physics(w,o){if(w.attackCD>0)w.attackCD--;if(w.timer>0&&--w.timer<=0&&['strike','hurt'].includes(w.state))w.state='idle';if(w.state==='grappled'){if(w.timer>0)w.timer--;if(w.timer<=0){w.state='idle';if(o.grab===w)o.grab=null}return}if(w.state==='down'){w.down--;if(w.down<=0&&!w.pin)w.state='idle'}if(['pinned','pinning'].includes(w.state))return;if(w.grab){w.grab.x=w.x+w.dir*42;w.grab.y=w.y+2;w.grab.vx=w.grab.vy=0}const r=ring();w.x=clamp(w.x+w.vx,r.rx+32,r.rx+r.rw-32);w.y=clamp(w.y+w.vy,r.ry+88,r.ry+r.rh-20);w.vx*=.78;w.vy*=.78;w.st=clamp(w.st+.085,0,100)}

function ai(a,b){if(gameOver||['down','pinned','grappled'].includes(a.state))return;const d=dist(a,b);if(a.grab){if(Math.random()<.05)grapple(a,b);return}if(b.state==='down'&&d<80&&b.hp<50&&Math.random()<.018){action(a,b);return}if(d>68){a.vx+=(b.x-a.x)/d*.18;a.vy+=(b.y-a.y)/d*.14}else if(Math.random()<.04)strike(a,b);else if(Math.random()<.025)grapple(a,b)}

function drawCrowd(){const r=ring();ctx.fillStyle='#0b0b0e';ctx.fillRect(0,0,W,H);for(let row=0;row<4;row++)for(let i=0;i<Math.ceil(W/34)+1;i++){let x=i*34+(row%2)*16,y=r.ry-44-row*38;ctx.fillStyle=`hsl(${(i*41+row*69)%360} 25% 32%)`;ctx.fillRect(x-10,y,20,30);ctx.fillStyle=`hsl(${25+(i%3)*10} 35% 62%)`;ctx.beginPath();ctx.arc(x,y-8,9,0,7);ctx.fill()}ctx.fillStyle='#353941';ctx.fillRect(0,r.ry-18,W,18)}
function drawRing(){const r=ring();ctx.fillStyle='#20242b';ctx.fillRect(r.rx-50,r.ry+35,r.rw+100,r.rh+75);ctx.fillStyle='#d7e1e8';ctx.fillRect(r.rx,r.ry,r.rw,r.rh);ctx.strokeStyle='#aeb4ba';ctx.lineWidth=4;[r.ry+28,r.ry+50,r.ry+72].forEach(y=>{ctx.beginPath();ctx.moveTo(r.rx-4,y);ctx.lineTo(r.rx+r.rw+4,y);ctx.stroke()});ctx.fillStyle='#111';ctx.fillRect(r.rx-9,r.ry-4,12,r.rh+28);ctx.fillRect(r.rx+r.rw-3,r.ry-4,12,r.rh+28);ctx.fillStyle='#181a20';ctx.fillRect(r.rx,r.ry+r.rh,r.rw,35);ctx.fillStyle='#eee';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('WRESTLING v0.4',r.rx+r.rw/2,r.ry+r.rh+23)}
function pt(x,y){return{x,y}}function endpoint(p,len,a){return{x:p.x+Math.sin(a)*len,y:p.y+Math.cos(a)*len}}
function drawSeg(im,a,b,width){const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),ang=Math.atan2(dx,dy);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(-ang);ctx.drawImage(im,-width/2,0,width,len);ctx.restore()}
function drawCentered(im,x,y,w,h,rot=0,flip=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function pose(w){let rootRot=0, torsoY=-36, headY=-103;
let L={ua:.35,fa:.18,th:.04,sh:.03},R={ua:-.35,fa:-.18,th:-.04,sh:-.03};
if(w.state==='strike'){R.ua=-1.25;R.fa=-1.45;rootRot=-.03*w.dir}
if(w.state==='grapple'){L.ua=.95;L.fa=.55;R.ua=-.95;R.fa=-.55}
if(w.state==='grappled'){L.ua=2.2;L.fa=2.55;R.ua=-2.2;R.fa=-2.55}
if(w.state==='hurt'){L.ua=1.1;L.fa=.7;R.ua=-1.1;R.fa=-.7;rootRot=.12*w.dir}
if(w.state==='down'||w.state==='pinned'){rootRot=-1.48*w.dir;L.ua=1.25;L.fa=.55;R.ua=-1.0;R.fa=-.45;L.th=.55;L.sh=-.45;R.th=-.35;R.sh=.4;torsoY=-18;headY=-85}
return{rootRot,torsoY,headY,L,R}}
function drawW(w){const I=imgs[w.who],r=ring(),depth=clamp((w.y-r.ry)/r.rh,0,1),s=(.88+depth*.26),P=pose(w);
ctx.save();ctx.translate(w.x,w.y);ctx.scale(s,s);ctx.rotate(P.rootRot);
ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(0,73,42,10,0,0,7);ctx.fill();
const hipL=pt(-16,18),hipR=pt(16,18),shL=pt(-38,-42),shR=pt(38,-42);
const kneeL=endpoint(hipL,63,P.L.th),ankleL=endpoint(kneeL,59,P.L.sh);
const kneeR=endpoint(hipR,63,P.R.th),ankleR=endpoint(kneeR,59,P.R.sh);
const elbowL=endpoint(shL,54,P.L.ua),wristL=endpoint(elbowL,50,P.L.fa);
const elbowR=endpoint(shR,54,P.R.ua),wristR=endpoint(elbowR,50,P.R.fa);
drawSeg(I.thigh,hipL,kneeL,35);drawSeg(I.shin,kneeL,ankleL,28);drawCentered(I.boot,ankleL.x,ankleL.y+22,44,64,P.L.sh);
drawSeg(I.thigh,hipR,kneeR,35);drawSeg(I.shin,kneeR,ankleR,28);drawCentered(I.boot,ankleR.x,ankleR.y+22,44,64,P.R.sh);
drawCentered(I.trunks,0,13,82,58,0);drawCentered(I.torso,0,P.torsoY,102,124,0);
drawSeg(I.upperarm,shL,elbowL,31);drawSeg(I.forearm,elbowL,wristL,24);drawCentered(I.hand,wristL.x,wristL.y,28,28,0);
drawSeg(I.upperarm,shR,elbowR,31);drawSeg(I.forearm,elbowR,wristR,24);drawCentered(I.hand,wristR.x,wristR.y,28,28,0);
drawCentered(I.head,0,P.headY,68,78,0,w.dir<0);
ctx.restore()}
function draw(){drawCrowd();drawRing();[p1,p2].sort((a,b)=>a.y-b.y).forEach(drawW);document.getElementById('hp1').style.width=p1.hp+'%';document.getElementById('hp2').style.width=p2.hp+'%';document.getElementById('st1').style.width=p1.st+'%';document.getElementById('st2').style.width=p2.st+'%'}
function loop(){playerControl();ai(p2,p1);physics(p1,p2);physics(p2,p1);pinLogic();draw();requestAnimationFrame(loop)}loop();
</script>
